      const inp = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500';

      const bulkBox = (hint) => (
        <div className="space-y-2">
          <textarea value={bulk} onChange={e => setBulk(e.target.value)} rows={6} placeholder={hint} className={inp + ' font-mono'} />
          <button onClick={addBulk} disabled={!bulk.trim()} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold disabled:opacity-40`}>Thêm vào danh sách</button>
        </div>
      );

      return (
        <Shell>
          <div>
            <h2 className="text-2xl font-black">Nạp từ vựng</h2>
            <p className="text-sm text-slate-400 mt-1">Nhập từ → kiểm tra danh sách chờ → lưu vào một thư mục (Deck)</p>
          </div>

          <div className="grid lg:grid-cols-2 gap-5 items-start">
            {/* BƯỚC 1: NGUỒN NHẬP */}
            <section className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4">
              <h3 className="font-black text-sm uppercase tracking-wider text-slate-400">Bước 1 · Chọn cách nhập</h3>
              <div className="grid grid-cols-4 gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                {SRC.map(s => (
                  <button key={s[0]} onClick={() => setSrc(s[0])} className={`py-2 rounded-lg text-[11px] sm:text-xs font-bold flex flex-col sm:flex-row items-center justify-center gap-1 transition ${src === s[0] ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>
                    <Icon name={s[1]} className="w-4 h-4" /><span>{s[2]}</span>
                  </button>
                ))}
              </div>

              {src === 'excel' && (
                <label className="block p-8 text-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-indigo-400 cursor-pointer space-y-2">
                  <Icon name="upload" className="w-8 h-8 mx-auto text-slate-400" />
                  <p className="text-sm font-bold">Chọn file Excel (.xls, .xlsx, .xml)</p>
                  <p className="text-xs text-slate-400">Có thể chọn nhiều file cùng lúc</p>
                  <input type="file" multiple accept=".xls,.xlsx,.xml" onChange={onExcel} className="hidden" />
                </label>
              )}

              {src === 'type' && (
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-2.5">
                    <div className="col-span-2 sm:col-span-1 flex gap-1.5"><input className={inp} placeholder="Từ tiếng Anh *" value={f.w} onChange={e => setF({ ...f, w: e.target.value })} /><Mic lang="en-US" onText={t => setF(o => ({ ...o, w: t }))} /></div>
                    <div className="col-span-2 sm:col-span-1 flex gap-1.5"><input className={inp} placeholder="Nghĩa tiếng Việt" value={f.s} onChange={e => setF({ ...f, s: e.target.value })} /><Mic lang="vi-VN" onText={t => setF(o => ({ ...o, s: t }))} /></div>
                    <input className={inp} placeholder="Loại từ (n, v, adj...)" value={f.p} onChange={e => setF({ ...f, p: e.target.value })} />
                    <input className={inp} placeholder="Phiên âm /.../" value={f.i} onChange={e => setF({ ...f, i: e.target.value })} />
                    <input className={inp + ' col-span-2'} placeholder="Định nghĩa tiếng Anh (tuỳ chọn)" value={f.e} onChange={e => setF({ ...f, e: e.target.value })} />
                    <div className="col-span-2 flex gap-1.5"><input className={inp} placeholder="Câu ví dụ (tuỳ chọn)" value={f.x} onChange={e => setF({ ...f, x: e.target.value })} /><Mic lang="en-US" onText={t => setF(o => ({ ...o, x: t }))} /></div>
                  </div>
                  <button onClick={addOne} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold`}>+ Thêm từ này</button>
                  <div className="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
                    <p className="text-xs font-bold text-slate-400">Hoặc dán nhiều từ (mỗi dòng: từ - nghĩa)</p>
                    {bulkBox('accountant - kế toán\nairport - sân bay\napplicant | ứng viên')}
                  </div>
                </div>
              )}

              {src === 'image' && (
                <div className="space-y-3">
                  <div className="flex items-center gap-2 text-xs font-bold">
                    <span className="text-slate-400">Ngôn ngữ trong ảnh:</span>
                    <select value={ocrLang} onChange={e => setOcrLang(e.target.value)} className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent">
                      <option value="eng+vie">Anh + Việt</option><option value="eng">Chỉ tiếng Anh</option>
                    </select>
                  </div>
                  <label className="block p-6 text-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-indigo-400 cursor-pointer space-y-1.5">
                    <Icon name="image" className="w-8 h-8 mx-auto text-slate-400" />
                    <p className="text-sm font-bold">Chọn ảnh chứa từ vựng (hoặc dán ảnh bằng Ctrl+V)</p>
                    <p className="text-xs text-slate-400">Ảnh chụp sách, bảng từ... Mỗi dòng nên có dạng "từ - nghĩa"</p>
                    <input type="file" accept="image/*" onChange={e => { runOcr(e.target.files[0]); e.target.value = ''; }} className="hidden" />
                  </label>
                  {preview && <img src={preview} alt="" className="max-h-40 rounded-xl border border-slate-200 dark:border-slate-700 mx-auto" />}
                  {bulkBox('Văn bản nhận dạng từ ảnh sẽ hiện ở đây. Hãy sửa lỗi (nếu có) rồi bấm "Thêm vào danh sách".')}
                </div>
              )}

              {src === 'voice' && (
                <div className="space-y-3">
                  <div className="flex flex-wrap items-center gap-3">
                    <div className="inline-flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
                      <button onClick={() => setVLang('en-US')} className={`px-3 py-1.5 rounded-lg ${vLang === 'en-US' ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>Nói tiếng Anh</button>
                      <button onClick={() => setVLang('vi-VN')} className={`px-3 py-1.5 rounded-lg ${vLang === 'vi-VN' ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>Nói tiếng Việt</button>
                    </div>
                    <Mic key={vLang} lang={vLang} continuous label="Bấm để bắt đầu nói" onText={t => setBulk(b => (b ? b + '\n' : '') + t)} />
                  </div>
                  <p className="text-xs text-slate-400">Mỗi lần ngừng nói, câu vừa nghe sẽ thành một dòng. Có thể nói cả "từ - nghĩa", hoặc nói từ trước rồi bấm 🎤 ở cột Nghĩa trong danh sách chờ để nói nghĩa tiếng Việt.</p>
                  {bulkBox('Nội dung nhận diện từ giọng nói sẽ hiện ở đây...')}
                </div>
              )}
              {busy && <p className="text-sm font-bold text-indigo-500 animate-pulse">{busy}</p>}
            </section>

            {/* BƯỚC 2 + 3 */}
            <div className="space-y-5">
              <section className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-black text-sm uppercase tracking-wider text-slate-400">Bước 2 · Danh sách chờ ({draft.length} từ)</h3>
                  {draft.length > 0 && <button onClick={() => setDraft([])} className="text-xs font-bold text-rose-500">Xoá hết</button>}
                </div>
                {draft.length === 0 ? <p className="py-6 text-center text-sm text-slate-400">Chưa có từ nào. Hãy nhập từ ở Bước 1.</p> : (
                  <div className="max-h-72 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 rounded-xl border border-slate-100 dark:border-slate-800">
                    {draft.slice(0, 200).map(x => (
                      <div key={x.k} className="flex items-center gap-1.5 p-2">
                        <input value={x.w} onChange={e => upd(x.k, { w: e.target.value })} className="w-2/5 px-2 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 text-sm font-bold outline-none" />
                        <input value={x.s || ''} placeholder="(chưa có nghĩa)" onChange={e => upd(x.k, { s: e.target.value })} className="flex-1 min-w-0 px-2 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 text-sm outline-none" />
                        <Mic lang="vi-VN" onText={t => upd(x.k, { s: t })} />
                        <button onClick={() => setDraft(d => d.filter(y => y.k !== x.k))} className="text-slate-300 hover:text-rose-500 p-1"><Icon name="x" className="w-4 h-4" /></button>
                      </div>
                    ))}
                    {draft.length > 200 && <p className="p-2 text-center text-xs text-slate-400">... và {draft.length - 200} từ nữa (vẫn sẽ được lưu)</p>}
                  </div>
                )}
              </section>

              <section className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                <h3 className="font-black text-sm uppercase tracking-wider text-slate-400">Bước 3 · Lưu vào thư mục</h3>
                <div className="grid grid-cols-2 gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
                  <button onClick={() => setDest('new')} className={`py-2 rounded-lg ${dest === 'new' ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>Tạo thư mục mới</button>
                  <button onClick={() => setDest('existing')} disabled={!decks.length} className={`py-2 rounded-lg disabled:opacity-40 ${dest === 'existing' ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>Thêm vào thư mục có sẵn</button>
                </div>
                {dest === 'new' ? (
                  <input value={name} onChange={e => setName(e.target.value)} placeholder="Tên thư mục (vd: Deck 2 - TOEIC)" className={inp} />
                ) : (
                  <select value={deckSel} onChange={e => setDeckSel(e.target.value)} className={inp}>
                    {decks.map(d => <option key={d.id} value={d.id}>{d.name} ({cards.filter(c => c.d === d.id).length} từ)</option>)}
                  </select>
                )}
                {draft.some(x => !x.num) && (
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-400">Xếp từ nhập tay vào List:</label>
                    <select value={listSel} onChange={e => setListSel(e.target.value)} className={inp}>
                      <option value="auto">Tự động (mỗi List tối đa 55 từ)</option>
                      <option value="new">Tạo List mới</option>
                      {dest === 'existing' && selLists.map(l => <option key={l.id} value={l.id}>List {l.id} ({l.count} từ)</option>)}
                    </select>
                  </div>
                )}
                <button onClick={save} disabled={!draft.length} className={`w-full py-3 rounded-xl ${tColor.bg} text-white font-bold text-sm shadow disabled:opacity-40`}>
                  Lưu {draft.length} từ vào {dest === 'new' ? 'thư mục mới' : 'thư mục đã chọn'}
                </button>
              </section>
            </div>
          </div>
        </Shell>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
