                    <div className="min-w-0">
                      <div className="text-xs font-bold truncate max-w-[110px]">{d.name}</div>
                      <div className="text-[10px] text-slate-400">{n} từ</div>
                    </div>
                  </button>
                );
              })}
            </div>

            <div className="space-y-4 min-w-0">
              <div className="flex flex-wrap items-center justify-between gap-2 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                <div className="min-w-0">
                  <h3 className="font-black text-lg truncate">{deck.name}</h3>
                  <p className="text-xs text-slate-400">{deckCards.length} từ · {lists.length} List</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={rename} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center gap-1.5 hover:bg-slate-50 dark:hover:bg-slate-800"><Icon name="pencilCircle" className="w-4 h-4" />Đổi tên</button>
                  <button onClick={removeDeck} className="px-3 py-2 rounded-lg border border-rose-200 text-rose-500 text-xs font-bold flex items-center gap-1.5 hover:bg-rose-50 dark:hover:bg-rose-950"><Icon name="trash" className="w-4 h-4" />Xoá</button>
                </div>
              </div>

              <div className="flex flex-wrap gap-2">
                <select value={lf} onChange={e => setLf(e.target.value)} className="px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs font-bold">
                  <option value="all">Tất cả List ({deckCards.length} từ)</option>
                  {lists.map(l => <option key={l.id} value={l.id}>List {l.id} ({l.count} từ: {l.first} → {l.last})</option>)}
                </select>
                <input type="text" placeholder="Tìm từ hoặc nghĩa..." value={q} onChange={e => setQ(e.target.value)} className="flex-1 min-w-[180px] px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm outline-none focus:border-indigo-500" />
              </div>

              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-x-auto shadow-sm">
                <table className="w-full min-w-[640px] table-fixed text-left text-sm">
                  <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 font-bold border-b border-slate-200 dark:border-slate-800 text-xs">
                    <tr>
                      <th className="p-3 w-16">#</th>
                      <th className="p-3 w-[34%] text-center relative border-l border-slate-200 dark:border-slate-700">{rev ? 'Nghĩa' : 'Từ vựng'}</th>
                      <th className="p-3 text-center relative border-l border-slate-200 dark:border-slate-700">
                        <button onClick={() => setRev(!rev)} title={rev ? 'Đang xem Việt → Anh (bấm để đảo lại)' : 'Đang xem Anh → Việt (bấm để đảo lại)'} className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 z-10 w-7 h-7 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-indigo-500 shadow flex items-center justify-center hover:bg-indigo-50 dark:hover:bg-slate-800 transition"><Icon name="shuffle" className="w-4 h-4" /></button>
                        {rev ? 'Từ vựng' : 'Nghĩa'}
                      </th>
                      <th className="p-3 w-24 text-center border-l border-slate-200 dark:border-slate-700">List</th>
                      <th className="p-3 w-12 border-l border-slate-200 dark:border-slate-700"></th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filtered.slice(0, 300).map(c => (
                      <tr key={c.n}>
                        <td className="p-3 font-mono text-slate-400">#{numOf(c)}</td>
                        <td className={`p-3 text-center border-l border-slate-200 dark:border-slate-700 ${rev ? 'text-slate-600 dark:text-slate-300' : 'font-bold'}`}>{rev ? (c.s || c.v) : <>{c.w} <span className="text-indigo-500 font-mono font-normal ml-1">{c.i}</span></>}</td>
                        <td className={`p-3 text-center border-l border-slate-200 dark:border-slate-700 ${rev ? 'font-bold' : 'text-slate-600 dark:text-slate-300'}`}>{rev ? <>{c.w} <span className="text-indigo-500 font-mono font-normal ml-1">{c.i}</span></> : (c.s || c.v)}</td>
                        <td className="p-3 text-center font-bold text-slate-400 whitespace-nowrap border-l border-slate-200 dark:border-slate-700">List {c.l}</td>
                        <td className="p-3 border-l border-slate-200 dark:border-slate-700"><button title="Xoá từ này" onClick={() => setCards(cs => cs.filter(x => x.n !== c.n))} className="text-slate-300 hover:text-rose-500"><Icon name="trash" className="w-4 h-4" /></button></td>
                      </tr>
                    ))}
                    {filtered.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400">Không có từ nào.</td></tr>}
                  </tbody>
                </table>
                {filtered.length > 300 && <p className="p-3 text-center text-xs text-slate-400">Hiển thị 300 / {filtered.length} từ. Hãy lọc theo List hoặc tìm kiếm để xem thêm.</p>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // NẠP TỪ VỰNG: EXCEL / BÀN PHÍM / HÌNH ẢNH / GIỌNG NÓI -> CHỌN THƯ MỤC
    // ==========================================
    function ImportSection({ decks, cards, setDecks, setCards, draft, setDraft, showToast, tColor, onDone }) {
      const [src, setSrc] = useNavState('import_src', 'excel');
      const [bulk, setBulk] = useState('');
      const [f, setF] = useState({ w: '', s: '', p: '', i: '', e: '', x: '' });
      const [busy, setBusy] = useState('');
      const [ocrLang, setOcrLang] = useState('eng+vie');
      const [vLang, setVLang] = useState('en-US');
      const [preview, setPreview] = useState(null);
      const [dest, setDest] = useState('new');
      const [name, setName] = useState('Deck ' + (decks.length + 1));
      const [deckSel, setDeckSel] = useState(decks[0] ? decks[0].id : '');
      const [listSel, setListSel] = useState('auto');

      const addDraft = (items) => {
        if (!items.length) { showToast('Không tìm thấy từ nào để thêm.'); return false; }
        setDraft(d => [...d, ...items]); return true;
      };
      const upd = (k, patch) => setDraft(d => d.map(x => x.k === k ? { ...x, ...patch, ...(patch.s !== undefined && !x.num ? { v: patch.s } : {}) } : x));
      const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');

      // --- Excel (giữ nguyên bộ đọc cũ; thêm đọc được .xlsx thật) ---
      const onExcel = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length) return;
        setBusy('Đang đọc file...');
        const map = new Map();
        for (const file of files) {
          try {
            let txt = await file.text();
            if (!txt.trimStart().startsWith('<')) {
              const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
              let rows = '';
              wb.SheetNames.forEach(sn => XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' }).forEach(r => {
                rows += '<Row>' + r.map(v => '<Cell><Data>' + esc(v) + '</Data></Cell>').join('') + '</Row>';
              }));
              txt = '<Workbook>' + rows + '</Workbook>';
            }
            parseExcelContent(txt, map);
          } catch (err) { showToast('Không đọc được file: ' + file.name); }
        }
        const items = [...map.values()].sort((a, b) => a.n - b.n).map(c => ({ ...c, num: c.n, k: uid(), n: undefined }));
        setBusy('');
        if (addDraft(items)) showToast(`Đã đọc ${items.length} từ từ ${files.length} file`);
      };

      // --- Bàn phím ---
      const addOne = () => {
        if (!f.w.trim()) { showToast('Hãy nhập từ vựng.'); return; }
        addDraft([{ k: uid(), w: f.w.trim(), p: f.p.trim(), i: f.i.trim(), s: f.s.trim(), v: f.s.trim(), e: f.e.trim(), x: f.x.trim() ? [f.x.trim()] : [] }]);
        setF({ w: '', s: '', p: '', i: '', e: '', x: '' });
      };
      const addBulk = () => { if (addDraft(parseLines(bulk))) setBulk(''); };

      // --- Hình ảnh (OCR) ---
      const runOcr = async (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        setPreview(URL.createObjectURL(file));
        setBusy('Đang tải bộ nhận dạng chữ...');
        try {
          const T = await loadTesseract();
          const { data } = await T.recognize(file, ocrLang, {
            logger: m => { if (m.status === 'recognizing text') setBusy(`Đang nhận dạng chữ: ${Math.round(m.progress * 100)}%`); }
          });
          const t = (data.text || '').trim();
          setBulk(b => (b ? b + '\n' : '') + t);
          showToast(t ? 'Đã nhận dạng xong, hãy kiểm tra lại văn bản rồi bấm "Thêm vào danh sách".' : 'Không đọc được chữ trong ảnh.');
        } catch (err) { showToast(err.message || 'Lỗi nhận dạng hình ảnh.'); }
        setBusy('');
      };
      useEffect(() => {
        if (src !== 'image') return;
        const onPaste = (e) => {
          const it = Array.from(e.clipboardData ? e.clipboardData.items : []).find(i => i.type.startsWith('image/'));
          if (it) runOcr(it.getAsFile());
        };
        window.addEventListener('paste', onPaste);
        return () => window.removeEventListener('paste', onPaste);
      }, [src, ocrLang]);

      // --- Lưu vào thư mục ---
      const save = () => {
        if (!draft.length) return;
        if (dest === 'new' && !name.trim()) { showToast('Hãy đặt tên cho thư mục mới.'); return; }
        const deckId = dest === 'new' ? uid() : deckSel;
        if (!deckId) return;
        const exist = cards.filter(c => c.d === deckId);
        const byNum = new Map(exist.map(c => [numOf(c), c]));
        let gn = Math.max(0, ...cards.map(c => c.n)) + 1;
        let nextNum = Math.max(0, ...exist.map(numOf)) + 1;
        const lm = listMeta(exist);
        let curL = lm.length ? lm[lm.length - 1].id : 1;
        let curCount = lm.length ? lm[lm.length - 1].count : 0;
        if (listSel === 'new') { curL = (lm.length ? lm[lm.length - 1].id : 0) + 1; curCount = 0; }
        const rep = new Map(), added = [];
        draft.forEach(it => {
          const { k, ...c } = it;
          if (c.num && c.l) {                       // từ đến từ Excel: giữ số thứ tự + List gốc
            const old = byNum.get(c.num);
            if (old) rep.set(old.n, { ...c, n: old.n, d: deckId });
            else added.push({ ...c, n: gn++, d: deckId });
          } else {                                  // từ nhập tay / ảnh / giọng nói
            let l;
            if (typeof listSel === 'number' || /^\d+$/.test(String(listSel))) l = Number(listSel);
            else { if (curCount >= 55) { curL++; curCount = 0; } l = curL; curCount++; }
            added.push({ ...c, n: gn++, num: nextNum++, l, d: deckId });
          }
        });
        if (dest === 'new') setDecks(ds => [...ds, { id: deckId, name: name.trim() }]);
        setCards(cs => cs.map(c => rep.get(c.n) || c).concat(added));
        showToast(`Đã lưu ${draft.length} từ vào "${dest === 'new' ? name.trim() : (decks.find(d => d.id === deckId) || {}).name}"`);
        setDraft([]); setBulk('');
        setName('Deck ' + (decks.length + 2));
        onDone(deckId);
      };

      const exportSeed = () => {
        const payload = { version: String(Date.now()), decks, cards };
        const text = '/* MyVocab - từ vựng dựng sẵn. Đặt file này cùng thư mục với file HTML. */\nwindow.VOCAB_SEED = ' + JSON.stringify(payload) + ';\n';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
        a.download = 'vocab-data.js';
        document.body.appendChild(a); a.click(); a.remove();
        showToast('Đã tải vocab-data.js (' + cards.length + ' từ). Hãy up file này lên GitHub cùng file HTML.');
      };
      const selLists = listMeta(cards.filter(c => c.d === deckSel));
      const SRC = [['excel', 'upload', 'File Excel'], ['type', 'keyboard', 'Bàn phím'], ['image', 'image', 'Hình ảnh'], ['voice', 'mic', 'Giọng nói']];
      const inp = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500';

      const bulkBox = (hint) => (
        <div className="space-y-2">
          <textarea value={bulk} onChange={e => setBulk(e.target.value)} rows={6} placeholder={hint} className={inp + ' font-mono'} />
          <button onClick={addBulk} disabled={!bulk.trim()} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold disabled:opacity-40`}>Thêm vào danh sách</button>
        </div>
      );

      return (
        <Shell>
          <div>
            <h2 className="text-2xl font-black">Nạp từ vựng</h2>
            <p className="text-sm text-slate-400 mt-1">Nhập từ → kiểm tra danh sách chờ → lưu vào một thư mục (Deck)</p>
          </div>

          <section className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
            <h3 className="font-black text-sm uppercase tracking-wider text-slate-400">Đóng gói từ vựng để up GitHub</h3>
            <p className="text-sm text-slate-500 leading-relaxed">Hiện có <b>{cards.length}</b> từ trong <b>{decks.length}</b> thư mục. Bấm nút để tải file <b>vocab-data.js</b>, rồi up file này lên GitHub <b>cùng thư mục với file HTML</b>. Mở web ở máy nào cũng có sẵn toàn bộ từ vựng này.</p>
            <button onClick={exportSeed} disabled={!cards.length} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold disabled:opacity-40`}>⬇ Tải vocab-data.js</button>
          </section>

          <div className="grid lg:grid-cols-2 gap-5 items-start">
            {/* BƯỚC 1: NGUỒN NHẬP */}
            <section className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4">
              <h3 className="font-black text-sm uppercase tracking-wider text-slate-400">Bước 1 · Chọn cách nhập</h3>

                  <p className="text-sm font-bold">Chọn file Excel (.xls, .xlsx, .xml)</p>
                  <p className="text-xs text-slate-400">Có thể chọn nhiều file cùng lúc</p>

              {src === 'type' && (
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-2.5">
                    <div className="col-span-2 sm:col-span-1 flex gap-1.5"><input className={inp} placeholder="Từ tiếng Anh *" value={f.w} onChange={e => setF({ ...f, w: e.target.value })} /><Mic lang="en-US" onText={t => setF(o => ({ ...o, w: t }))} /></div>
                    <div className="col-span-2 sm:col-span-1 flex gap-1.5"><input className={inp} placeholder="Nghĩa tiếng Việt" value={f.s} onChange={e => setF({ ...f, s: e.target.value })} /><Mic lang="vi-VN" onText={t => setF(o => ({ ...o, s: t }))} /></div>
                    <input className={inp} placeholder="Loại từ (n, v, adj...)" value={f.p} onChange={e => setF({ ...f, p: e.target.value })} />
                    <input className={inp} placeholder="Phiên âm /.../" value={f.i} onChange={e => setF({ ...f, i: e.target.value })} />
                    <input className={inp + ' col-span-2'} placeholder="Định nghĩa tiếng Anh (tuỳ chọn)" value={f.e} onChange={e => setF({ ...f, e: e.target.value })} />

            {/* BƯỚC 2 + 3 */}
            <div className="space-y-5">

                        <input value={x.s || ''} placeholder="(chưa có nghĩa)" onChange={e => upd(x.k, { s: e.target.value })} className="flex-1 min-w-0 px-2 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 text-sm outline-none" />

                        <button onClick={() => setDraft(d => d.filter(y => y.k !== x.k))} className="text-slate-300 hover:text-rose-500 p-1"><Icon name="x" className="w-4 h-4" /></button>

                  </div>

              </section>

              <section className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">

                {draft.some(x => !x.num) && (
                  <div className="space-y-1">

                      {dest === 'existing' && selLists.map(l => <option key={l.id} value={l.id}>List {l.id} ({l.count} từ)</option>)}
                    </select>
                  </div>
                )}

                  Lưu {draft.length} từ vào {dest === 'new' ? 'thư mục mới' : 'thư mục đã chọn'}
                </button>
              </section>
            </div>
          </div>
        </Shell>
      );
    }

    function GrammarQuiz({ topic, onScore }) {
      const [shuf, setShuf] = useNavState('grammar_quiz_shuffle', false);
      const [seed, setSeed] = useState(() => newSeed());
      const qs = useMemo(() => shuf ? seededShuffle(topic.quiz, seed) : topic.quiz, [topic, shuf, seed]);
      const [idx, setIdx] = useState(0);
      const [picked, setPicked] = useState(null);
      const [score, setScore] = useState(0);
      const [fin, setFin] = useState(false);
      const q = qs[idx];

      const pick = (i) => {
        if (picked !== null) return;
        setPicked(i);
        if (i === q[2]) { SoundFx.correct(); setScore(s => s + 1); } else { SoundFx.wrong(); }
      };
      const next = () => {
        if (idx >= qs.length - 1) { setFin(true); onScore(score); }
        else { setIdx(idx + 1); setPicked(null); }
      };
      const resetRun = () => { setIdx(0); setPicked(null); setScore(0); setFin(false); };
      const retry = () => { if (shuf) setSeed(newSeed()); resetRun(); };
      const toggleShuf = () => { setSeed(newSeed()); setShuf(!shuf); resetRun(); };
      const shufBtn = (
        <button onClick={toggleShuf} title="Đảo thứ tự câu hỏi ngẫu nhiên" className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition ${shuf ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-500 hover:border-indigo-400'}`}>
          <Icon name="shuffle" className="w-3.5 h-3.5" /><span>Đảo câu: {shuf ? 'Bật' : 'Tắt'}</span>
        </button>
      );

      if (fin) {
        return (
          <div className="p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center space-y-4 shadow-sm">
            <p className="text-sm font-bold text-slate-400">KẾT QUẢ</p>
            <p className="text-5xl font-black text-indigo-600 dark:text-indigo-400">{score} / {qs.length}</p>
            <p className="text-slate-500 dark:text-slate-400">{score === qs.length ? 'Tuyệt vời! Bạn nắm chắc chủ đề này 🎉' : 'Hãy đọc lại phần Tóm tắt rồi làm lại nhé.'}</p>
            <div className="flex flex-wrap items-center justify-center gap-2">
              <button onClick={retry} className="px-6 py-3 rounded-xl bg-indigo-600 text-white text-sm font-bold shadow">{shuf ? 'Làm lại (đảo câu mới)' : 'Làm lại'}</button>
              {shufBtn}
            </div>
          </div>
        );
      }

      const parts = q[0].split('___');
      return (
        <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-5 shadow-sm">
          <div className="flex justify-between items-center text-xs font-bold text-slate-400">
            <span>CÂU {idx + 1} / {qs.length}</span>
            <div className="flex items-center gap-2">{shufBtn}
            <button onClick={() => speak(q[0].replace('___', 'blank'), 'en-US')} className="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400">🔊 Nghe câu</button></div>
          </div>
          <p className="text-xl md:text-2xl font-bold leading-relaxed text-slate-900 dark:text-white">
            {parts[0]}
            <span className={`inline-block min-w-[80px] mx-1 px-2 text-center border-b-2 ${picked === null ? 'border-slate-400 text-transparent' : (picked === q[2] ? 'border-emerald-500 text-emerald-600' : 'border-rose-500 text-rose-600')}`}>{picked === null ? '____' : q[1][q[2]]}</span>
            {parts[1]}
          </p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {q[1].map((opt, i) => {
              let cls = 'border-slate-200 dark:border-slate-800 hover:border-indigo-400 bg-slate-50/50 dark:bg-slate-800/40';
              if (picked !== null) {
                if (i === q[2]) cls = 'bg-emerald-500 text-white border-emerald-500 font-bold shadow-md';
                else if (picked === i) cls = 'bg-rose-500 text-white border-rose-500 font-bold shadow-md';
              }
              return (
                <button key={i} disabled={picked !== null} onClick={() => pick(i)} className={`p-4 rounded-2xl border-2 text-left text-lg font-bold transition flex items-start ${cls}`}>
                  <span className="font-mono text-sm opacity-75 mr-2.5 mt-1">{String.fromCharCode(65 + i)}.</span><span className="flex-1">{opt}</span>
                </button>
              );
            })}
          </div>
          {picked !== null && (
            <div className="space-y-3">
              <div className={`p-4 rounded-2xl text-sm font-semibold ${picked === q[2] ? 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300' : 'bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300'}`}>
                {picked === q[2] ? '✓ Chính xác! ' : '✗ Chưa đúng. '}{q[3]}
              </div>
              <button onClick={next} className="px-6 py-3 rounded-xl bg-indigo-600 text-white text-sm font-bold shadow">{idx >= qs.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo →'}</button>
            </div>
          )}
        </div>
      );
    }

    function GrammarSection({ tColor }) {
      const [st, setSt] = useState(() => { try { return JSON.parse(Store.get('myvocab_v4_grammar')) || {}; } catch (e) { return {}; } });
      const [tid, setTid] = useNavState('grammar_tid', null);
      const [view, setView] = useNavState('grammar_view', 'summary');
      useEffect(() => { try { Store.set('myvocab_v4_grammar', JSON.stringify(st)); } catch (e) {} }, [st]);

      const done = st.done || {};
      const notes = st.notes || {};
      const scores = st.scores || {};
      const toggle = (id) => setSt(s => ({ ...s, done: { ...(s.done || {}), [id]: !(s.done || {})[id] } }));
      const setAll = (t, v) => setSt(s => { const d = { ...(s.done || {}) }; t.items.forEach(i => { d[i[0]] = v; }); return { ...s, done: d }; });
      const setNote = (id, v) => setSt(s => ({ ...s, notes: { ...(s.notes || {}), [id]: v } }));
      const setScore = (id, v) => setSt(s => ({ ...s, scores: { ...(s.scores || {}), [id]: Math.max(v, (s.scores || {})[id] || 0) } }));
      const prog = (t) => ({ total: t.items.length, d: t.items.filter(i => done[i[0]]).length });
      const pct = (p) => (p.total ? Math.round(p.d * 100 / p.total) : 0);
      const all = GR.reduce((a, t) => { const p = prog(t); return { total: a.total + p.total, d: a.d + p.d }; }, { total: 0, d: 0 });
      const t = GR.find(x => x.id === tid);
      const open = (id) => { setTid(id); setView('summary'); };

      if (!t) {
        return (
          <Shell>
            <div>
              <h2 className="text-2xl font-black">Ngữ pháp TOEIC</h2>
              <p className="text-sm text-slate-400 mt-1">Theo mục lục khoá Complete TOEIC (Study4): tóm tắt kiến thức, theo dõi tiến độ, làm trắc nghiệm nhanh và ghi chú riêng</p>
            </div>
            <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2">
              <div className="flex justify-between text-xs font-bold text-slate-500">
                <span>Tiến độ tổng</span><span>{all.d} / {all.total} bài ({pct(all)}%)</span>
              </div>
              <div className="h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                <div className={`h-full ${tColor.bg} transition-all`} style={{ width: pct(all) + '%' }} />
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {GR.map((g, gi) => {
                const p = prog(g);
                return (

    const splitSentences = (t) => (String(t).replace(/\s+/g, ' ').trim().match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);

    function diffWords(target, user) {
      const n = target.length, m = user.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
        dp[i][j] = target[i] === user[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      const tm = new Array(n).fill(false), um = new Array(m).fill(false);
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (target[i] === user[j]) { tm[i] = um[j] = true; i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
      }
      return { tm, um, ok: n > 0 && dp[0][0] === n && m === n };
    }

    // --- Lưu file audio trong trình duyệt (IndexedDB), riêng từng tài khoản ---
    const AudioDB = {
      db: null,
      open() {
        return new Promise((res, rej) => {
          if (this.db) return res(this.db);
          const r = indexedDB.open('myvocab_audio', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('files');
          r.onsuccess = () => { this.db = r.result; res(r.result); };
          r.onerror = () => rej(r.error);
        });
      },
      async put(k, blob) {
        const db = await this.open();
        return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, Store.p + k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
      },
      async get(k) {
        const db = await this.open();
        return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get(Store.p + k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      },
      async del(k) {
        const db = await this.open();
        return new Promise((res) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(Store.p + k); tx.oncomplete = () => res(); tx.onerror = () => res(); });
      }
    };

    // Chia audio thành từng câu: tìm các quãng lặng dài nhất; nếu không đủ thì chia theo độ dài câu
    function proportionalTimes(sents, dur) {
      const w = sents.map(s => Math.max(1, s.length)), tot = w.reduce((a, b) => a + b, 0);
      let acc = 0;
      return w.map(x => { const s = acc / tot * dur; acc += x; return [Number(s.toFixed(2)), Number((acc / tot * dur).toFixed(2))]; });
    }
    async function analyzeAudio(file, sents) {
      const AC = window.AudioContext || window.webkitAudioContext;
      let ab = null;
      try { const ctx = new AC(); ab = await ctx.decodeAudioData(await file.arrayBuffer()); if (ctx.close) ctx.close(); } catch (e) { ab = null; }
      if (!ab) {
        const dur = await new Promise(res => { const a = new Audio(URL.createObjectURL(file)); a.onloadedmetadata = () => res(a.duration || 0); a.onerror = () => res(0); });
        return { dur, times: proportionalTimes(sents, dur || sents.length * 4), auto: false };
      }
      const dur = ab.duration, n = sents.length;
      const data = ab.getChannelData(0), frame = Math.max(1, Math.floor(ab.sampleRate * 0.02)), fs = frame / ab.sampleRate;
      const rms = [];
      for (let i = 0; i + frame <= data.length; i += frame) { let s = 0; for (let j = 0; j < frame; j++) { const v = data[i + j]; s += v * v; } rms.push(Math.sqrt(s / frame)); }
      const sorted = [...rms].sort((a, b) => a - b);
      const thr = (sorted[Math.floor(sorted.length * 0.9)] || 0) * 0.12;
      const runs = []; let st = -1;
      for (let i = 0; i <= rms.length; i++) {
        const quiet = i < rms.length && rms[i] < thr;
        if (quiet && st < 0) st = i;
        if (!quiet && st >= 0) { const len = (i - st) * fs; if (len >= 0.15) runs.push({ st: st * fs, en: i * fs, len }); st = -1; }
      }
      const lead = runs.find(r => r.st < 0.05);
      const startAt = lead ? Math.min(lead.en, 1.5) : 0;
      const inner = runs.filter(r => r.st > 0.1 && r.en < dur - 0.1);
      if (n <= 1) return { dur, times: [[Number(startAt.toFixed(2)), Number(dur.toFixed(2))]], auto: true };
      if (inner.length < n - 1) return { dur, times: proportionalTimes(sents, dur), auto: false };
      const pick = [...inner].sort((a, b) => b.len - a.len).slice(0, n - 1).sort((a, b) => a.st - b.st);
      const times = [];
      for (let i = 0; i < n; i++) {
        const s = i === 0 ? startAt : Math.max(pick[i - 1].st, pick[i - 1].en - 0.12);
        const e = i === n - 1 ? dur : Math.min(pick[i].en, pick[i].st + 0.2);
        times.push([Number(s.toFixed(2)), Number(e.toFixed(2))]);
      }
      return { dur, times, auto: true };
    }

        let url = null, dead = false;
        AudioDB.get('a_' + lesson.id).then(b => {
          if (dead || !b) return;
          url = URL.createObjectURL(b);
          const a = new Audio(url); a.preload = 'auto'; audioRef.current = a; setAudioReady(true);
        }).catch(() => {});
        return () => { dead = true; clearInterval(stopRef.current); if (audioRef.current) audioRef.current.pause(); audioRef.current = null; if (url) URL.revokeObjectURL(url); };
      }, [lesson.id]);

      const useAudio = audioReady && !!seg;
      const play = (r) => {
        const rt = r || rate;
        if (useAudio && audioRef.current) {
          const a = audioRef.current;
          clearInterval(stopRef.current);
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          a.pause(); a.playbackRate = rt; a.currentTime = seg[0];
          a.play().catch(() => {});
          stopRef.current = setInterval(() => { if (a.currentTime >= seg[1] || a.ended) { a.pause(); clearInterval(stopRef.current); } }, 40);
        } else speak(sent, acc, rt);
      };
      useEffect(() => { setVal(''); setRes(null); setHint(false); setPw(''); setPm('');
        const t = setTimeout(() => { play(); if (inputRef.current) inputRef.current.focus(); }, 250);
        return () => clearTimeout(t); }, [idx, lesson.id, audioReady]);

      const check = () => {
        if (!val.trim()) return;
        const d = diffWords(target, wordsOf(val));
        const score = target.length ? Math.round(d.tm.filter(Boolean).length * 100 / target.length) : 0;
        if (d.ok) { SoundFx.correct(); onDone(idx); } else SoundFx.wrong();
        onAttempt(d.ok);
        setRes({ ...d, score, userWords: wordsOf(val) });
      };
      const total = sentences.length, cnt = Object.keys(done).filter(k => done[k]).length;
      const go = (d) => setIdx(i => Math.min(total - 1, Math.max(0, i + d)));
      const hintText = target.map(w => w[0] + '·'.repeat(Math.max(0, w.length - 1))).join('  ');
      const pill = 'px-3 py-1.5 rounded-xl text-xs font-bold';
      const setSeg = (k, v) => { const s = seg ? [...seg] : [0, 0]; s[k] = Math.max(0, Number(v) || 0); onTimes(idx, s); };
      const inp = 'px-2 py-1.5 w-20 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-xs font-bold text-center outline-none focus:border-indigo-500';

      return (
        <Shell>
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <button onClick={onBack} className="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0"><Icon name="arrowLeft" className="w-4 h-4" /><span>Các bài nghe</span></button>
              <h2 className="text-lg font-black truncate">{lesson.title}</h2>
            </div>
            <span className="text-xs font-bold text-slate-400">Đúng {cnt} / {total} câu</span>
          </div>
          <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div className={`h-full ${tColor.bg} transition-all`} style={{ width: Math.round(cnt * 100 / Math.max(1, total)) + '%' }} /></div>

          <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-md space-y-5">
            <div className="flex flex-wrap items-center justify-between gap-2 text-xs font-bold text-slate-400">
              <span>CÂU {idx + 1} / {total} · {target.length} từ{useAudio ? ' · 🎵 audio của bạn' : ' · giọng đọc máy'}</span>
              <div className="flex items-center gap-2">
                {!useAudio && (
                  <div className="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg">
                    {[['en-GB', 'UK'], ['en-US', 'US']].map(a => <button key={a[0]} onClick={() => setAcc(a[0])} className={`px-2.5 py-1 rounded-md ${acc === a[0] ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>{a[1]}</button>)}
                  </div>
                )}
                <select value={rate} onChange={e => setRate(Number(e.target.value))} className="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-xs font-bold">
                  <option value={0.6}>Chậm 0.6x</option><option value={0.8}>0.8x</option><option value={0.9}>0.9x</option><option value={1}>Bình thường</option><option value={1.2}>Nhanh 1.2x</option>
                </select>
              </div>
            </div>

            <div className="flex justify-center gap-3">
              <button onClick={() => play()} className={`w-20 h-20 rounded-full ${tColor.bg} text-white flex items-center justify-center shadow-lg hover:scale-105 transition`} title="Nghe câu này"><Icon name="volume" className="w-10 h-10" /></button>
              <button onClick={() => play(0.55)} className="self-end px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-500" title="Nghe thật chậm">🐢 Chậm</button>
            </div>

            {lesson.hasAudio && audioReady && (
              <div className="space-y-2">
                <button onClick={() => setEdit(e => !e)} className="text-xs font-bold text-slate-400 hover:text-indigo-500">{edit ? '▾' : '▸'} ⏱ Chỉnh thời gian cắt câu này (nếu audio bị cắt lệch)</button>
                {edit && seg && (
                  <div className="flex flex-wrap items-center gap-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 text-xs font-bold text-slate-500">
                    <span>Bắt đầu</span>
                    <button onClick={() => setSeg(0, seg[0] - 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">−0.1</button>
                    <input type="number" step="0.05" className={inp} value={seg[0]} onChange={e => setSeg(0, e.target.value)} />
                    <button onClick={() => setSeg(0, seg[0] + 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">+0.1</button>
                    <span className="ml-2">Kết thúc</span>
                    <button onClick={() => setSeg(1, seg[1] - 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">−0.1</button>
                    <input type="number" step="0.05" className={inp} value={seg[1]} onChange={e => setSeg(1, e.target.value)} />
                    <button onClick={() => setSeg(1, seg[1] + 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">+0.1</button>
                    <button onClick={() => play()} className={`${pill} ${tColor.bg} text-white`}>Nghe thử</button>
                  </div>
                )}
              </div>
            )}

            <textarea ref={inputRef} rows={3} value={val} disabled={res && res.ok} onChange={e => setVal(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); if (res && res.ok) go(1); else check(); } }}
              autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck={false}
              placeholder="Nghe và gõ lại câu bạn nghe được... (Enter để kiểm tra)"
              className="w-full px-4 py-3 rounded-2xl border-2 border-slate-300 dark:border-slate-700 bg-transparent text-lg font-semibold outline-none focus:border-indigo-500" />

            <div className="flex flex-wrap gap-2">
              <button onClick={check} className={`${pill} ${tColor.bg} text-white shadow`}>Kiểm tra</button>
              <button onClick={() => setHint(h => !h)} className={`${pill} border border-slate-200 dark:border-slate-700 text-slate-500`}>💡 Gợi ý</button>
              <button onClick={() => setRes({ ...diffWords(target, []), score: 0, userWords: [], shown: true })} className={`${pill} border border-slate-200 dark:border-slate-700 text-slate-500`}>Hiện đáp án</button>
            </div>
            {hint && !res && <p className="font-mono text-sm text-slate-500 tracking-wider">{hintText}</p>}

            {res && (
              <div className={`p-4 rounded-2xl space-y-3 ${res.ok ? 'bg-emerald-50 dark:bg-emerald-950/50' : 'bg-slate-50 dark:bg-slate-800/60'}`}>
                {!res.shown && <p className={`text-sm font-bold ${res.ok ? 'text-emerald-600' : 'text-rose-600'}`}>{res.ok ? '✓ Chính xác! 🎉' : `Chưa đúng hoàn toàn · ${res.score}% số từ`}</p>}
                {!res.shown && !res.ok && (
                  <p className="text-base font-semibold leading-relaxed"><span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mr-2">Bạn gõ</span>
                    {res.userWords.map((w, i) => <span key={i} className={`mr-1.5 ${res.um[i] ? 'text-emerald-600' : 'text-rose-600 line-through'}`}>{w}</span>)}</p>
                )}
                <p className="text-base font-semibold leading-relaxed"><span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mr-2">Đáp án</span>
                  {sent.split(/\s+/).map((w, i) => (
                    <button key={i} type="button" onClick={() => setPw(w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, ''))} title="Bấm để chọn từ này lưu vào từ vựng" className="mr-1.5 text-slate-900 dark:text-white hover:text-indigo-600 hover:underline">{w}</button>
                  ))}</p>
                <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-200/70 dark:border-slate-700">
                  <span className="text-[11px] font-bold text-slate-400">📌 Lưu từ mới (bấm từ trong đáp án để chọn):</span>
                  <input value={pw} onChange={e => setPw(e.target.value)} placeholder="Từ tiếng Anh" className="w-32 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-sm font-bold outline-none focus:border-indigo-500" />
                  <input value={pm} onChange={e => setPm(e.target.value)} placeholder="Nghĩa tiếng Việt" className="flex-1 min-w-[120px] px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500" />
                  <button onClick={() => { if (pw.trim()) { onSaveWord(pw, pm, sent); setPw(''); setPm(''); } }} disabled={!pw.trim()} className={`${pill} ${tColor.bg} text-white disabled:opacity-40`}>Lưu vào Deck</button>
                </div>
              </div>
            )}

            <div className="flex justify-between pt-3 border-t border-slate-100 dark:border-slate-800">
              <button disabled={idx === 0} onClick={() => go(-1)} className="px-5 py-2.5 rounded-xl border text-xs font-bold disabled:opacity-30">← Câu trước</button>
              <button disabled={idx >= total - 1} onClick={() => go(1)} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-xs font-bold disabled:opacity-30`}>Câu sau →</button>
            </div>
          </div>
        </Shell>
      );
    }

    function TopicThumb({ topic, tColor, size = 'w-20 h-20' }) {
      const [err, setErr] = useState(false);
      if (topic.img && !err) {
        return (
          <div className="p-1 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shrink-0 shadow-sm">
            <img src={topic.img} alt={topic.name} onError={() => setErr(true)} className={`${size} rounded-lg object-cover block`} />
          </div>
        );
      }
      return (
        <div className={`${size} shrink-0 rounded-xl ${tColor.light} flex items-center justify-center text-3xl border border-slate-200 dark:border-slate-700`}>
          {topic.icon || '🎧'}
        </div>
      );
    }

    function ListeningSection({ tColor, decks, cards, setDecks, setCards, showToast }) {
      const load = () => { try { return JSON.parse(Store.get('myvocab_v4_dict')) || {}; } catch (e) { return {}; } };
      const [st, setSt] = useState(load);
      const [openId, setOpenId] = useNavState('listen_openId', null);
      const [activeTopicId, setActiveTopicId] = useNavState('listen_topicId', null);
      const [viewMode, setViewMode] = useNavState('listen_viewMode', 'topics'); // 'topics' (All topics DailyDictation) | 'lessons' (Tất cả bài nghe)
      const [openDescs, setOpenDescs] = useState({});
      const [form, setForm] = useState(false);
      const [title, setTitle] = useState('');
      const [text, setText] = useState('');
      const [file, setFile] = useState(null);
      const [topicSel, setTopicSel] = useState('conv');
      const [newTopic, setNewTopic] = useState('');
      const [filter, setFilter] = useNavState('listen_filter', 'all');
      const [busy, setBusy] = useState('');
      const [dk, setDk] = useState('');
      const [lk, setLk] = useState('');
      useEffect(() => { try { Store.set('myvocab_v4_dict', JSON.stringify(st)); } catch (e) { showToast('Bộ nhớ trình duyệt đã đầy.'); } }, [st]);

      const custom = st.lessons || [];
      const prog = st.prog || {};
      const daily = st.daily || {};
      const topics = [...DICT_TOPICS, ...(st.topics || [])];
      const all = [...(window.LISTENING_DATA || DICT_SAMPLES).map(l => ({ ...l, builtin: true })), ...custom];
      const lesson = all.find(l => l.id === openId);
      const sentsOf = (l) => splitSentences(l.text);
      const topicOf = (l) => topics.find(t => t.id === (l.topic || 'other')) || topics[topics.length - 1];
      const activeTopic = topics.find(t => t.id === activeTopicId);

      // ----- thống kê -----
      const dkey = (d) => d.toLocaleDateString('en-CA');
      const todayStat = daily[dkey(new Date())] || { t: 0, c: 0 };
      let streak = 0;
      { const d = new Date(); if (!(daily[dkey(d)] || {}).t) d.setDate(d.getDate() - 1); while ((daily[dkey(d)] || {}).t) { streak++; d.setDate(d.getDate() - 1); } }
      const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return { l: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()], c: (daily[dkey(d)] || {}).c || 0 }; });
      const wmax = Math.max(1, ...week.map(w => w.c));
      const totalCorrect = Object.values(daily).reduce((a, x) => a + (x.c || 0), 0);

      const onAttempt = (ok) => setSt(s => {
        const k = dkey(new Date()); const d = (s.daily || {})[k] || { t: 0, c: 0 };
        return { ...s, daily: { ...(s.daily || {}), [k]: { t: d.t + 1, c: d.c + (ok ? 1 : 0) } } };
      });
      const markDone = (id, i) => setSt(s => ({ ...s, prog: { ...(s.prog || {}), [id]: { ...((s.prog || {})[id] || {}), [i]: true } } }));
      const resetProg = (id) => setSt(s => { const p = { ...(s.prog || {}) }; delete p[id]; return { ...s, prog: p }; });
      const setTimes = (id, i, seg) => setSt(s => ({ ...s, lessons: (s.lessons || []).map(l => { if (l.id !== id) return l; const t = [...(l.times || [])]; t[i] = seg; return { ...l, times: t }; }) }));

      const addLesson = async (t, body, topicId, f) => {
        const sents = splitSentences(body);
        if (!sents.length) return;
        const id = uid();
        let extra = {};
        if (f) {
          setBusy('Đang phân tích audio và chia câu...');
          try {
            const r = await analyzeAudio(f, sents);
            await AudioDB.put('a_' + id, f);
            extra = { hasAudio: true, times: r.times, dur: r.dur };
            showToast(r.auto ? 'Đã chia audio thành ' + sents.length + ' câu theo quãng lặng. Nếu lệch, hãy chỉnh trong bài.' : 'Đã chia audio theo độ dài câu (ước lượng). Hãy chỉnh thời gian từng câu cho khớp.');
          } catch (e) { showToast('Không lưu được audio, bài sẽ dùng giọng đọc máy.'); }
          setBusy('');
        }
        setSt(s => {
          let topic = topicId, topicsList = s.topics || [];
          if (topicId === '__new') {
            const nm = newTopic.trim() || 'Chủ đề mới'; topic = uid();
            topicsList = [...topicsList, { id: topic, name: nm, icon: '📂' }];
          }
          const l = { id, topic, title: (t || '').trim() || 'Bài nghe ' + ((s.lessons || []).length + 1), level: '', text: body.trim(), ...extra };
          return { ...s, topics: topicsList, lessons: [...(s.lessons || []), l] };
        });
        setTitle(''); setText(''); setFile(null); setNewTopic(''); setForm(false);
      };
      const delLesson = (l) => {
        if (!confirm(`Xoá bài nghe "${l.title}"?`)) return;
        if (l.hasAudio) AudioDB.del('a_' + l.id);
        setSt(s => { const p = { ...(s.prog || {}) }; delete p[l.id]; return { ...s, lessons: (s.lessons || []).filter(x => x.id !== l.id), prog: p }; });
      };

      const saveWord = (w, s, sentence) => {
        const word = w.trim(); if (!word) return;
        const did = 'dlisten';
        const exist = cards.filter(c => c.d === did);
        if (exist.some(c => c.w.toLowerCase() === word.toLowerCase())) { showToast('Từ "' + word + '" đã có trong Deck "Từ mới khi nghe".'); return; }
        if (!decks.find(d => d.id === did)) setDecks(ds => [...ds, { id: did, name: 'Từ mới khi nghe' }]);
        const n = Math.max(0, ...cards.map(c => c.n)) + 1;
        const num = exist.length ? Math.max(...exist.map(numOf)) + 1 : 1;
        const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
        const ex = sentence.replace(re, m => '[' + m + ']');
        const mean = s.trim();
        setCards(cs => [...cs, { n, num, l: Math.floor((num - 1) / 55) + 1, d: did, w: word, p: '', i: '', s: mean, v: mean, e: '', x: [ex] }]);
        showToast('Đã lưu "' + word + '" vào Deck "Từ mới khi nghe".');
      };

      const deckListInfo = listMeta(cards.filter(c => c.d === (dk || (decks[0] || {}).id)));
      const fromDeck = () => {
        const d = dk || (decks[0] || {}).id;
        const lid = lk || (deckListInfo[0] || {}).id;
        const ex = cards.filter(c => c.d === d && c.l === Number(lid)).sort((a, b) => numOf(a) - numOf(b))
          .map(c => (c.x && c.x[0]) ? String(c.x[0]).split(/\(\s*=?\s*Dịch:/i)[0].replace(/[\[\]]/g, '').trim() : '').filter(Boolean).slice(0, 40);
        if (!ex.length) { alert('List này chưa có câu ví dụ nào.'); return; }
        addLesson(`Câu ví dụ - ${(decks.find(x => x.id === d) || {}).name || ''} · List ${lid}`, ex.join(' '), 'vocab', null);
      };

      if (lesson) {
        return <DictationPlayer key={lesson.id} lesson={lesson} sentences={sentsOf(lesson)} done={prog[lesson.id] || {}}
          onDone={(i) => markDone(lesson.id, i)} onAttempt={onAttempt} onTimes={(i, seg) => setTimes(lesson.id, i, seg)} onSaveWord={saveWord}
          onBack={() => setOpenId(null)} tColor={tColor} />;
      }

      const inp = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500';
      const countOf = (id) => all.filter(l => (l.topic || 'other') === id).length;
      const toggleDesc = (id, e) => { if (e) e.stopPropagation(); setOpenDescs(p => ({ ...p, [id]: !p[id] })); };

      const renderLessonCards = (list) => (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {list.map(l => {
            const n = sentsOf(l).length, d = Object.keys(prog[l.id] || {}).length, tp = topicOf(l);
            return (
              <div key={l.id} className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-400 hover:shadow-md transition space-y-3">
                <div className="flex items-start gap-3">
                  <div className={`w-11 h-11 shrink-0 rounded-xl ${tColor.light} flex items-center justify-center text-xl`}>{tp.icon}</div>
                  <div className="min-w-0 flex-1">
                    <h3 className="font-black text-base leading-snug">{l.title}</h3>
                    <div className="flex flex-wrap gap-1.5 mt-1.5 text-[11px] font-bold">
                      <span className="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500">{tp.name}</span>
                      <span className="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500">{n} câu</span>
                      {l.level && <span className="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500">{l.level}</span>}
                      {l.hasAudio && <span className="px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-600">🎵 Audio</span>}
                      {l.builtin && <span className="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500">Bài mẫu</span>}
                    </div>
                  </div>
                  {!l.builtin && <button onClick={() => delLesson(l)} title="Xoá bài" className="p-1.5 rounded-lg text-slate-300 hover:text-rose-500"><Icon name="trash" className="w-4 h-4" /></button>}
                </div>
                <div className="h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div className={`h-full ${tColor.bg}`} style={{ width: Math.round(d * 100 / Math.max(1, n)) + '%' }} /></div>
                <div className="flex items-center gap-2">
                  <button onClick={() => setOpenId(l.id)} className={`flex-1 px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold shadow`}>{d > 0 ? `Tiếp tục (${d}/${n})` : 'Bắt đầu nghe'}</button>
                  {d > 0 && <button onClick={() => resetProg(l.id)} title="Làm lại từ đầu" className="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500"><Icon name="rotate" className="w-4 h-4" /></button>}
                </div>
              </div>
            );
          })}
        </div>
      );

      return (
        <Shell>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-2xl font-black">Luyện nghe (English Listening Exercises)</h2>
              <p className="text-sm text-slate-400 mt-1">Chủ đề theo DailyDictation · Nghe chép chính tả từng câu ngay trên web hoặc mở khóa học gốc</p>
            </div>
            <button onClick={() => { if (activeTopicId) setTopicSel(activeTopicId); setForm(!form); }} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold flex items-center gap-2 shadow`}>
              <Icon name="plus" className="w-4 h-4" /><span>Thêm bài nghe</span>
            </button>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            {[['🔥', streak, 'Ngày liên tiếp'], ['✅', todayStat.c + '/' + todayStat.t, 'Câu đúng hôm nay'], ['🏆', totalCorrect, 'Tổng câu đúng']].map(x => (
              <div key={x[2]} className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                <div className="text-2xl font-black">{x[0]} {x[1]}</div><div className="text-[11px] font-bold text-slate-400 mt-0.5">{x[2]}</div>
              </div>
            ))}
            <div className="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <div className="flex items-end gap-1.5 h-12">
                {week.map((w, i) => <div key={i} title={w.c + ' câu đúng'} className={`flex-1 rounded-t ${tColor.bg}`} style={{ height: Math.max(4, Math.round(w.c * 100 / wmax)) + '%', opacity: w.c ? 1 : 0.25 }} />)}
              </div>
              <div className="flex gap-1.5 mt-1">{week.map((w, i) => <span key={i} className="flex-1 text-center text-[9px] font-bold text-slate-400">{w.l}</span>)}</div>
            </div>
          </div>

          {form && (
            <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4">
              <div className="space-y-2">
                <p className="text-xs font-black uppercase tracking-wider text-slate-400">Cách 1 · Dán script (kèm file audio của bạn nếu có)</p>
                <input className={inp} placeholder="Tên bài nghe" value={title} onChange={e => setTitle(e.target.value)} />
                <div className="flex flex-wrap gap-2">
                  <select className={inp + ' flex-1 min-w-[180px]'} value={topicSel} onChange={e => setTopicSel(e.target.value)}>
                    {topics.map(t => <option key={t.id} value={t.id}>{t.icon} {t.name}</option>)}
                    <option value="__new">➕ Tạo chủ đề mới...</option>
                  </select>
                  {topicSel === '__new' && <input className={inp + ' flex-1 min-w-[160px]'} placeholder="Tên chủ đề mới" value={newTopic} onChange={e => setNewTopic(e.target.value)} />}
                </div>
                <textarea className={inp} rows={5} placeholder="Dán đoạn văn tiếng Anh (đúng nội dung audio). Trang tự tách thành từng câu để bạn nghe và chép." value={text} onChange={e => setText(e.target.value)} />
                <label className="block px-4 py-3 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 text-sm font-bold text-center cursor-pointer hover:border-indigo-400">
                  {file ? '🎵 ' + file.name : '+ Chọn file audio (mp3, m4a, wav...) — không bắt buộc, không có thì dùng giọng đọc máy'}
                  <input type="file" accept="audio/*" className="hidden" onChange={e => { setFile(e.target.files[0] || null); e.target.value = ''; }} />
                </label>
                <p className="text-[11px] text-slate-400 leading-relaxed">Audio được lưu ngay trong trình duyệt này (không tải lên mạng) và web tự chia theo từng câu dựa vào quãng lặng. Chỉ dùng audio bạn có quyền sử dụng.</p>
                <button onClick={() => addLesson(title, text, topicSel, file)} disabled={!text.trim() || !!busy} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold disabled:opacity-40`}>{busy || 'Tạo bài nghe'}</button>
              </div>
              <div className="space-y-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                <p className="text-xs font-black uppercase tracking-wider text-slate-400">Cách 2 · Dùng câu ví dụ của một List từ vựng</p>
                <div className="flex flex-wrap gap-2">
                  <select className={inp + ' flex-1 min-w-[160px]'} value={dk || (decks[0] || {}).id || ''} onChange={e => { setDk(e.target.value); setLk(''); }}>
                    {decks.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                  <select className={inp + ' w-40'} value={lk || (deckListInfo[0] || {}).id || ''} onChange={e => setLk(e.target.value)}>
                    {deckListInfo.map(l => <option key={l.id} value={l.id}>List {l.id}</option>)}
                  </select>
                  <button onClick={fromDeck} disabled={!decks.length} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold disabled:opacity-40`}>Tạo bài nghe</button>
                </div>
              </div>
            </div>
          )}

          {/* CHI TIẾT 1 CHỦ ĐỀ KHI BẤM VÀO CARD */}
          {activeTopic ? (
            <div className="space-y-4">
              <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <button onClick={() => setActiveTopicId(null)} className="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold flex items-center gap-1.5">
                    <Icon name="arrowLeft" className="w-4 h-4" /><span>All topics (Tất cả chủ đề)</span>
                  </button>
                  <div className="flex flex-wrap items-center gap-2">
                    <button onClick={() => { setTopicSel(activeTopic.id); setForm(true); }} className="px-3.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center gap-1">
                      <Icon name="plus" className="w-3.5 h-3.5" /><span>Thêm bài vào chủ đề này</span>
                    </button>
                    {activeTopic.url && (
                      <a href={activeTopic.url} target="_blank" rel="noopener noreferrer" className={`px-3.5 py-1.5 rounded-xl ${tColor.light} ${tColor.text} text-xs font-bold hover:opacity-90`}>
                        Mở trên DailyDictation ({activeTopic.ddLessons} bài) ↗
                      </a>
                    )}
                  </div>
                </div>
                <div className="flex items-start gap-4">
                  <TopicThumb topic={activeTopic} tColor={tColor} size="w-20 h-20" />
                  <div className="space-y-1 min-w-0 flex-1">
                    <div className="flex flex-wrap items-center gap-2">
                      <h3 className="text-xl font-black">{activeTopic.name}</h3>
                      {activeTopic.video && <span className="px-2.5 py-0.5 rounded-full bg-amber-400 text-slate-900 text-xs font-black">Video</span>}
                      {activeTopic.levels && <span className="px-2.5 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-500">Levels: {activeTopic.levels}</span>}
                    </div>
                    {activeTopic.desc && <p className="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">{activeTopic.desc}</p>}
                  </div>
                </div>
              </div>

              {countOf(activeTopic.id) > 0 ? (
                renderLessonCards(all.filter(l => (l.topic || 'other') === activeTopic.id))
              ) : (
                <div className="p-8 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 text-center space-y-3">
                  <p className="text-sm text-slate-400">Chưa có bài nghe nào trong chủ đề này trên máy của bạn.</p>
                  <div className="flex flex-wrap justify-center gap-2">
                    <button onClick={() => { setTopicSel(activeTopic.id); setForm(true); }} className={`px-4 py-2 rounded-xl ${tColor.bg} text-white text-xs font-bold`}>+ Thêm bài nghe mới</button>
                    {activeTopic.url && <a href={activeTopic.url} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold">Mở {activeTopic.ddLessons} bài trên DailyDictation ↗</a>}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="inline-flex bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
                  <button onClick={() => setViewMode('topics')} className={`px-4 py-2 rounded-lg transition ${viewMode === 'topics' ? 'bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'text-slate-500'}`}>
                    All topics ({topics.filter(t => t.ddLessons > 0 || countOf(t.id) > 0).length} chủ đề)
                  </button>
                  <button onClick={() => setViewMode('lessons')} className={`px-4 py-2 rounded-lg transition ${viewMode === 'lessons' ? 'bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'text-slate-500'}`}>
                    Tất cả bài nghe trong web ({all.length})
                  </button>
                </div>
                <a href="https://dailydictation.com/exercises" target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline">
                  dailydictation.com/exercises ↗
                </a>
              </div>

              {viewMode === 'topics' ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {topics.filter(t => t.ddLessons > 0 || countOf(t.id) > 0).map(t => {
                    const localCnt = countOf(t.id);
                    const showDesc = !!openDescs[t.id];
                    return (
                      <div key={t.id} onClick={() => setActiveTopicId(t.id)} role="button" tabIndex={0} onKeyDown={e => e.key === 'Enter' && setActiveTopicId(t.id)}
                        className="cursor-pointer p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-400 hover:shadow-md transition flex flex-col justify-between space-y-3">
                        <div className="flex items-start gap-3.5">
                          <TopicThumb topic={t} tColor={tColor} size="w-20 h-20" />
                          <div className="min-w-0 flex-1 space-y-1">
                            <div className="flex flex-wrap items-center gap-1.5">
                              <h3 className={`font-black text-lg leading-snug ${tColor.text} hover:underline`}>{t.name}</h3>
                              {t.video && <span className="px-2 py-0.5 rounded-full bg-amber-400 text-slate-900 text-[11px] font-black">Video</span>}
                            </div>
                            {t.levels && <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Levels: {t.levels}</p>}
                            <div className="flex flex-wrap items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">
                              <span>{t.ddLessons ? `${t.ddLessons} lessons` : `${localCnt} bài`}</span>
                              {t.ddLessons > 0 && localCnt > 0 && <span className="px-1.5 py-0.5 rounded bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-[10px] font-bold">{localCnt} bài trong web</span>}
                              {t.desc && (
                                <button type="button" onClick={(e) => toggleDesc(t.id, e)} title="Xem mô tả chủ đề"
                                  className="px-2 py-0.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 font-black tracking-wider">
                                  •••
                                </button>
                              )}
                            </div>
                          </div>
                        </div>

                        {showDesc && t.desc && (
                          <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed pt-2 border-t border-slate-100 dark:border-slate-800" onClick={e => e.stopPropagation()}>
                            {t.desc}
                          </p>
                        )}

                        <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800" onClick={e => e.stopPropagation()}>
                          <button type="button" onClick={() => setActiveTopicId(t.id)} className={`flex-1 py-2 px-3 rounded-xl ${tColor.bg} text-white text-xs font-bold shadow-sm`}>
                            Luyện nghe ({localCnt} bài)
                          </button>
                          {t.url && (
                            <a href={t.url} target="_blank" rel="noopener noreferrer" title="Mở toàn bộ bài nghe trên DailyDictation.com"
                              className="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:border-indigo-400">
                              Web gốc ↗
                            </a>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="space-y-4">
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => setFilter('all')} className={`px-3.5 py-2 rounded-xl border text-xs font-bold ${filter === 'all' ? tColor.bg + ' text-white border-transparent' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-500'}`}>Tất cả ({all.length})</button>
                    {topics.filter(t => countOf(t.id) > 0).map(t => (
                      <button key={t.id} onClick={() => setFilter(t.id)} className={`px-3.5 py-2 rounded-xl border text-xs font-bold ${filter === t.id ? tColor.bg + ' text-white border-transparent' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-500'}`}>{t.icon} {t.name} ({countOf(t.id)})</button>
                    ))}
                  </div>
                  {renderLessonCards(all.filter(l => filter === 'all' || (l.topic || 'other') === filter))}
                </div>
              )}
            </div>
          )}
        </Shell>
      );
    }

    function Root() {
      const [auth, setAuth] = useState(() => { const u = Auth.current(); Store.setUser(u); return { user: u, guest: !u && Auth.isGuest() }; });
      useEffect(() => {
        if (!auth.user && !auth.guest) {
          const r = document.documentElement;
          Array.from(r.classList).filter(c => c.startsWith('sk-') || c === 'char-theme' || c === 'dark').forEach(c => r.classList.remove(c));
          document.body.classList.remove('char-theme');
        }
      }, [auth]);
      const enter = (user) => { Store.setUser(user); Auth.setCurrent(user); setAuth({ user, guest: !user }); };
      if (!auth.user && !auth.guest) {
        return <AuthScreen onAuth={enter} onGuest={() => { Auth.setGuest(true); enter(null); }} />;
      }
      const userName = auth.user ? ((Auth.users()[auth.user] || {}).name || auth.user) : null;
      return <App key={auth.user || '__guest'} user={auth.user} userName={userName}
        onLogout={() => { Auth.setCurrent(null); Auth.setGuest(false); Store.setUser(null); setAuth({ user: null, guest: false }); }}
        onLogin={() => { Auth.setGuest(false); Store.setUser(null); setAuth({ user: null, guest: false }); }} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
   root.render(<Root />);
    // Bật lại hiệu ứng chuyển màu sau khi khung hình đầu tiên đã vẽ xong
    requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.add('app-ready')));
  </script>

</body>
</html>
