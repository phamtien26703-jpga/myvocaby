<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MyVocab - Học theo Deck & Luyện Tập</title>
  <meta name="color-scheme" content="light dark" />
  <!-- Áp giao diện (sáng/tối/hình nền) NGAY TRƯỚC khi vẽ trang để không bị nháy khi tải lại -->
  <script>
  (function () {
    var d = document.documentElement;
    try {
      var ses = localStorage.getItem('myvocab_auth_session');
      var users = JSON.parse(localStorage.getItem('myvocab_auth_users')) || {};
      var user = ses && users[ses] ? ses : null;
      var guest = !user && localStorage.getItem('myvocab_auth_guest') === '1';
      if (!user && !guest) return;
      var p = user ? 'u_' + user + '__' : '';
      var ui = JSON.parse(localStorage.getItem(p + 'myvocab_v4_ui')) || {};
      var skin = ui.skin !== undefined ? ui.skin : (ui.charMode ? 'char' : '');
      var built = ['char', 'sakura', 'night', 'mint', 'ocean', 'sunset'];
      var custom = null;
      if (skin && built.indexOf(skin) < 0) {
        var arr = JSON.parse(localStorage.getItem(p + 'myvocab_v4_skins')) || [];
        for (var i = 0; i < arr.length; i++) if (arr[i].id === skin) custom = arr[i];
      }
      if (custom) {
        d.classList.add('char-theme', 'sk-custom');
        d.style.setProperty('--sk-cimg', 'url("' + custom.img + '")');
      } else if (built.indexOf(skin) >= 0) {
        d.classList.add('char-theme', 'sk-' + skin);
      } else if (ui.darkMode) {
        d.classList.add('dark');
        d.style.backgroundColor = '#020617';
      }
      if (!d.classList.contains('char-theme') && !ui.darkMode) d.style.backgroundColor = '#f8fafc';
    } catch (e) {}
  })();
  </script>

    /* ===== GIAO DIỆN HÌNH NỀN (SKIN) ===== */
    .char-bg{display:none}
    .char-avatar{background:var(--sk-avatar) center/cover no-repeat;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 12px var(--sk-glow)}
    html.sk-night{color-scheme:dark}
    html.char-theme{background:rgb(var(--sk-wash))}
    body.char-theme{background:transparent!important;color:var(--sk-t1)!important}
    .char-theme .char-bg{display:block;position:fixed;inset:0;z-index:-1;background:var(--sk-bg)}
    @media(max-width:768px){.char-theme .char-bg{background:var(--sk-bg-m,var(--sk-bg))}}
    .char-theme aside{background:var(--sk-aside)!important;backdrop-filter:blur(14px);border-color:var(--sk-bd)!important}
    .char-theme nav.fixed{background:var(--sk-nav)!important;backdrop-filter:blur(14px)}
    .char-theme .bg-white{background:var(--sk-card)!important;backdrop-filter:blur(10px)}
    .char-theme .sk-modal{background:rgba(var(--sk-wash),.97)!important}
    .char-theme .bg-slate-50{background:var(--sk-soft)!important}
    .char-theme .vocab-row:hover{background:var(--sk-soft)!important}
    .char-theme .bg-slate-100,.char-theme .bg-slate-200\/70{background:var(--sk-chip)!important}
    .char-theme .border-slate-200,.char-theme .border-slate-100,.char-theme .border-slate-300,.char-theme .divide-slate-100>*{border-color:var(--sk-bd)!important}
    .char-theme .text-slate-400{color:var(--sk-t3)!important}
    .char-theme .text-slate-500{color:var(--sk-t2)!important}
    .char-theme .text-slate-600,.char-theme .text-slate-700,.char-theme .text-slate-800{color:var(--sk-t1)!important}
    .char-theme .text-slate-900{color:var(--sk-t0)!important}
    .char-theme .bg-indigo-600{background:linear-gradient(135deg,var(--sk-ac1),var(--sk-ac2))!important;color:#fff!important;box-shadow:0 6px 16px -4px var(--sk-glow)}
    .char-theme .bg-indigo-50,.char-theme .bg-indigo-100,.char-theme .bg-indigo-100\/80{background:var(--sk-chip2)!important}
    .char-theme .text-indigo-600,.char-theme .text-indigo-500,.char-theme .text-indigo-400{color:var(--sk-acx)!important}
    .char-theme .border-indigo-300,.char-theme .border-indigo-400,.char-theme .border-indigo-500{border-color:var(--sk-acb)!important}
    .char-theme .hover\:border-indigo-400:hover,.char-theme .focus\:border-indigo-500:focus{border-color:var(--sk-acb)!important}
    .char-theme button{transition:transform .15s,box-shadow .15s,filter .15s}
    .char-theme button:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.05)}
    .char-theme .bg-indigo-600:not(:disabled):hover{box-shadow:0 10px 22px -4px var(--sk-glow)}
    .char-theme ::-webkit-scrollbar-thumb{background:var(--sk-sb)}
    .sk-night ::placeholder{color:#8b85c9}
    .water-wash{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(var(--sk-wash),.3),rgba(var(--sk-wash),.5))}

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"><div id="boot"><i></i></div></div>

  <script src="vocab-data.js"></script>
<script src="listening-data.js"></script>
  <script src="vocab.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- LƯU TRỮ THEO TÀI KHOẢN ---
    // Mỗi tài khoản có vùng dữ liệu riêng trong localStorage (tiền tố u_<tên>__). Khách dùng khoá gốc.
    const Store = {
      p: '',
      setUser(u) { this.p = u ? 'u_' + u + '__' : ''; },
      get(k) { return localStorage.getItem(this.p + k); },
      set(k, v) { localStorage.setItem(this.p + k, v); }
    };

    function useNavState(key, initVal) {
      const [val, setVal] = useState(() => {
        try {
          const raw = Store.get('myvocab_nav_' + key);
          if (raw !== null && raw !== undefined) return JSON.parse(raw);
        } catch (e) {}
        return typeof initVal === 'function' ? initVal() : initVal;
      });
      useEffect(() => {
        try { Store.set('myvocab_nav_' + key, JSON.stringify(val)); } catch (e) {}
      }, [key, val]);
      return [val, setVal];
    }

    // ==========================================
    // THỐNG KÊ HỌC TẬP (thời gian, từ đã học, đúng/sai) – lưu theo từng tài khoản
    // ==========================================
    const Stats = {
      d: null, p: '', listeners: new Set(), resolve: null,
      dateStr(dt) { const t = dt || new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); },
      load() {
        this.p = Store.p; // nhớ vùng lưu của tài khoản để không ghi nhầm khi đăng xuất
        let o = null; try { o = JSON.parse(localStorage.getItem(this.p + 'myvocab_v4_stats')); } catch (e) {}
        if (!o || typeof o !== 'object') o = {};
        this.d = { since: o.since || Date.now(), days: o.days || {}, decks: o.decks || {}, other: o.other || 0 };
      },
      data() { if (!this.d) this.load(); return this.d; },
      notify() { this.listeners.forEach(f => f()); },
      save() { try { if (this.d) localStorage.setItem(this.p + 'myvocab_v4_stats', JSON.stringify(this.d)); } catch (e) {} this.notify(); },
      deck(id) { const D = this.data(); return D.decks[id] || (D.decks[id] = { sec: 0, ok: 0, bad: 0, days: {}, seen: {}, known: {} }); },
      addTime(deckId, sec) {
        const D = this.data(), day = this.dateStr();
        D.days[day] = (D.days[day] || 0) + sec;
        if (deckId) { const k = this.deck(deckId); k.sec += sec; k.days[day] = (k.days[day] || 0) + sec; }
        else D.other += sec;
      },
      answer(n, ok) {
        const id = this.resolve && this.resolve(n); if (!id) return;
        const k = this.deck(id);
        if (ok) { k.ok++; k.known[n] = 1; } else { k.bad++; delete k.known[n]; }
        k.seen[n] = 1; this.save();
      },
      seen(n) {
        const id = this.resolve && this.resolve(n); if (!id) return;
        const k = this.deck(id);
        if (!k.seen[n]) { k.seen[n] = 1; this.save(); }
      },
      reset() { this.d = { since: Date.now(), days: {}, decks: {}, other: 0 }; this.save(); }
    };

    // --- TÀI KHOẢN (lưu cục bộ trên trình duyệt, mật khẩu được băm PBKDF2) ---
    const Auth = {
      users() { try { return JSON.parse(localStorage.getItem('myvocab_auth_users')) || {}; } catch (e) { return {}; } },
      saveUsers(u) { localStorage.setItem('myvocab_auth_users', JSON.stringify(u)); },
      current() { try { const u = localStorage.getItem('myvocab_auth_session'); return u && this.users()[u] ? u : null; } catch (e) { return null; } },
      setCurrent(u) { try { if (u) localStorage.setItem('myvocab_auth_session', u); else localStorage.removeItem('myvocab_auth_session'); } catch (e) {} },
      isGuest() { try { return localStorage.getItem('myvocab_auth_guest') === '1'; } catch (e) { return false; } },
      setGuest(v) { try { if (v) localStorage.setItem('myvocab_auth_guest', '1'); else localStorage.removeItem('myvocab_auth_guest'); } catch (e) {} },
      hasGuestData() { try { return !!(localStorage.getItem('myvocab_v4_cards') || localStorage.getItem('myvocab_v3_1257')); } catch (e) { return false; } },
      randomSalt() {
        const a = new Uint8Array(16);
        if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (let i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256);
        return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
      },
      async hash(pw, salt, algo) {
        if ((!algo || algo === 'p1') && window.crypto && crypto.subtle) {
          const enc = new TextEncoder();
          const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
          const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256);
          return 'p1:' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        if (algo === 'p1') throw new Error('Trình duyệt này không hỗ trợ xác thực mật khẩu (cần HTTPS).');
        let h1 = 5381, h2 = 52711; const str = salt + pw;
        for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = ((h1 * 33) ^ c) >>> 0; h2 = ((h2 * 31) + c * 7) >>> 0; }
        return 'f1:' + h1.toString(16) + h2.toString(16);
      },
      async register(username, pw, claimLocal) {
        const key = username.toLowerCase();
        const users = this.users();
        if (users[key]) throw new Error('Tên đăng nhập này đã tồn tại.');
        const salt = this.randomSalt();
        users[key] = { name: username, salt, hash: await this.hash(pw, salt), created: Date.now() };
        this.saveUsers(users);
        if (claimLocal) {
          try {
            const pre = 'u_' + key + '__';
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith('myvocab_') && !k.startsWith('myvocab_auth_')) localStorage.setItem(pre + k, localStorage.getItem(k));
            }
          } catch (e) {}
        }
        return key;
      },
      async login(username, pw) {
        const key = username.toLowerCase();
        const u = this.users()[key];
        if (!u) throw new Error('Sai tên đăng nhập hoặc mật khẩu.');
        const algo = String(u.hash).split(':')[0];
        const h = await this.hash(pw, u.salt, algo);
        if (h !== u.hash) throw new Error('Sai tên đăng nhập hoặc mật khẩu.');
        return key;
      }
    };


    // --- 1. ÂM THANH PHẢN HỒI ---
    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      play(freq, type, duration, delay = 0) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) {}
      },
      correct() {
        this.play(523.25, 'sine', 0.1, 0);
        this.play(659.25, 'sine', 0.2, 0.08);
      },
      wrong() {
        this.play(220, 'sawtooth', 0.15, 0);
        this.play(180, 'sawtooth', 0.2, 0.1);
      }
    };

    // --- 2. PHÁT ÂM UK / US (TỪ VỰNG & CÂU VÍ DỤ) + CHỌN GIỌNG ---
    // Giọng đọc phụ thuộc thiết bị/trình duyệt nên lưu chung cho cả máy (không theo tài khoản).
    const VoiceKit = {
      KEY: 'myvocab_voice_prefs',
      _p: null,
      prefs() {
        if (!this._p) {
          let p = {};
          try { p = JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) {}
          this._p = { gender: p.gender || 'female', 'en-GB': p['en-GB'] || 'auto', 'en-US': p['en-US'] || 'auto',
            pitch: Number(p.pitch) >= 0.7 && Number(p.pitch) <= 1.5 ? Number(p.pitch) : 1 };
        }
        return this._p;
      },
      set(patch) {
        this._p = { ...this.prefs(), ...patch };
        try { localStorage.setItem(this.KEY, JSON.stringify(this._p)); } catch (e) {}
      },
      english() {
        if (!('speechSynthesis' in window)) return [];
        return (window.speechSynthesis.getVoices() || []).filter(v => /^en([-_]|$)/i.test(v.lang));
      },
      region(v) { return String(v.lang || '').replace('_', '-').split('-')[1] || ''; },
      gender(v) {
        const n = String(v.name || '').toLowerCase();
        if (/\bfemale\b|\bwoman\b/.test(n)) return 'f';
        if (/\bmale\b|\bman\b/.test(n)) return 'm';
        if (/^google (us|uk) english$/.test(n)) return 'f';
        if (/\b(aria|jenny|michelle|ana|sonia|libby|maisie|natasha|clara|emma|jane|nancy|sara|ashley|amber|elizabeth|monica|zira|hazel|susan|linda|catherine|heera|neerja|samantha|karen|moira|tessa|serena|kate|fiona|victoria|allison|ava|nicky|veena|zoe|joanna|salli|kimberly|kendra|ivy|amy|emily|olivia|ruth|danielle|jessa|jessica|siri|grandma|flo|sandy|shelley)\b/.test(n)) return 'f';
        if (/\b(david|mark|guy|ryan|thomas|daniel|alex|fred|oliver|arthur|george|james|richard|eric|christopher|roger|steffan|brian|davis|tony|jason|aaron|rishi|gordon|lee|evan|nathan|reed|ralph|junior|albert|bruce|rocko|grandpa|eddy|liam|connor|william|prabhat|ravi|sean)\b/.test(n)) return 'm';
        return '?';
      },
      quality(v) {
        const n = String(v.name || '').toLowerCase();
        let s = 0;
        if (/natural|neural/.test(n)) s += 100;
        if (/online/.test(n)) s += 15;
        if (/google/.test(n)) s += 60;
        if (/premium|enhanced/.test(n)) s += 50;
        if (/siri/.test(n)) s += 45;
        if (v.localService === false) s += 10;
        if (/compact|espeak|novelty/.test(n)) s -= 50;
        return s;
      },
      isGood(v) { return this.quality(v) >= 45; },
      slotOf(lang) { return /GB|UK/i.test(String(lang)) ? 'en-GB' : 'en-US'; },
      score(v, slot, gender) {
        const reg = slot === 'en-GB' ? 'GB' : 'US';
        let s = this.quality(v);
        if (this.region(v).toUpperCase() === reg) s += 40;
        const g = this.gender(v);
        if (gender === 'female' && g === 'f') s += 40;
        if (gender === 'male' && g === 'm') s += 40;
        return s;
      },
      allowed(v, gender) {
        const g = this.gender(v);
        if (gender === 'female') return g !== 'm';
        if (gender === 'male') return g !== 'f';
        return true;
      },
      ranked(slot, gender) {
        const all = this.english();
        const f = all.filter(v => this.allowed(v, gender));
        return (f.length ? f : all).slice().sort((a, b) => this.score(b, slot, gender) - this.score(a, slot, gender));
      },
      best(slot, gender) { return this.ranked(slot, gender)[0] || null; },
      pick(lang) {
        const slot = this.slotOf(lang), p = this.prefs();
        if (p[slot] && p[slot] !== 'auto') {
          const f = this.english().find(v => v.name === p[slot]);
          if (f) return f;
        }
        return this.best(slot, p.gender);
      },
      say(text, voice, lang, rate) {
        if (!('speechSynthesis' in window) || !text) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text).replace(/[\[\]]/g, '').trim());
        u.rate = rate || 1;
        u.pitch = this.prefs().pitch;
        u.lang = lang;
        if (voice) { u.voice = voice; u.lang = voice.lang; }
        window.speechSynthesis.speak(u);
      }
    };

    function speak(text, lang = "en-US", rate = 1) {
      if (!('speechSynthesis' in window) || !text) return;
      VoiceKit.say(text, VoiceKit.pick(lang), lang, rate);
    }

    // --- 3. ICON SVG NỘI BỘ ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const paths = {

        upload: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />,
        pencilCircle: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
        cardCircle: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2zM9 7h6M9 11h6M9 15h4" />,
        volume: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
        arrowLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />,
        arrowRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />,
        sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,
        moon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />,
        warning: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />,
        rotate: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
        folder: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,

    function parseExcelContent(rawText, existingCardsMap) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(rawText, "text/xml");
      const rows = Array.from(xmlDoc.getElementsByTagName("Row"));
      if (rows.length === 0) {
        const ssRows = Array.from(xmlDoc.getElementsByTagName("ss:Row"));
        rows.push(...ssRows);
      }

      let shortSeqCounter = 0;

      rows.forEach(row => {
        const cells = Array.from(row.children).filter(el => el.tagName.endsWith("Cell"));
        const texts = cells.map(c => {
          const d = Array.from(c.children).find(el => el.tagName.endsWith("Data"));
          return d && d.textContent ? d.textContent.trim() : "";
        });

        texts.forEach(t => {
          if (t && t.includes("[#")) {
            const lines = t.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const numMatch = lines[0].match(/\[#(\d+)\]/);
            if (!numMatch) return;
            const num = parseInt(numMatch[1], 10);
            const listNum = Math.min(23, Math.floor((num - 1) / 55) + 1);

            let word = "", pos = "", ipa = "";
            if (SPECIAL_FIXES[num]) {
              [word, pos, ipa] = SPECIAL_FIXES[num];
            } else {
              const ipaM = lines[0].match(/(\/[^\n/]+\/)/);
              ipa = ipaM ? ipaM[1] : "";
              let hdr = lines[0].replace(/\[#\d+\]\s*/, "").replace(/\(UK\s*\/\s*US\)/g, "").trim();
              if (ipa) hdr = hdr.replace(ipa, "").trim();
              const posM = hdr.match(/\(([^)]+)\)/);
              if (posM) {
                pos = posM[1].trim();
                word = hdr.replace(`(${pos})`, "").trim();
              } else {
                word = hdr.trim();
              }
            }

            let def_vn = "", def_en = "";
            const examples = [];
            let sec = null;
            for (let i = 1; i < lines.length; i++) {
              const l = lines[i];
              if (l.startsWith("Định nghĩa:")) {
                sec = "def";
                const rest = l.replace("Định nghĩa:", "").trim();
                if (rest) def_vn = rest;
                continue;
              }
              if (l.startsWith("Ví dụ:")) {
                sec = "ex";
                continue;
              }
              if (sec === "def") {
                if (l.startsWith("=")) def_en = l.replace(/^=\s*/, "").trim();
                else def_vn = (def_vn + " " + l).trim();
              } else if (sec === "ex") {
                if (l.startsWith("•") || l.startsWith("-")) {
                  examples.push(l.replace(/^[•\-\s]+/, "").trim());
                } else if (examples.length > 0) {
                  examples[examples.length - 1] += " " + l;
                } else {
                  examples.push(l);
                }
              }
            }

            const prev = existingCardsMap.get(num) || {};
            existingCardsMap.set(num, {
              n: num,
              l: listNum,
              w: word || prev.w || "",
              p: pos || prev.p || "",
              i: ipa || prev.i || "",
              s: prev.s || def_vn,
              v: def_vn || prev.v || "",
              e: def_en || prev.e || "",
              x: examples.length > 0 ? examples : (prev.x || [])
            });
          }
        });

        const nonEmpty = texts.filter(Boolean);
        if (nonEmpty.length >= 2 && !texts.some(t => t.includes("[#")) && !nonEmpty[0].includes("PHẦN")) {
          let num = null;
          let w = "", s = "";
          if (/^\d+$/.test(nonEmpty[0]) && nonEmpty.length >= 3) {
            num = parseInt(nonEmpty[0], 10);
            w = nonEmpty[1];
            s = nonEmpty[2];
          } else {
            shortSeqCounter++;
            num = shortSeqCounter;
            w = nonEmpty[0];
            s = nonEmpty[1];
          }

          if (num >= 1 && num <= 1257) {
            const listNum = Math.min(23, Math.floor((num - 1) / 55) + 1);
            let cleanW = w;
            let cleanP = "";
            let cleanI = "";
            if (SPECIAL_FIXES[num]) {
              [cleanW, cleanP, cleanI] = SPECIAL_FIXES[num];
            }
            const prev = existingCardsMap.get(num) || {};
            existingCardsMap.set(num, {
              n: num,
              l: listNum,
              w: prev.w || cleanW,
              p: prev.p || cleanP,
              i: prev.i || cleanI,
              s: s,
              v: prev.v || s,
              e: prev.e || "",
              x: prev.x || []
            });
          }
        }
      });
    }

    function seededShuffle(arr, seed) {
      const a = [...arr]; let s = (seed >>> 0) || 1;
      const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;

    function Mic({ lang, onText, continuous, label }) {
      const [on, setOn] = useState(false);
      const [interim, setInterim] = useState('');
      const rec = useRef(null);
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const stop = () => { try { rec.current && rec.current.stop(); } catch (e) {} setOn(false); setInterim(''); };
      const start = () => {
        if (!SR) { alert('Trình duyệt chưa hỗ trợ nhận diện giọng nói. Hãy dùng Chrome hoặc Edge (mở qua https hoặc localhost).'); return; }
        const r = new SR();
        r.lang = lang; r.continuous = !!continuous; r.interimResults = true;
        r.onresult = (e) => {
          let fin = '', tmp = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) fin += t; else tmp += t;
          }
          setInterim(tmp);
          if (fin.trim()) onText(fin.trim());
        };
        r.onend = () => { setOn(false); setInterim(''); };
        r.onerror = () => setOn(false);
        rec.current = r; r.start(); setOn(true);
      };
      useEffect(() => () => { try { rec.current && rec.current.abort(); } catch (e) {} }, []);
      return (
        <span className="inline-flex items-center gap-2">
          <button type="button" onClick={on ? stop : start} title={on ? 'Bấm để dừng' : 'Bấm để nói'}

    function compressImage(file, maxSide = 1600) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onerror = reject;
        fr.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const k = Math.min(1, maxSide / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            resolve(cv.toDataURL('image/jpeg', 0.82));
          };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

          try { Store.set('myvocab_v4_seedver', ver); } catch (e) {}

        if (seen !== ver) {
          const dIds = new Set(stored.decks.map(d => d.id));

          const merged = {
            decks: [...stored.decks, ...sDecks.filter(d => !dIds.has(d.id))],

  for (int i = 0; i < ${MAXD}; i++) {
    vec4 d = uD[i];
    if (d.w > 0.0) {
      vec2 v = q - vec2(d.x * sa, d.y);
      float r = length(v);
      float front = d.z * 0.42;
      float w = 0.07 + d.z * 0.05;
      float x = (r - front) / w;
      float env = exp(-x * x) * exp(-d.z * 1.1) * d.w;
      float ph = (r - front) * 42.0;
      disp += (v / (r + 0.0001)) * sin(ph) * env;
      shade += cos(ph) * env;
    }
  }
  vec2 amb = vec2(sin(vUv.y * 16.0 + uTime * 1.1 + sin(vUv.x * 5.0 + uTime * 0.4)), cos(vUv.x * 13.0 - uTime * 0.9)) * 0.0016;
  vec2 off = disp * 0.024 * uAmp + amb * uAmp * 0.8;
  off.x /= sa;
  vec2 p = (vUv - 0.5) / 1.08 + 0.5 + uPar + off;
  vec3 col = texture2D(uTex, cover(p)).rgb;
  col += vec3(shade * 0.07 * uAmp);
  gl_FragColor = vec4(col, 1.0);
}`;

      // ----- Vẽ nền cho các giao diện không có ảnh -----
      const rng = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      const grad = (c, w, h, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(s => g.addColorStop(s[0], s[1])); c.fillStyle = g; c.fillRect(0, 0, w, h); };
      const blob = (c, x, y, r, rgb, a) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); };
      const painters = {
        sakura(c, w, h) {
          grad(c, w, h, 0, 0, w * 0.35, h, [[0, '#fff1f6'], [0.55, '#ffe0ee'], [1, '#f3e1ff']]);
          const r = rng(7); c.fillStyle = 'rgba(249,168,212,.55)';
          for (let i = 0; i < 70; i++) { c.save(); c.translate(r() * w, r() * h); c.rotate(r() * 6.28); c.beginPath(); c.ellipse(0, 0, 10 + r() * 12, 5 + r() * 6, 0, 0, 6.28); c.fill(); c.restore(); }
        },
        night(c, w, h) {
          grad(c, w, h, 0, 0, 0, h, [[0, '#0f0c29'], [0.55, '#1e1b4b'], [1, '#312e81']]);
          blob(c, w * 0.85, h * 0.12, Math.max(w, h) * 0.2, '196,181,253', 0.55);
          const r = rng(11);
          for (let i = 0; i < 160; i++) { c.fillStyle = `rgba(255,255,255,${0.4 + r() * 0.6})`; c.beginPath(); c.arc(r() * w, r() * h, 0.6 + r() * 1.4, 0, 6.28); c.fill(); }
        },
        mint(c, w, h) {
          grad(c, w, h, 0, 0, w * 0.4, h, [[0, '#f0fdf8'], [1, '#d9f7e8']]);
          blob(c, w * 0.12, h * 0.18, Math.max(w, h) * 0.28, '110,231,183', 0.5);
          blob(c, w * 0.88, h * 0.3, Math.max(w, h) * 0.3, '103,232,249', 0.45);
          blob(c, w * 0.3, h * 0.85, Math.max(w, h) * 0.3, '167,243,208', 0.55);
        },
        ocean(c, w, h) {
          grad(c, w, h, 0, 0, 0, h, [[0, '#eaf6ff'], [0.7, '#cfe9ff'], [1, '#b9defc']]);
          [[0.72, 'rgba(56,189,248,.25)'], [0.82, 'rgba(99,102,241,.18)'], [0.9, 'rgba(56,189,248,.3)']].forEach((l, k) => {
            c.fillStyle = l[1]; c.beginPath(); c.moveTo(0, h);
            for (let x = 0; x <= w; x += 8) c.lineTo(x, h * l[0] + Math.sin(x / w * 12 + k * 1.7) * h * 0.02);
            c.lineTo(w, h); c.closePath(); c.fill();
          });
        },
        sunset(c, w, h) {
          grad(c, w, h, 0, 0, 0, h, [[0, '#ffd9b0'], [0.5, '#fdaab8'], [1, '#c9a8ff']]);
          blob(c, w * 0.5, h * 0.72, Math.max(w, h) * 0.3, '255,236,190', 0.85);
        }
      };
      const paintSize = () => ({ w: 1024, h: Math.max(512, Math.min(2048, Math.round(1024 * innerHeight / innerWidth))) });
      const paintCanvas = (id) => { const { w, h } = paintSize(); const c = document.createElement('canvas'); c.width = w; c.height = h; painters[id](c.getContext('2d'), w, h); return c; };

      const makeTex = (gl, source) => {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        return t;
      };

      const addDrop = (s, x, y, strength) => {
        s.drops[s.di] = { x, y, s: strength, t: performance.now() };
        s.di = (s.di + 1) % MAXD;
      };

      function frame(now) {
        const s = st; if (!s) return;
        s.raf = requestAnimationFrame(frame);
        const gl = s.gl;
        const t = (now - s.t0) / 1000;
        s.px += (s.mx - s.px) * 0.05; s.py += (s.my - s.py) * 0.05;
        for (let i = 0; i < MAXD; i++) {
          const d = s.drops[i];
          const age = d ? (now - d.t) / 1000 : 99;
          if (d && age >= 0 && age < 4) { s.arr[i * 4] = d.x; s.arr[i * 4 + 1] = d.y; s.arr[i * 4 + 2] = age; s.arr[i * 4 + 3] = d.s; }
          else s.arr[i * 4 + 3] = 0;
        }
        const U = s.U;
        gl.uniform2f(U.uRes, s.cv.width, s.cv.height);
        gl.uniform2f(U.uImg, s.iw, s.ih);
        gl.uniform2f(U.uFocus, 0.5, 0.78);
        gl.uniform2f(U.uPar, s.px * 0.03 + Math.sin(t * 0.17) * 0.006, s.py * 0.03 + Math.cos(t * 0.13) * 0.006);
        gl.uniform1f(U.uTime, t);
        gl.uniform1f(U.uAmp, s.amp);
        gl.uniform4fv(U.uD, s.arr);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      function init(s, source, iw, ih, isPaint) {
        const cv = document.createElement('canvas');
        cv.id = 'water-canvas';
        cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block';
        const gl = cv.getContext('webgl', { antialias: false, alpha: false }) || cv.getContext('experimental-webgl');
        if (!gl) throw new Error('no webgl');
        const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
        const prog = gl.createProgram();
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('link');
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        const U = {};
        ['uTex', 'uRes', 'uImg', 'uPar', 'uFocus', 'uTime', 'uAmp', 'uD'].forEach(n => { U[n] = gl.getUniformLocation(prog, n); });
        gl.uniform1i(U.uTex, 0);
        const tex = makeTex(gl, source);

        const wash = document.createElement('div');
        wash.className = 'water-wash';
        Object.assign(s, { cv, gl, U, tex, iw, ih, isPaint, wash, arr: new Float32Array(MAXD * 4), t0: performance.now() });

        let lastW = 0;
        s.onResize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, innerWidth < 768 ? 1.25 : 1.5);
          let k = dpr; if (innerWidth * k > 1920) k = 1920 / innerWidth;
          cv.width = Math.max(2, Math.round(innerWidth * k));
          cv.height = Math.max(2, Math.round(innerHeight * k));
          gl.viewport(0, 0, cv.width, cv.height);
          if (s.isPaint) {
            const asp = innerWidth / innerHeight;
            if (Math.abs(asp - lastW) > 0.02) {
              lastW = asp;
              const pc = paintCanvas(s.paintId);
              gl.deleteTexture(s.tex); s.tex = makeTex(gl, pc); s.iw = pc.width; s.ih = pc.height;
            }
          }
        };
        s.onMove = (e) => {
          const x = e.clientX, y = e.clientY, now = performance.now();
          s.mx = x / innerWidth - 0.5; s.my = 0.5 - y / innerHeight;
          if (s.lx < 0) { s.lx = x; s.ly = y; s.lt = now; return; }
          const dist = Math.hypot(x - s.lx, y - s.ly);
          if (dist > 26 && now - s.lt > 40) {
            addDrop(s, x / innerWidth, 1 - y / innerHeight, 0.35 + 0.35 * Math.min(1, dist / 90));
            s.lx = x; s.ly = y; s.lt = now;
          }
        };
        s.onDown = (e) => { addDrop(s, e.clientX / innerWidth, 1 - e.clientY / innerHeight, 1.0); s.lx = e.clientX; s.ly = e.clientY; s.lt = performance.now(); };
        s.onResize();
        window.addEventListener('resize', s.onResize);
        window.addEventListener('pointermove', s.onMove, { passive: true });
        window.addEventListener('pointerdown', s.onDown, { passive: true });
        document.body.appendChild(cv);
        document.body.appendChild(wash);
        s.raf = requestAnimationFrame(frame);
      }

      function stop() {
        if (!st) return;
        const s = st; st = null;
        if (s.raf) cancelAnimationFrame(s.raf);
        if (s.onResize) window.removeEventListener('resize', s.onResize);
        if (s.onMove) window.removeEventListener('pointermove', s.onMove);
        if (s.onDown) window.removeEventListener('pointerdown', s.onDown);
        if (s.cv) s.cv.remove();
        if (s.wash) s.wash.remove();
        try { const ext = s.gl && s.gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); } catch (e) {}
      }

      function start(opts) {
        stop();
        const s = { amp: opts.amp, drops: [], di: 0, mx: 0, my: 0, px: 0, py: 0, lx: -1, ly: -1, lt: 0, paintId: opts.paint };
        st = s;
        const fail = () => { if (st !== s) return; stop(); if (opts.onFail) opts.onFail(); };
        const go = (source, iw, ih, isPaint) => { if (st !== s) return; try { init(s, source, iw, ih, isPaint); } catch (e) { fail(); } };
        if (opts.paint) {
          if (!painters[opts.paint]) return fail();
          const pc = paintCanvas(opts.paint);
          go(pc, pc.width, pc.height, true);
        } else if (opts.src) {
          const im = new Image();
          if (!/^data:/i.test(opts.src)) im.crossOrigin = 'anonymous';
          im.onload = () => go(im, im.naturalWidth, im.naturalHeight, false);
          im.onerror = fail;
          im.src = opts.src;
        } else fail();
      }
      return { start, stop, setAmp: (v) => { if (st) st.amp = v; } };
    })();

          {onDel && <button onClick={onDel} title="Xoá ảnh này" className="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/55 text-white text-xs font-bold leading-6 text-center">×</button>}
        </div>
      );
      return (
        <div className="fixed inset-0 z-50 bg-black/25 flex items-end md:items-center justify-center p-3" onClick={onClose}>
          <div className="sk-modal w-full max-w-lg max-h-[88vh] overflow-y-auto rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h3 className="font-black text-lg">🎨 Giao diện hình nền</h3>
              <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">Đóng</button>
            </div>
            <WaterControls enabled={!!skin} waterOn={waterOn} setWaterOn={setWaterOn} waterAmp={waterAmp} setWaterAmp={setWaterAmp} />
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              {tile('none', !skin, () => setSkin(''), 'linear-gradient(135deg,#f8fafc,#cbd5e1)', 'Mặc định', '🚫')}
              {SKINS.map(k => tile(k.id, skin === k.id, () => setSkin(k.id), k.prev, k.name, k.photo ? '' : k.emoji))}
              {customSkins.map(k => tile(k.id, skin === k.id, () => setSkin(k.id), `url("${k.img}") center top/cover`, k.name, '', () => { setCustomSkins(a => a.filter(x => x.id !== k.id)); if (skin === k.id) setSkin(''); }))}
            </div>
            <div className="space-y-2.5 pt-1">
              <p className="text-xs font-black uppercase tracking-wider text-slate-400">Thêm ảnh nhân vật của bạn ({customSkins.length}/4)</p>
              <label className={`block w-full text-center px-4 py-3 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 text-sm font-bold cursor-pointer ${busy ? 'opacity-50' : ''}`}>
                {busy ? 'Đang xử lý ảnh...' : '+ Chọn ảnh từ máy / điện thoại'}
                <input type="file" accept="image/*" className="hidden" disabled={busy} onChange={e => { addFile(e.target.files[0]); e.target.value = ''; }} />
              </label>
              <div className="flex gap-2">
                <input value={url} onChange={e => setUrl(e.target.value)} onKeyDown={e => e.key === 'Enter' && addUrl()} placeholder="hoặc dán link / đường dẫn ảnh (vd: img/miku.jpg)" className="flex-1 min-w-0 px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500" />
                <button onClick={addUrl} className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold">Thêm</button>
              </div>
              <p className="text-[11px] text-slate-400 leading-relaxed">Ảnh tải lên được thu nhỏ và lưu ngay trong trình duyệt này. Nếu muốn dùng chung mọi thiết bị, hãy đưa ảnh vào repo GitHub rồi dán đường dẫn tương đối.</p>
            </div>
          </div>
        </div>
      );
    }

    function VoicePicker({ onClose }) {
      const [voices, setVoices] = useState(() => VoiceKit.english());
      const [slot, setSlot] = useState('en-GB');
      const [, force] = useState(0);
      const supported = 'speechSynthesis' in window;
      useEffect(() => {
        if (!supported) return;
        const h = () => setVoices(VoiceKit.english());
        window.speechSynthesis.addEventListener('voiceschanged', h);
        h();
        const t = setTimeout(h, 600);
        return () => { clearTimeout(t); window.speechSynthesis.removeEventListener('voiceschanged', h); window.speechSynthesis.cancel(); };
      }, []);
      const p = VoiceKit.prefs();
      const update = (patch) => { VoiceKit.set(patch); force(n => n + 1); };
      const SAMPLE = "Hello! Nice to meet you. Let's practice English together.";
      const list = VoiceKit.ranked(slot, p.gender);
      const current = VoiceKit.pick(slot);
      const auto = p[slot] === 'auto';
      const flag = (v) => ({ GB: '🇬🇧', US: '🇺🇸', AU: '🇦🇺', IN: '🇮🇳', IE: '🇮🇪', ZA: '🇿🇦', CA: '🇨🇦', NZ: '🇳🇿' }[VoiceKit.region(v).toUpperCase()] || '🌐');
      const niceName = (v) => String(v.name).replace(/^Microsoft\s+/i, '').replace(/\s*-\s*English.*$/i, '').replace(/^Google\s+/i, 'Google ');
      const preview = (v) => VoiceKit.say(SAMPLE, v, slot);
      const choose = (v) => { update({ [slot]: v.name }); preview(v); };
      const seg = (val, cur, label, onClick) => (
        <button key={val} onClick={onClick} className={`flex-1 px-3 py-2 rounded-lg text-xs font-bold ${cur === val ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>{label}</button>
      );
      return (
        <div className="fixed inset-0 z-50 bg-black/25 flex items-end md:items-center justify-center p-3" onClick={onClose}>
          <div className="sk-modal w-full max-w-lg max-h-[88vh] overflow-y-auto rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h3 className="font-black text-lg">🎙️ Giọng đọc</h3>
              <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">Đóng</button>
            </div>

            {!supported ? (
              <p className="text-sm text-slate-500">Trình duyệt này không hỗ trợ giọng đọc. Hãy thử Chrome, Edge hoặc Safari.</p>
            ) : (
              <React.Fragment>
                <div className="space-y-1.5">
                  <p className="text-xs font-black uppercase tracking-wider text-slate-400">Loại giọng</p>
                  <div className="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-xl">
                    {seg('female', p.gender, '♀ Giọng nữ', () => update({ gender: 'female' }))}
                    {seg('any', p.gender, 'Tất cả', () => update({ gender: 'any' }))}
                    {seg('male', p.gender, '♂ Giọng nam', () => update({ gender: 'male' }))}
                  </div>
                </div>

                <div className="space-y-1.5">
                  <p className="text-xs font-black uppercase tracking-wider text-slate-400">Chọn giọng cho nút</p>
                  <div className="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-xl">
                    {seg('en-GB', slot, '🔊 UK (Anh)', () => setSlot('en-GB'))}
                    {seg('en-US', slot, '🔊 US (Mỹ)', () => setSlot('en-US'))}
                  </div>
                </div>

                <div className="space-y-1.5">
                  <button onClick={() => { update({ [slot]: 'auto' }); const b = VoiceKit.best(slot, p.gender); if (b) preview(b); }}
                    className={`w-full text-left px-3.5 py-3 rounded-xl border flex items-center gap-3 ${auto ? 'ring-2 ring-indigo-500 border-transparent' : 'border-slate-200 dark:border-slate-700'}`}>
                    <span className="text-xl">✨</span>
                    <span className="min-w-0 flex-1">
                      <span className="block text-sm font-bold">Tự động (khuyên dùng)</span>
                      <span className="block text-[11px] text-slate-400 truncate">{current ? 'Đang dùng: ' + niceName(current) : 'Chưa có giọng nào'}</span>
                    </span>
                  </button>

                  {list.length === 0 && (
                    <p className="text-xs text-slate-500 leading-relaxed px-1">Chưa tìm thấy giọng tiếng Anh nào trên thiết bị. Nếu vừa mở trang, đợi vài giây rồi mở lại. Trên Windows có thể thêm giọng tại Settings → Time & language → Speech.</p>
                  )}

                  {list.map(v => {
                    const sel = !auto && current && current.name === v.name;
                    const g = VoiceKit.gender(v);
                    return (
                      <button key={v.name + v.lang} onClick={() => choose(v)}
                        className={`w-full text-left px-3.5 py-2.5 rounded-xl border flex items-center gap-3 ${sel ? 'ring-2 ring-indigo-500 border-transparent' : 'border-slate-200 dark:border-slate-700'}`}>
                        <span className="text-lg">{flag(v)}</span>
                        <span className="min-w-0 flex-1">
                          <span className="block text-sm font-bold truncate">{niceName(v)}</span>
                          <span className="block text-[11px] text-slate-400">
                            {g === 'f' ? '♀ Nữ' : g === 'm' ? '♂ Nam' : 'Không rõ giới tính'}
                            {VoiceKit.isGood(v) ? ' · ⭐ Giọng tự nhiên' : ''} · {String(v.lang).replace('_', '-')}
                          </span>
                        </span>
                        <span className="shrink-0 w-8 h-8 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 flex items-center justify-center text-xs">▶</span>
                      </button>
                    );
                  })}
                </div>

                <div className="space-y-1.5 pt-1">
                  <div className="flex items-center justify-between">
                    <p className="text-xs font-black uppercase tracking-wider text-slate-400">Tông giọng</p>
                    <span className="text-xs font-bold text-slate-500">{p.pitch.toFixed(1)}</span>
                  </div>
                  <input type="range" min="0.7" max="1.5" step="0.1" value={p.pitch} onChange={e => update({ pitch: Number(e.target.value) })}
                    onMouseUp={() => preview(current)} onTouchEnd={() => preview(current)} className="w-full accent-indigo-600" />
                  <div className="flex justify-between text-[10px] text-slate-400"><span>Trầm</span><span>Mặc định</span><span>Cao, trong</span></div>
                </div>

                <p className="text-[11px] text-slate-400 leading-relaxed">Danh sách giọng phụ thuộc vào máy bạn đang dùng. Chrome/Edge trên máy tính thường có nhiều giọng nữ tự nhiên nhất (Aria, Jenny, Sonia, Libby…); iPhone/Mac có Samantha, Karen, Moira… Lựa chọn được lưu trên thiết bị này.</p>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function App({ user, userName, onLogout, onLogin }) {
      const [init] = useState(loadData);
      const [decks, setDecks] = useState(init.decks);
      const [cards, setCards] = useState(init.cards);
      const [wrongIds, setWrongIds] = useState(() => {
        try { return JSON.parse(Store.get('myvocab_v3_wrongs')) || []; } catch (e) { return []; }
      });
      const [studyDeckId, setStudyDeckId] = useNavState('study_deckId', null);
      const VALID_TABS = ['study', 'grammar', 'listen', 'summary', 'library', 'import'];
      const [rawTab, setTab] = useNavState('tab', 'study');
      const tab = VALID_TABS.includes(rawTab) ? rawTab : 'study';
      const tabRef = useRef(tab); tabRef.current = tab;
      const cardsRef = useRef(null);
      useState(() => { Stats.load(); return 0; });
      const [libDeck, setLibDeck] = useNavState('libDeck', init.decks[0] ? init.decks[0].id : null);
      const mainRef = useRef(null);
      useEffect(() => {
        const y = Number(Store.get('myvocab_nav_scroll'));
        if (y > 0) {
          const t = setTimeout(() => { if (mainRef.current) mainRef.current.scrollTop = y; }, 80);
          return () => clearTimeout(t);
        }
      }, []);
      const [draft, setDraft] = useState([]);
      const loadUI = () => { try { return JSON.parse(Store.get('myvocab_v4_ui')) || {}; } catch (e) { return {}; } };
      const [themeColor, setThemeColor] = useState(() => loadUI().themeColor || 'indigo');
      const [darkMode, setDarkMode] = useState(() => !!loadUI().darkMode);
      const [skin, setSkin] = useState(() => { const u = loadUI(); return u.skin !== undefined ? u.skin : (u.charMode ? 'char' : ''); });
      const [customSkins, setCustomSkins] = useState(loadCustomSkins);
      const [showSkins, setShowSkins] = useState(false);
      const [showAccount, setShowAccount] = useState(false);
      const [showVoice, setShowVoice] = useState(false);
      const [waterOn, setWaterOn] = useState(() => loadUI().waterOn !== false);
      const [waterAmp, setWaterAmp] = useState(() => { const v = Number(loadUI().waterAmp); return v >= 10 && v <= 100 ? v : 50; });
      const [toast, setToast] = useState(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3500); };

      useEffect(() => {
        try {
          Store.set('myvocab_v4_decks', JSON.stringify(decks));
          Store.set('myvocab_v4_cards', JSON.stringify(cards));
        } catch (e) { showToast('Bộ nhớ trình duyệt đã đầy, hãy xoá bớt thư mục.'); }
      }, [decks, cards]);
      useEffect(() => { try { Store.set('myvocab_v3_wrongs', JSON.stringify(wrongIds)); } catch (e) {} }, [wrongIds]);
      useEffect(() => { try { Store.set('myvocab_v4_skins', JSON.stringify(customSkins)); } catch (e) { showToast('Không đủ bộ nhớ để lưu ảnh nền, hãy xoá bớt ảnh.'); } }, [customSkins]);
      useEffect(() => {
        const root = document.documentElement;
        Array.from(root.classList).filter(c => c.startsWith('sk-')).forEach(c => root.classList.remove(c));
        const cs = customSkins.find(x => x.id === skin);
        const on = !!cs || SKINS.some(x => x.id === skin);
        root.classList.toggle('dark', darkMode && !on);
        root.classList.toggle('char-theme', on);
        document.body.classList.toggle('char-theme', on);
        if (on) root.classList.add(cs ? 'sk-custom' : 'sk-' + skin);
        if (cs) root.style.setProperty('--sk-cimg', 'url("' + cs.img + '")'); else root.style.removeProperty('--sk-cimg');
        try { Store.set('myvocab_v4_ui', JSON.stringify({ themeColor, darkMode, skin, waterOn, waterAmp })); } catch (e) {}
      }, [darkMode, skin, themeColor, customSkins, waterOn, waterAmp]);
      useEffect(() => {
        const cs = customSkins.find(x => x.id === skin);
        const builtin = SKINS.find(x => x.id === skin);
        if (!waterOn || !(cs || builtin)) { WaterBg.stop(); return; }
        let src = null, paint = null;
        if (cs) src = cs.img;
        else if (builtin.photo) src = getComputedStyle(document.documentElement).getPropertyValue('--char-img').trim().replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
        else paint = builtin.id;
        WaterBg.start({ src, paint, amp: waterAmp / 50, onFail: () => showToast('Không bật được sóng nước cho nền này (ảnh link ngoài có thể bị chặn). Hãy tải ảnh lên từ máy.') });
        return () => WaterBg.stop();
      }, [skin, waterOn, customSkins]);
      useEffect(() => { WaterBg.setAmp(waterAmp / 50); }, [waterAmp]);

      cardsRef.current = cards;
      Stats.resolve = (n) => { const c = (cardsRef.current || []).find(x => x.n === n); return c ? c.d : null; };
      // Đếm thời gian học: chỉ tính khi tab đang hiển thị và có thao tác trong 90 giây gần nhất
      useEffect(() => {
        let last = Date.now(), prev = Date.now(), acc = 0;
        const touch = () => { last = Date.now(); };
        const evs = ['pointerdown', 'keydown', 'scroll', 'touchstart', 'mousemove'];
        evs.forEach(e => window.addEventListener(e, touch, { passive: true, capture: true }));
        const flush = () => { acc = 0; Stats.save(); };
        const id = setInterval(() => {
          const now = Date.now(); const dt = Math.min(5, (now - prev) / 1000); prev = now;
          if (document.hidden || now - last > 90000) return;
          const t = tabRef.current;
          if (t === 'study') { let did = null; try { did = JSON.parse(Store.get('myvocab_nav_study_deckId')); } catch (e) {} Stats.addTime(did || null, dt); }
          else if (t === 'grammar' || t === 'listen') Stats.addTime(null, dt);
          acc += dt;
          if (acc >= 15) flush(); else if (t === 'summary') Stats.notify();
        }, 1000);
        const onHide = () => { if (document.hidden) flush(); };
        document.addEventListener('visibilitychange', onHide);
        window.addEventListener('pagehide', flush);
        return () => {
          clearInterval(id);
          evs.forEach(e => window.removeEventListener(e, touch, { capture: true }));
          document.removeEventListener('visibilitychange', onHide);
          window.removeEventListener('pagehide', flush);
          flush();
        };
      }, []);

      const handleMarkWrong = (n, isWrong) => {
        Stats.answer(n, !isWrong);
        setWrongIds(prev => isWrong ? (prev.includes(n) ? prev : [...prev, n]) : prev.filter(id => id !== n));
      };

      const themes = {
        indigo: { bg: 'bg-indigo-600', text: 'text-indigo-600 dark:text-indigo-400', light: 'bg-indigo-50 dark:bg-indigo-950/60' },
        emerald: { bg: 'bg-emerald-600', text: 'text-emerald-600 dark:text-emerald-400', light: 'bg-emerald-50 dark:bg-emerald-950/60' },
        rose: { bg: 'bg-rose-600', text: 'text-rose-600 dark:text-rose-400', light: 'bg-rose-50 dark:bg-rose-950/60' },
        slate: { bg: 'bg-slate-700', text: 'text-slate-700 dark:text-slate-300', light: 'bg-slate-100 dark:bg-slate-800' }
      };
      const activeCustom = customSkins.find(x => x.id === skin);
      const activeBuiltin = SKINS.find(x => x.id === skin);
      const skinOn = !!(activeCustom || activeBuiltin);
      const tColor = skinOn ? themes.indigo : (themes[themeColor] || themes.indigo);

      const NAV = [
        { id: 'study', icon: 'practice', label: 'Học & Luyện tập' },
        { id: 'grammar', icon: 'book', label: 'Ngữ pháp TOEIC', short: 'Ngữ pháp' },
        { id: 'listen', icon: 'volume', label: 'Luyện nghe', short: 'Nghe' },
        { id: 'summary', icon: 'chart', label: 'Tổng kết', short: 'Tổng kết' },
        { id: 'library', icon: 'folder', label: 'Thư viện (Tra cứu)' },
        { id: 'import', icon: 'upload', label: 'Nạp từ vựng' }
      ];

      return (
        <div className="flex h-screen overflow-hidden font-sans">
          <div className="char-bg" />
          {showVoice && <VoicePicker onClose={() => setShowVoice(false)} />}
          {showSkins && <SkinPicker skin={skin} setSkin={setSkin} customSkins={customSkins} setCustomSkins={setCustomSkins} onClose={() => setShowSkins(false)} showToast={showToast} waterOn={waterOn} setWaterOn={setWaterOn} waterAmp={waterAmp} setWaterAmp={setWaterAmp} />}
          {skinOn && <WaterFab waterOn={waterOn} setWaterOn={setWaterOn} waterAmp={waterAmp} setWaterAmp={setWaterAmp} />}
          {showAccount && <AccountPanel user={user} userName={userName} onClose={() => setShowAccount(false)} onLogout={() => { setShowAccount(false); onLogout(); }} onLogin={() => { setShowAccount(false); onLogin(); }} />}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-bold">
              <Icon name="check" className="w-5 h-5" /><span>{toast}</span>
            </div>
          )}

          <aside className="hidden md:flex flex-col w-64 shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-4 justify-between select-none">
            <div className="space-y-6">
              <div className="flex items-center space-x-3 px-2">
                {skinOn ? <div className="char-avatar w-10 h-10 rounded-full flex items-center justify-center text-xl">{activeBuiltin && !activeBuiltin.photo ? activeBuiltin.emoji : null}</div> : <div className={`w-10 h-10 rounded-xl ${tColor.bg} flex items-center justify-center text-white shadow`}><Icon name="cardCircle" className="w-5 h-5" /></div>}
                <div>
                  <h1 className="font-extrabold text-lg tracking-tight leading-tight">MyVocab</h1>
                  <p className="text-[11px] text-slate-400">{userName ? userName + ' · ' : ''}{decks.length} thư mục · {cards.length} từ</p>
                </div>
              </div>
              <nav className="space-y-1.5">
                {NAV.map(n => (
                  <button key={n.id} onClick={() => setTab(n.id)}
                    className={`w-full flex items-center space-x-2.5 px-3.5 py-3 rounded-xl text-sm font-bold transition ${tab === n.id ? `${tColor.light} ${tColor.text}` : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                    <Icon name={n.icon} className="w-4 h-4" /><span>{n.label}</span>
                  </button>
                ))}
              </nav>
            </div>
            <div className="border-t border-slate-100 dark:border-slate-800 pt-3 space-y-3">
              <div className="flex items-center justify-between px-2">
                <span className="text-[11px] text-slate-400">Màu sắc</span>
                <div className="flex space-x-1.5">
                  {Object.keys(themes).map(k => (
                    <button key={k} onClick={() => setThemeColor(k)} className={`w-4 h-4 rounded-full ${themes[k].bg} ${themeColor === k ? 'ring-2 ring-offset-1 ring-slate-400' : 'opacity-60'}`} />
                  ))}
                </div>
              </div>
              <button onClick={() => setShowVoice(true)} className="w-full py-2 rounded-lg border border-slate-200 dark:border-slate-800 text-xs font-semibold flex items-center justify-center space-x-1.5">
                <span>🎙️</span><span>Giọng đọc</span>
              </button>
              <button onClick={() => setShowSkins(true)} className={`w-full py-2 rounded-lg border text-xs font-semibold flex items-center justify-center space-x-1.5 ${skinOn ? 'bg-indigo-600 text-white border-transparent' : 'border-slate-200 dark:border-slate-800'}`}>
                <span>🎨</span><span>{skinOn ? 'Đổi giao diện nền' : 'Giao diện hình nền'}</span>
              </button>
              <button onClick={() => setDarkMode(!darkMode)} className="w-full py-2 rounded-lg border border-slate-200 dark:border-slate-800 text-xs font-semibold flex items-center justify-center space-x-1.5 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                <Icon name={darkMode ? 'sun' : 'moon'} className="w-3.5 h-3.5" /><span>{darkMode ? 'Giao diện Sáng' : 'Giao diện Tối'}</span>
              </button>
              <button onClick={() => setShowAccount(true)} className="w-full py-2 rounded-lg border border-slate-200 dark:border-slate-800 text-xs font-semibold flex items-center justify-center space-x-1.5">
                <span>👤</span><span className="truncate">{user ? (userName || user) + ' · Tài khoản' : 'Đăng nhập / Tạo tài khoản'}</span>
              </button>
            </div>
          </aside>

          <main ref={mainRef} onScroll={e => { try { Store.set('myvocab_nav_scroll', String(e.currentTarget.scrollTop)); } catch (err) {} }} className="flex-1 overflow-y-auto pb-20 md:pb-6">
            <div className={tab === 'study' ? '' : 'hidden'}>
              <StudyWorkspace decks={decks} cards={cards} wrongIds={wrongIds} onMarkWrong={handleMarkWrong} tColor={tColor} goImport={() => setTab('import')} setDecks={setDecks} setCards={setCards} showToast={showToast} studyDeckId={studyDeckId} setStudyDeckId={setStudyDeckId} />
            </div>
            <div className={tab === 'grammar' ? '' : 'hidden'}>
              <GrammarSection tColor={tColor} />
            </div>
            <div className={tab === 'listen' ? '' : 'hidden'}>
              <ListeningSection tColor={tColor} decks={decks} cards={cards} setDecks={setDecks} setCards={setCards} showToast={showToast} />
            </div>
            <div className={tab === 'summary' ? '' : 'hidden'}>
              <SummarySection active={tab === 'summary'} decks={decks} cards={cards} wrongIds={wrongIds} tColor={tColor} userName={userName}
                onGoStudy={(did) => { setStudyDeckId(did); setTab('study'); }}
                onMarkWrong={handleMarkWrong} />
            </div>
            <div className={tab === 'library' ? '' : 'hidden'}>
              <LibrarySection decks={decks} cards={cards} setDecks={setDecks} setCards={setCards} deckId={libDeck} setDeckId={setLibDeck} goImport={() => setTab('import')} tColor={tColor} />
            </div>
            <div className={tab === 'import' ? '' : 'hidden'}>
              <ImportSection decks={decks} cards={cards} setDecks={setDecks} setCards={setCards} draft={draft} setDraft={setDraft} showToast={showToast} tColor={tColor}
                onDone={(id) => { setLibDeck(id); setTab('library'); }} />
            </div>
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 grid grid-cols-10 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-1.5">
            {NAV.map(n => (
              <button key={n.id} onClick={() => setTab(n.id)} className={`flex flex-col items-center gap-0.5 py-1 text-[10px] font-bold ${tab === n.id ? tColor.text : 'text-slate-400'}`}>
                <Icon name={n.icon} className="w-5 h-5" /><span>{n.short || n.label.split(' ')[0]}</span>
              </button>
            ))}
            <button onClick={() => setShowVoice(true)} className="flex flex-col items-center gap-0.5 py-1 text-[10px] font-bold text-slate-400">
              <span className="text-lg leading-5">🎙️</span><span>Giọng</span>
            </button>
            <button onClick={() => setShowSkins(true)} className={`flex flex-col items-center gap-0.5 py-1 text-[10px] font-bold ${skinOn ? tColor.text : 'text-slate-400'}`}>
              <span className="text-lg leading-5">🎨</span><span>Hình nền</span>
            </button>
            <button onClick={() => setDarkMode(!darkMode)} className="flex flex-col items-center gap-0.5 py-1 text-[10px] font-bold text-slate-400">
              <Icon name={darkMode ? 'sun' : 'moon'} className="w-5 h-5" /><span>Giao diện</span>
            </button>
            <button onClick={() => setShowAccount(true)} className={`flex flex-col items-center gap-0.5 py-1 text-[10px] font-bold ${user ? tColor.text : 'text-slate-400'}`}>
              <span className="text-lg leading-5">👤</span><span>{user ? 'Tài khoản' : 'Đăng nhập'}</span>
            </button>
          </nav>
        </div>
      );
    }

    // ==========================================
    // HỌC & LUYỆN TẬP: CHỌN DECK -> LIST -> CHẾ ĐỘ
    // ==========================================
    // ==========================================
    // ==========================================
    // TỔNG KẾT & THỐNG KÊ HỌC TẬP CHUYÊN SÂU
    // ==========================================
    function fmtDur(sec) {
      sec = Math.max(0, Math.floor(sec));
      if (sec < 60) return sec + ' giây';
      const m = Math.floor(sec / 60);
      if (m < 60) {
        const s = sec % 60;
        return m + ' phút' + (s ? ' ' + s + 's' : '');
      }
      const h = Math.floor(m / 60), r = m % 60;
      return h + ' giờ' + (r ? ' ' + r + ' phút' : '');
    }

    const WISHES_GENERAL = [
      'Chúc bạn một buổi học thật hiệu quả và tràn đầy cảm hứng! 🌟',
      'Mỗi ngày thêm vài từ vựng, một năm sau bạn sẽ bất ngờ về sự tiến bộ của chính mình! 💪',
      'Chúc bạn học đâu nhớ đó, phản xạ nhanh và sớm chạm mốc điểm TOEIC mơ ước! 🎯',
      'Sai sót là một phần tự nhiên của học tập – mỗi lần sai là một lần não bộ ghi nhớ sâu hơn! 🌱',
      'Học ít mà đều đặn mỗi ngày tốt hơn rất nhiều so với học dồn một lần. Giữ vững nhịp nhé! 📅',
      'Chúc bạn luôn giữ được ngọn lửa đam mê và sự tập trung cao độ! 🔥',
      'Từ vựng hôm nay chính là nền móng vững chắc cho sự nghiệp và tương lai ngày mai! 🏗️',
      'Tiếng Anh không khó, chìa khóa nằm ở sự kiên trì không bỏ cuộc. Cố lên nhé! 🚀',
      'Chúc bạn một ngày học tập vui vẻ, tiếp thu nhanh và nhớ thật lâu! ☀️',
      'Học 25 phút rồi nghỉ 5 phút thư giãn mắt và uống nước nhé! ☕',
      'Kiên trì là bí quyết lớn nhất – cứ đi từng bước nhỏ, bạn chắc chắn sẽ tới đích! 🗝️',
      '“A little progress each day adds up to big results.” (Tiến bộ nhỏ mỗi ngày tạo nên kết quả lớn!) ✨',
      '“The secret of getting ahead is getting started.” (Bí quyết để dẫn đầu là hãy bắt đầu ngay!) 💡',
      '“Mistakes are proof that you are trying.” (Những lỗi sai chính là minh chứng bạn đang nỗ lực hết mình!) 🌈',
      '“Consistency is the key to mastery.” (Sự kiên trì đều đặn là chìa khóa của sự tinh thông!) 🏆'
    ];

    const WISHES_NEW = [
      'Chào mừng bạn đến với buổi học đầu tiên! Chúc bạn có một khởi đầu thật thuận lợi và hứng khởi! 🌱',
      'Hành trình vạn dặm bắt đầu từ một bước chân. Hãy chọn một Deck và học những từ đầu tiên nào! 🎉'
    ];

    const WISHES_IDLE = [
      'Hôm nay bạn chưa học từ nào – chỉ cần dành ra 5–10 phút để giữ ngọn lửa thói quen thôi nhé! ⏰',
      'Một buổi học ngắn hôm nay sẽ giúp trí nhớ của bạn luôn duy trì phong độ. Bắt đầu nào! 💡'
    ];

    const WISHES_LONG = [
      'Hôm nay bạn đã học rất chăm chỉ (trên 30 phút)! Nhớ cho mắt nghỉ ngơi và uống một ngụm nước nhé! 💧',
      'Tinh thần tự học của bạn thật đáng nể! Xứng đáng nhận điểm 10 cho sự kiên trì hôm nay! 🎁'
    ];

    const WISHES_HIGH = [
      'Độ chính xác của bạn cực kỳ ấn tượng! Trí nhớ đang hoạt động hết công suất đấy, cứ phát huy nhé! 🏆',
      'Tuyệt vời! Bạn đang nắm rất chắc các từ vựng này. Chúc bạn sớm chinh phục trọn vẹn toàn bộ Deck! 🧠✨'
    ];

    const WISHES_LOW = [
      'Đừng nản lòng nhé! Hãy dùng chức năng “Ôn từ sai” để củng cố lại vài lượt là sẽ thuộc ngay thôi! 💪',
      'Càng gặp nhiều từ khó nghĩa là vốn từ của bạn sắp có bước nhảy vọt mới. Chậm mà chắc nhé! 📝'
    ];

    function pickWish(seed, ctx) {
      const sp = [];
      if (ctx.totalSec === 0 && ctx.answers === 0) sp.push(...WISHES_NEW);
      else {
        if (ctx.todaySec === 0) sp.push(...WISHES_IDLE);
        if (ctx.todaySec >= 1800) sp.push(...WISHES_LONG);
        if (ctx.streak >= 3) sp.push('🔥 Bạn đã duy trì chuỗi học ' + ctx.streak + ' ngày liên tiếp – phong độ xuất sắc, hãy tiếp tục giữ vững nhé!');
        if (ctx.answers >= 15) sp.push(...(ctx.acc >= 80 ? WISHES_HIGH : WISHES_LOW));
      }
      const list = sp.length && (seed % 3 !== 0) ? sp : WISHES_GENERAL;
      return list[Math.floor(seed / 3) % list.length];
    }

    function deckNote(t) {
      if (t.total === 0) return 'Deck này hiện chưa có từ vựng nào – bạn có thể nạp thêm từ ở mục Nạp từ vựng.';
      if (t.learned === 0) return 'Bạn chưa bắt đầu Deck này – chọn một chế độ để khởi động bài học đầu tiên nhé! 🌱';
      if (t.known === t.total) return 'Xuất sắc! Bạn đã thuộc toàn bộ từ vựng trong Deck này mà không còn từ nào bị sai! 🎉';
      if (t.wrong > 0 && t.wrong >= t.known) return 'Deck này còn khá nhiều từ làm sai – hãy dùng chế độ “Ôn từ sai” để củng cố nhé! 💪';
      if (t.learned / t.total < 0.5) return 'Đang tiến bộ đều đặn – cố gắng hoàn thành thêm các List tiếp theo nhé! 🚶';
      return 'Sắp về đích rồi – chỉ còn một vài từ nữa là bạn sẽ chinh phục trọn vẹn Deck này! 🏁';
    }

    function SumTile({ label, value, sub, cls, icon }) {
      return (
        <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div className="flex items-center justify-between">
            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">{label}</p>
            {icon && <span className="text-base opacity-80">{icon}</span>}
          </div>
          <div className="my-1.5">
            <p className={`text-2xl font-black leading-tight ${cls || 'text-slate-900 dark:text-white'}`}>{value}</p>
          </div>
          {sub && <p className="text-[11px] text-slate-400 leading-snug">{sub}</p>}
        </div>
      );
    }

    function SummarySection({ active, decks, cards, wrongIds, tColor, userName, onGoStudy, onMarkWrong }) {
      const [, force] = useState(0);
      const [wishSeed, setWishSeed] = useState(() => newSeed());
      const [expandedDeck, setExpandedDeck] = useState(null);
      const [filterWordType, setFilterWordType] = useState('all');

      useEffect(() => {
        const f = () => force(n => n + 1);
        Stats.listeners.add(f);
        return () => { Stats.listeners.delete(f); };
      }, []);

      useEffect(() => { if (active) setWishSeed(newSeed()); }, [active]);
      if (!active) return null;

      const D = Stats.data();
      const todayKey = Stats.dateStr();
      const wset = new Set(wrongIds);
      const totalSec = Object.values(D.days || {}).reduce((a, b) => a + b, 0);
      const todaySec = (D.days && D.days[todayKey]) || 0;

      const week = [];
      for (let i = 6; i >= 0; i--) {
        const dt = new Date();
        dt.setDate(dt.getDate() - i);
        const key = Stats.dateStr(dt);
        week.push({
          key,
          sec: (D.days && D.days[key]) || 0,
          label: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][dt.getDay()],
          isToday: i === 0
        });
      }
      const weekSec = week.reduce((a, w) => a + w.sec, 0);
      const maxSec = Math.max(60, ...week.map(w => w.sec));

      let streak = 0;
      {
        const dt = new Date();
        if (((D.days && D.days[Stats.dateStr(dt)]) || 0) < 60) dt.setDate(dt.getDate() - 1);
        while (((D.days && D.days[Stats.dateStr(dt)]) || 0) >= 60) {
          streak++;
          dt.setDate(dt.getDate() - 1);
        }
      }

      const rows = decks.map(deck => {
        const k = (D.decks && D.decks[deck.id]) || { sec: 0, ok: 0, bad: 0, days: {}, seen: {}, known: {} };
        const dc = cards.filter(c => c.d === deck.id);
        let known = 0, wrong = 0, viewed = 0;
        dc.forEach(c => {
          if (wset.has(c.n)) wrong++;
          else if (k.known && k.known[c.n]) known++;
          else if (k.seen && k.seen[c.n]) viewed++;
        });
        const total = dc.length;
        const learned = known + wrong + viewed;
        return {
          deck,
          k,
          cards: dc,
          total,
          known,
          wrong,
          viewed,
          learned,
          none: Math.max(0, total - learned)
        };
      });

      const sum = (f) => rows.reduce((a, r) => a + f(r), 0);
      const allTotal = sum(r => r.total);
      const allLearned = sum(r => r.learned);
      const allKnown = sum(r => r.known);
      const allWrong = sum(r => r.wrong);
      const allOk = sum(r => r.k.ok);
      const allBad = sum(r => r.k.bad);
      const answers = allOk + allBad;
      const acc = answers ? Math.round((allOk * 100) / answers) : 0;
      const wish = pickWish(wishSeed, { totalSec, todaySec, streak, answers, acc });

      const hr = new Date().getHours();
      let greeting = 'Chào bạn';
      if (hr >= 5 && hr < 11) greeting = '🌅 Chào buổi sáng';
      else if (hr >= 11 && hr < 14) greeting = '☀️ Chào buổi trưa';
      else if (hr >= 14 && hr < 18) greeting = '🌇 Chào buổi chiều';
      else if (hr >= 18 && hr < 22) greeting = '🌙 Chào buổi tối';
      else greeting = '🌌 Cú đêm chăm chỉ';
      const hello = greeting + (userName ? ', ' + userName : '') + '!';
      const otherSec = D.other || 0;

      const doReset = () => {
        if (!confirm('Bạn có chắc chắn muốn xoá toàn bộ số liệu thống kê?\n(Thời gian học và lượt đúng/sai sẽ đặt về 0. Từ vựng và danh sách từ sai của bạn KHÔNG bị ảnh hưởng).')) return;
        Stats.reset();
      };

      return (
        <Shell>
          {/* BANNER LỜI CHÚC & ĐỘNG LỰC HỌC TẬP */}
          <div className={`rounded-3xl ${tColor.bg} text-white p-6 md:p-8 shadow-lg space-y-3 transition-all`}>
            <div className="flex items-center justify-between">
              <span className="text-xs md:text-sm font-bold tracking-wide uppercase opacity-90">{hello}</span>
              <span className="text-xs px-2.5 py-1 rounded-full bg-white/20 font-bold backdrop-blur">
                {streak > 0 ? `🔥 Streak ${streak} ngày` : '🌱 Khởi động hôm nay'}
              </span>
            </div>
            <p className="text-xl md:text-2xl font-black leading-snug tracking-tight">{wish}</p>
            <div className="pt-1 flex flex-wrap items-center gap-2">
              <button
                onClick={() => setWishSeed(newSeed())}
                className="px-4 py-2 rounded-xl bg-white/20 hover:bg-white/30 text-xs font-bold transition flex items-center space-x-1.5 shadow-sm"
              >
                <span>🎲</span>
                <span>Đổi câu chúc khác</span>
              </button>
              <span className="text-[11px] opacity-75">Bấm để nhận thêm danh ngôn và lời chúc tạo động lực</span>
            </div>
          </div>

          {/* CÁC THẺ CHỈ SỐ TỔNG QUAN */}
          <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <SumTile
              icon="⏱️"
              label="Tổng thời gian học"
              value={fmtDur(totalSec)}
              sub={'Tích lũy từ ' + new Date(D.since || Date.now()).toLocaleDateString('vi-VN')}
            />
            <SumTile
              icon="📅"
              label="Thời gian hôm nay"
              value={fmtDur(todaySec)}
              sub={'7 ngày qua: ' + fmtDur(weekSec)}
              cls={tColor.text}
            />
            <SumTile
              icon="🔥"
              label="Chuỗi ngày học"
              value={streak + ' ngày'}
              sub="Mỗi ngày học ≥ 1 phút"
              cls="text-amber-500"
            />
            <SumTile
              icon="📚"
              label="Số từ đã học"
              value={allLearned + ' / ' + allTotal}
              sub={allTotal ? `Đạt ${Math.round((allLearned * 100) / allTotal)}% tổng số từ` : 'Chưa có từ'}
            />
            <SumTile
              icon="✅"
              label="Số từ đã thuộc"
              value={allKnown}
              sub="Làm đúng và không bị sai"
              cls="text-emerald-600"
            />
            <SumTile
              icon="⚠️"
              label="Số từ đang sai"
              value={allWrong}
              sub="Cần ôn lại trong bài tập"
              cls="text-rose-500"
            />
            <SumTile
              icon="🎯"
              label="Tỷ lệ chính xác"
              value={answers ? acc + '%' : '—'}
              sub={`${allOk} đúng · ${allBad} sai (lượt)`}
              cls={acc >= 80 ? 'text-emerald-600' : acc >= 50 ? 'text-amber-500' : 'text-slate-800 dark:text-slate-200'}
            />
            <SumTile
              icon="📝"
              label="Lượt làm bài tập"
              value={answers}
              sub="Quiz, Điền từ, Nghe, Ghép cặp"
            />
          </div>

          {/* BIỂU ĐỒ THỜI GIAN 7 NGÀY GẦN NHẤT */}
          <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <h3 className="font-black text-base flex items-center gap-2">
                <span>📊</span>
                <span>Thời gian học 7 ngày gần nhất</span>
              </h3>
              <span className="text-xs font-bold text-slate-400">Tổng tuần này: {fmtDur(weekSec)}</span>
            </div>
            <div className="flex items-end gap-2 sm:gap-3 h-32 pt-3">
              {week.map(w => (
                <div key={w.key} className="flex-1 flex flex-col items-center justify-end gap-1.5 h-full">
                  <span className="text-[10px] font-bold text-slate-400">
                    {w.sec >= 60 ? Math.round(w.sec / 60) + 'p' : w.sec > 0 ? w.sec + 's' : ''}
                  </span>
                  <div
                    className={`w-full rounded-t-xl transition-all duration-300 ${
                      w.isToday ? tColor.bg : 'bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600'
                    }`}
                    style={{ height: Math.max(w.sec ? 8 : 4, Math.round((w.sec / maxSec) * 75)) + 'px' }}
                    title={`${w.label} (${w.key}): ${fmtDur(w.sec)}`}
                  />
                  <span className={`text-[11px] font-bold ${w.isToday ? tColor.text + ' font-black' : 'text-slate-500'}`}>
                    {w.label}{w.isToday ? ' (Nay)' : ''}
                  </span>
                </div>
              ))}
            </div>
            {otherSec > 0 && (
              <p className="text-xs text-slate-400 pt-1">
                Thời gian học ở phần Ngữ pháp / Luyện nghe (hoặc ngoài Deck): <b>{fmtDur(otherSec)}</b>
              </p>
            )}
          </div>

          {/* TỔNG KẾT TỪNG DECK */}
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2 px-1">
              <div>
                <h3 className="font-black text-lg text-slate-900 dark:text-white flex items-center gap-2">
                  <span>📁</span>
                  <span>Tổng kết theo từng Deck ({decks.length} Deck)</span>
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">Theo dõi chi tiết số từ thuộc, sai và thời gian học của riêng từng thư mục</p>
              </div>
            </div>

            {rows.length === 0 && (
              <div className="p-8 text-center rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-400 text-sm">
                Chưa có Deck nào. Hãy tạo Deck ở mục Học & Luyện tập hoặc Nạp từ vựng.
              </div>
            )}

            {rows.map(r => {
              const pc = (n) => (r.total ? (n * 100) / r.total : 0) + '%';
              const dAns = r.k.ok + r.k.bad;
              const isExpanded = expandedDeck === r.deck.id;

              let filteredWords = r.cards;
              if (filterWordType === 'wrong') filteredWords = r.cards.filter(c => wset.has(c.n));
              else if (filterWordType === 'known') filteredWords = r.cards.filter(c => !wset.has(c.n) && r.k.known && r.k.known[c.n]);
              else if (filterWordType === 'viewed') filteredWords = r.cards.filter(c => !wset.has(c.n) && (!r.k.known || !r.k.known[c.n]) && r.k.seen && r.k.seen[c.n]);
              else if (filterWordType === 'none') filteredWords = r.cards.filter(c => !wset.has(c.n) && (!r.k.known || !r.k.known[c.n]) && (!r.k.seen || !r.k.seen[c.n]));

              return (
                <div
                  key={r.deck.id}
                  className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4"
                >
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5">
