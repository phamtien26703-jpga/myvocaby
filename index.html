                      <div className={`w-10 h-10 rounded-xl ${tColor.light} ${tColor.text} flex items-center justify-center font-black`}>
                        <Icon name="folder" className="w-5 h-5" />
                      </div>
                      <div>
                        <h4 className="font-black text-base text-slate-900 dark:text-white leading-tight">{r.deck.name}</h4>
                        <span className="text-xs text-slate-400 font-bold">{r.total} từ vựng</span>
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      {onGoStudy && (
                        <button
                          onClick={() => onGoStudy(r.deck.id)}
                          className={`px-3.5 py-1.5 rounded-xl ${tColor.bg} text-white text-xs font-bold shadow-sm hover:opacity-95`}
                        >
                          ▶️ Học Deck này
                        </button>
                      )}
                      {onGoStudy && r.wrong > 0 && (
                        <button
                          onClick={() => onGoStudy(r.deck.id, true)}
                          className="px-3.5 py-1.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold hover:bg-rose-100"
                        >
                          ⚠️ Ôn từ sai ({r.wrong})
                        </button>
                      )}
                    </div>
                  </div>

                  {/* THANH TIẾN ĐỘ 4 MÀU */}
                  <div className="space-y-1.5">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-slate-500">Tiến độ đã học: {r.learned} / {r.total} từ ({r.total ? Math.round((r.learned * 100) / r.total) : 0}%)</span>
                      <span className="text-emerald-600">Thuộc: {r.known} từ</span>
                    </div>
                    <div className="flex h-3.5 w-full rounded-full overflow-hidden bg-slate-200 dark:bg-slate-800 shadow-inner">
                      <div className="bg-emerald-500 transition-all duration-500" style={{ width: pc(r.known) }} title={`Đã thuộc: ${r.known} từ`} />
                      <div className="bg-rose-500 transition-all duration-500" style={{ width: pc(r.wrong) }} title={`Đang sai: ${r.wrong} từ`} />
                      <div className="bg-amber-400 transition-all duration-500" style={{ width: pc(r.viewed) }} title={`Đã xem: ${r.viewed} từ`} />
                    </div>
                  </div>

                  {/* 5 Ô THỐNG KÊ CHI TIẾT */}
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center text-xs font-bold">
                    <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 border border-emerald-100 dark:border-emerald-900/40">
                      <div className="text-xl font-black">{r.known}</div>
                      <div>Đã thuộc</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.known * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-500 border border-rose-100 dark:border-rose-900/40">
                      <div className="text-xl font-black">{r.wrong}</div>
                      <div>Đang sai</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.wrong * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 text-amber-600 border border-amber-100 dark:border-amber-900/40">
                      <div className="text-xl font-black">{r.viewed}</div>
                      <div>Đã xem</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.viewed * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200/60 dark:border-slate-700/60">
                      <div className="text-xl font-black">{r.none}</div>
                      <div>Chưa học</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.none * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 border border-indigo-100 dark:border-indigo-900/40 col-span-2 sm:col-span-1">
                      <div className="text-xl font-black">{r.learned}</div>
                      <div>Đã học ({r.total ? Math.round((r.learned * 100) / r.total) : 0}%)</div>
                      <div className="text-[10px] opacity-75 mt-0.5">trên {r.total} từ</div>
                    </div>
                  </div>

                  {/* THỜI GIAN & LƯỢT LÀM BÀI */}
                  <div className="flex flex-wrap gap-x-5 gap-y-1.5 text-xs text-slate-500 dark:text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-800">
                    <span>⏱ Tổng thời gian: <b className="text-slate-800 dark:text-slate-200">{fmtDur(r.k.sec)}</b></span>
                    <span>Hôm nay: <b className="text-slate-800 dark:text-slate-200">{fmtDur((r.k.days && r.k.days[todayKey]) || 0)}</b></span>
                    <span>
                      Lượt đúng: <b className="text-emerald-600">{r.k.ok}</b> · Lượt sai: <b className="text-rose-500">{r.k.bad}</b>
                      {dAns > 0 && <> · Độ chính xác: <b className="text-slate-800 dark:text-slate-200">{Math.round((r.k.ok * 100) / dAns)}%</b></>}
                    </span>
                  </div>

                  {/* NHẬN XÉT CỦA DECK & NÚT XỔ DANH SÁCH TỪ */}
                  <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                    <p className="text-xs font-semibold text-slate-600 dark:text-slate-300">
                      {deckNote(r)}
                    </p>
                    <button
                      onClick={() => {
                        if (isExpanded) setExpandedDeck(null);
                        else {
                          setExpandedDeck(r.deck.id);
                          setFilterWordType(r.wrong > 0 ? 'wrong' : 'all');
                        }
                      }}
                      className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:border-indigo-400 transition"
                    >
                      {isExpanded ? '▴ Thu gọn danh sách từ' : `▾ Xem danh sách từ (${r.total})`}
                    </button>
                  </div>

                  {/* BẢNG MỞ RỘNG DANH SÁCH TỪ CỦA DECK */}
                  {isExpanded && (
                    <div className="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-3">
                      <div className="flex flex-wrap items-center gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
                        {[
                          ['all', `Tất cả (${r.total})`],
                          ['wrong', `Đang sai (${r.wrong})`],
                          ['known', `Đã thuộc (${r.known})`],
                          ['viewed', `Đã xem (${r.viewed})`],
                          ['none', `Chưa học (${r.none})`]
                        ].map(([k, label]) => (
                          <button
                            key={k}
                            onClick={() => setFilterWordType(k)}
                            className={`px-3 py-1.5 rounded-lg transition ${
                              filterWordType === k
                                ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow-sm'
                                : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'
                            }`}
                          >
                            {label}
                          </button>
                        ))}
                      </div>

                      <div className="max-h-80 overflow-y-auto space-y-2 pr-1">
                        {filteredWords.length === 0 ? (
                          <p className="p-4 text-center text-xs text-slate-400">Không có từ nào trong mục này.</p>
                        ) : (
                          filteredWords.map(c => {
                            const isWr = wset.has(c.n);
                            const isKn = !isWr && r.k.known && r.k.known[c.n];
                            return (
                              <div
                                key={c.n}
                                className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-800 flex items-center justify-between gap-2 text-xs"
                              >
                                <div className="min-w-0 flex-1">
                                  <div className="flex items-baseline space-x-2">
                                    <span className="text-[11px] font-mono text-slate-400">#{numOf(c)}</span>
                                    <span className="font-bold text-slate-900 dark:text-white text-sm">{c.w}</span>
                                    {c.p && <span className="text-[11px] text-slate-400">({c.p})</span>}
                                    {c.i && <span className="text-[11px] font-mono text-indigo-500">{c.i}</span>}
                                  </div>
                                  <p className="text-slate-600 dark:text-slate-300 truncate mt-0.5">{c.s || c.v}</p>
                                </div>

                                <div className="flex items-center space-x-1.5 shrink-0">
                                  <button
                                    onClick={() => speak(c.w, 'en-GB')}
                                    className="px-2 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 text-[10px] font-bold"
                                    title="Nghe phát âm UK"
                                  >
                                    UK
                                  </button>
                                  <button
                                    onClick={() => speak(c.w, 'en-US')}
                                    className="px-2 py-1 rounded-lg bg-rose-50 dark:bg-rose-950 text-rose-600 text-[10px] font-bold"
                                    title="Nghe phát âm US"
                                  >
                                    US
                                  </button>

                                  {isWr && (
                                    <span className="px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 text-[10px] font-bold">
                                      Sai
                                    </span>
                                  )}
                                  {isKn && (
                                    <span className="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 text-[10px] font-bold">
                                      Thuộc
                                    </span>
                                  )}

                                  {onMarkWrong && (
                                    <button
                                      onClick={() => onMarkWrong(c.n, !isWr)}
                                      className={`px-2 py-1 rounded-lg text-[10px] font-bold border transition ${
                                        isWr
                                          ? 'border-emerald-300 text-emerald-600 hover:bg-emerald-50'
                                          : 'border-rose-300 text-rose-500 hover:bg-rose-50'
                                      }`}
                                      title={isWr ? 'Đánh dấu đã thuộc từ này' : 'Lưu từ này vào danh sách sai'}
                                    >
                                      {isWr ? '✓ Đã thuộc' : '✕ Lưu sai'}
                                    </button>
                                  )}
                                </div>
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* CHÚ THÍCH & NÚT RESET */}
          <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-200 dark:border-slate-800">
            <p className="text-[11px] text-slate-400 leading-relaxed max-w-xl">
              ⏱ Thời gian học chỉ tính khi bạn đang thao tác thực tế trong tab Học, Ngữ pháp hoặc Luyện nghe (tự động ngắt khi bạn chuyển tab hoặc không thao tác quá 90 giây). Dữ liệu được lưu an toàn trên trình duyệt của bạn.
            </p>
            <button
              onClick={doReset}
              className="px-4 py-2 rounded-xl border border-rose-200 text-rose-500 text-xs font-bold hover:bg-rose-50 dark:hover:bg-rose-950 transition"
            >
              Xoá số liệu thống kê
            </button>
          </div>
        </Shell>
      );
    }

    const MODES = [
      ['flashcard', 'cardCircle', 'Từ vựng:', 'Flashcards', 'Phiên âm UK/US, định nghĩa và nghe từng câu ví dụ'],
      ['quiz', 'pencilCircle', 'Luyện tập:', 'Trắc nghiệm từ vựng', 'Đơn từ (từng câu) hoặc toàn bộ các từ'],
      ['match', 'pencilCircle', 'Luyện tập:', 'Tìm cặp', 'Ghép 6/6 cặp từ, có chức năng đảo từ'],
      ['listen_word', 'pencilCircle', 'Luyện tập:', 'Nghe từ vựng', 'Nghe phát âm và chọn từ chính xác'],
      ['fill', 'pencilCircle', 'Luyện tập:', 'Dịch nghĩa / Điền từ', 'Đơn từ hoặc nhiều từ cùng lúc dạng bảng'],
      ['dictation', 'pencilCircle', 'Luyện tập:', 'Nghe chính tả', 'Nghe phát âm và gõ lại từng ký tự']
    ];

    function StudyWorkspace({ decks, cards, wrongIds, onMarkWrong, tColor, goImport, setDecks, setCards, showToast, studyDeckId, setStudyDeckId }) {
      const [deckId, setDeckId] = (studyDeckId !== undefined && setStudyDeckId) ? [studyDeckId, setStudyDeckId] : useNavState('study_deckId', null);
      const [scope, setScope] = useNavState('study_scope', 'lists');
      const [listId, setListId] = useNavState('study_listId', null);
      const [mode, setMode] = useNavState('study_mode', null);
      const [shuf, setShuf] = useNavState('study_shuffle', false);
      const [shufSeed, setShufSeed] = useNavState('study_shuffle_seed', 1);
      const [wrongSnap, setWrongSnap] = useState(null);
      const [showWrong, setShowWrong] = useState(false);
      const [adding, setAdding] = useState(false);
      const [newName, setNewName] = useState('');

      const deck = decks.find(d => d.id === deckId);
      const deckCards = useMemo(() => cards.filter(c => c.d === deckId), [cards, deckId]);
      const lists = useMemo(() => listMeta(deckCards), [deckCards]);
      const curList = scope === 'lists' ? (lists.find(l => l.id === listId) || lists[0]) : null;
      const scopePool = useMemo(() => {
        const p = scope === 'all' ? deckCards : deckCards.filter(c => curList && c.l === curList.id);
        return [...p].sort((a, b) => numOf(a) - numOf(b));
      }, [deckCards, scope, curList]);
      const wrongInScope = scopePool.filter(c => wrongIds.includes(c.n));
      const onlyWrong = wrongSnap !== null;
      // Trong lúc luyện tập, danh sách từ sai được "chốt" để không bị co lại khi bạn trả lời đúng
      const pool = onlyWrong ? scopePool.filter(c => (mode ? wrongSnap : wrongIds).includes(c.n)) : scopePool;
      const playPool = useMemo(() => shuf ? seededShuffle(pool, shufSeed) : pool, [pool, shuf, shufSeed]);
      const wrongInDeck = deckCards.filter(c => wrongIds.includes(c.n)).length;
      const optionsPool = deckCards.length >= 4 ? deckCards : cards;
      const scopeLabel = scope === 'all' ? 'Toàn bộ deck' : (curList ? `List ${curList.id}` : '');

      const toggleShuf = () => { if (!shuf) setShufSeed(newSeed()); setShuf(!shuf); };
      const reshuffle = () => setShufSeed(newSeed());
      const shufBtns = (
        <>
          <button onClick={toggleShuf} title="Đảo thứ tự câu hỏi ngẫu nhiên" className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition ${shuf ? 'bg-indigo-600 text-white border-indigo-600 shadow' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:border-indigo-400'}`}>
            <Icon name="shuffle" className="w-4 h-4" /><span>Đảo câu: {shuf ? 'Bật' : 'Tắt'}</span>
          </button>
          {shuf && (
            <button onClick={reshuffle} title="Xáo lại thứ tự mới" className="px-3 py-2 rounded-xl text-xs font-bold border border-indigo-200 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 bg-white dark:bg-slate-900 hover:bg-indigo-50 dark:hover:bg-indigo-950">↻ Xáo lại</button>
          )}
        </>
      );
      const toggleWrong = () => { setShowWrong(false); setWrongSnap(onlyWrong ? null : wrongInScope.map(c => c.n)); };
      const startMode = (m) => { if (onlyWrong) setWrongSnap(wrongInScope.map(c => c.n)); setShowWrong(false); setMode(m); };
      const openDeck = (id) => { setDeckId(id); setScope('lists'); setListId(null); setMode(null); setWrongSnap(null); };
      const addDeck = () => {
        const id = uid();
        const name = newName.trim() || ('Deck ' + (decks.length + 1));
        setDecks(ds => [...ds, { id, name }]);
        setAdding(false); setNewName('');
        showToast('Đã tạo Deck "' + name + '". Hãy nạp từ vựng vào Deck này.');
      };
      const removeDeck = (d) => {
        const n = cards.filter(c => c.d === d.id).length;
        if (!confirm(`Xoá Deck "${d.name}" cùng ${n} từ vựng bên trong?`)) return;
        setCards(cs => cs.filter(c => c.d !== d.id));
        setDecks(ds => ds.filter(x => x.id !== d.id));
        if (deckId === d.id) setDeckId(null);
        showToast('Đã xoá Deck "' + d.name + '"');
      };

      // BƯỚC 1: CHỌN / THÊM / XOÁ DECK
      if (!deck) {
        return (
          <Shell>
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 className="text-2xl font-black">Học & Luyện tập</h2>
                <p className="text-sm text-slate-400 mt-1">Bước 1: Chọn một Deck (thư mục) để bắt đầu học</p>
              </div>
              <button onClick={() => setAdding(!adding)} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold flex items-center gap-2 shadow`}>
                <Icon name="plus" className="w-4 h-4" /><span>Thêm Deck</span>
              </button>
            </div>
            {adding && (
              <div className="flex flex-wrap gap-2 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                <input autoFocus value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addDeck()} placeholder={'Tên Deck mới (vd: Deck ' + (decks.length + 1) + ' - TOEIC)'}
                  className="flex-1 min-w-[200px] px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500" />
                <button onClick={addDeck} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold`}>Tạo Deck</button>
                <button onClick={() => setAdding(false)} className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-bold text-slate-500">Huỷ</button>
              </div>
            )}
            {decks.length === 0 && !adding && (
              <div className="p-10 text-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 space-y-3">
                <p className="text-slate-400">Chưa có Deck nào.</p>
                <button onClick={goImport} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold`}>Nạp từ vựng đầu tiên</button>
              </div>
            )}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {decks.map(d => {
                const cs = cards.filter(c => c.d === d.id);
                const wr = cs.filter(c => wrongIds.includes(c.n)).length;
                return (
                  <div key={d.id} onClick={() => openDeck(d.id)} role="button" tabIndex={0} onKeyDown={e => e.key === 'Enter' && openDeck(d.id)}
                    className="relative cursor-pointer text-left p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-400 hover:shadow-md transition space-y-3">
                    <button title="Xoá Deck này" onClick={e => { e.stopPropagation(); removeDeck(d); }} className="absolute top-3 right-3 p-1.5 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950">
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                    <div className="flex items-center gap-3 pr-8">
                      <div className={`w-11 h-11 shrink-0 rounded-xl ${tColor.light} ${tColor.text} flex items-center justify-center`}><Icon name="folder" className="w-6 h-6" /></div>
                      <h3 className="font-black text-base leading-snug">{d.name}</h3>
                    </div>
                    <div className="flex flex-wrap gap-2 text-[11px] font-bold">
                      <span className="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500">{cs.length} từ</span>
                      <span className="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500">{listMeta(cs).length} List</span>
                      {wr > 0 && <span className="px-2 py-1 rounded-lg bg-rose-50 dark:bg-rose-950 text-rose-500">{wr} từ sai</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </Shell>
        );
      }

      // BƯỚC 3: ĐANG LUYỆN TẬP (có nút Ôn từ sai ngay trong bài)
      if (mode) {
        return (
          <Shell>
            <div className="flex flex-wrap justify-between items-center gap-2">
              <button onClick={() => { setMode(null); setShowWrong(false); }} className="px-3.5 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold flex items-center space-x-1.5 shadow-sm">
                <Icon name="arrowLeft" className="w-4 h-4" /><span>Quay lại menu</span>
              </button>
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-bold text-slate-400 hidden sm:inline">{deck.name} › {scopeLabel} ({pool.length} từ)</span>
                {shufBtns}
                <button onClick={toggleWrong} className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition ${onlyWrong ? 'bg-rose-500 text-white border-rose-500 shadow' : 'bg-white dark:bg-slate-900 border-rose-200 text-rose-500 hover:bg-rose-50'}`}>
                  <Icon name="warning" className="w-4 h-4" />
                  <span>{onlyWrong ? `Đang ôn từ sai (${pool.length}) · Bấm để quay lại` : `Ôn từ sai (${wrongInScope.length})`}</span>
                </button>
              </div>
            </div>
            {onlyWrong && (
              <div className="rounded-2xl border border-rose-200 dark:border-rose-900 bg-rose-50/60 dark:bg-rose-950/30 p-3">
                <button onClick={() => setShowWrong(!showWrong)} className="text-xs font-bold text-rose-600">{showWrong ? '▾ Ẩn' : '▸ Xem'} danh sách {pool.length} từ sai (bấm vào từ để nghe)</button>
                {showWrong && (
                  <div className="flex flex-wrap gap-2 mt-2.5">
                    {pool.slice(0, 80).map(c => (
                      <button key={c.n} onClick={() => speak(c.w, 'en-US')} className="px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-rose-100 dark:border-rose-900 text-xs text-left">
                        <b>{c.w}</b> <span className="text-slate-400">· {c.s || c.v}</span>
                      </button>
                    ))}
                    {pool.length > 80 && <span className="text-xs text-slate-400 self-center">... và {pool.length - 80} từ nữa</span>}
                  </div>
                )}
              </div>
            )}
            {(() => {
              const posKey = `${deckId}_${scope}_${curList ? curList.id : 'all'}_${onlyWrong ? 'w' : 'a'}_${shuf ? 's' + shufSeed : 'o'}`;
              return (
                <div key={`${mode}-${posKey}`}>
                  {mode === 'flashcard' && <FlashcardMode pool={playPool} onMarkWrong={onMarkWrong} posKey={posKey} />}
                  {mode === 'quiz' && <QuizUnifiedMode pool={playPool} allCards={optionsPool} onMarkWrong={onMarkWrong} posKey={posKey} />}
                  {mode === 'match' && <MatchMode pool={playPool} onMarkWrong={onMarkWrong} posKey={posKey} />}
                  {mode === 'listen_word' && <ListenWordMode pool={playPool} allCards={optionsPool} onMarkWrong={onMarkWrong} posKey={posKey} />}
                  {mode === 'fill' && <FillMode pool={playPool} onMarkWrong={onMarkWrong} posKey={posKey} />}
                  {mode === 'dictation' && <DictationMode pool={playPool} onMarkWrong={onMarkWrong} posKey={posKey} />}
                </div>
              );
            })()}
          </Shell>
        );
      }

      // BƯỚC 2: CHỌN PHẠM VI (LIST / TOÀN BỘ) + CHẾ ĐỘ
      return (
        <Shell>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2 min-w-0">
              <button onClick={() => setDeckId(null)} className="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0">
                <Icon name="arrowLeft" className="w-4 h-4" /><span>Các Deck</span>
              </button>
              <h2 className="text-xl font-black truncate">{deck.name}</h2>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              {shufBtns}
              <button onClick={toggleWrong} className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition ${onlyWrong ? 'bg-rose-500 text-white border-rose-500 shadow' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'}`}>
                <Icon name="warning" className="w-4 h-4 text-rose-500" /><span>Chỉ ôn từ sai ({wrongInDeck})</span>
              </button>
              <button onClick={() => removeDeck(deck)} title="Xoá Deck này" className="px-3 py-2 rounded-xl border border-rose-200 text-rose-500 text-xs font-bold flex items-center gap-1.5 hover:bg-rose-50 dark:hover:bg-rose-950">
                <Icon name="trash" className="w-4 h-4" /><span className="hidden sm:inline">Xoá Deck</span>
              </button>
            </div>
          </div>

          {deckCards.length === 0 ? (
            <div className="p-10 text-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 space-y-3">
              <p className="text-slate-400">Deck này chưa có từ vựng nào.</p>
              <button onClick={goImport} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold`}>Nạp từ vựng</button>
            </div>
          ) : (<>
            <div className="inline-flex bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
              <button onClick={() => setScope('lists')} className={`px-4 py-2 rounded-lg transition ${scope === 'lists' ? 'bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'text-slate-500'}`}>Theo từng List ({lists.length})</button>
              <button onClick={() => setScope('all')} className={`px-4 py-2 rounded-lg transition ${scope === 'all' ? 'bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'text-slate-500'}`}>Toàn bộ deck ({deckCards.length} từ)</button>
            </div>

            {scope === 'lists' && (
              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2.5">
                {lists.map(l => {
                  const sel = curList && curList.id === l.id;
                  return (
                    <button key={l.id} onClick={() => setListId(l.id)} className={`p-3 rounded-xl border text-left transition ${sel ? `${tColor.bg} text-white border-transparent shadow-md` : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-indigo-400'}`}>
                      <div className="flex justify-between items-center">
                        <span className="font-black text-xs">List {l.id}</span>
                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${sel ? 'bg-white/20' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>{l.count}</span>
                      </div>
                      <p className={`text-[10px] mt-1 truncate ${sel ? 'text-white/80' : 'text-slate-400'}`}>{l.first} → {l.last}</p>
                    </button>
                  );
                })}
              </div>
            )}

            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800 shadow-sm overflow-hidden">
              <div className="p-4 bg-slate-50 dark:bg-slate-800/50">
                <h3 className="font-black text-base">{deck.name} › {scopeLabel}{onlyWrong ? ' › Từ sai' : ''} <span className="text-slate-400 font-bold">({pool.length} từ)</span></h3>
                <p className="text-xs text-slate-400 mt-0.5">Bước 3: Chọn phương thức học tập (trong mỗi bài đều có nút "Ôn từ sai" để học nhanh các từ làm sai)</p>
              </div>
              {MODES.map(m => (
                <PracticeRow key={m[0]} icon={m[1]} prefix={m[2]} title={m[3]} sub={m[4]} onClick={() => startMode(m[0])} disabled={pool.length === 0} />
              ))}
            </div>
          </>)}
        </Shell>
      );
    }

    function PracticeRow({ icon, prefix, title, sub, onClick, disabled }) {
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className="w-full p-4 flex items-center justify-between hover:bg-indigo-50/40 dark:hover:bg-slate-800/60 transition text-left group disabled:opacity-40"
        >
          <div className="flex items-center space-x-3.5">
            <div className="w-9 h-9 rounded-full border border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:border-indigo-500 group-hover:text-indigo-600 transition shrink-0">
              <Icon name={icon} className="w-4 h-4" />
            </div>
            <div>
              <div className="text-base">
                <span className="font-bold text-slate-900 dark:text-white mr-1.5">{prefix}</span>
                <span className="font-semibold text-slate-700 dark:text-slate-200">{title}</span>
              </div>
              {sub && <p className="text-xs text-slate-400 mt-0.5">{sub}</p>}
            </div>
          </div>
          <Icon name="arrowRight" className="w-4 h-4 text-slate-300 group-hover:text-indigo-600 transition shrink-0" />
        </button>
      );
    }

    // ==========================================
    // 1. FLASHCARD MODE (GỌN GÀNG VỪA KHÍT MÀN HÌNH + CÓ NÚT NGHE TỪNG CÂU VÍ DỤ)
    // ==========================================
    function FlashcardMode({ pool, onMarkWrong, posKey = 'default' }) {
      const [rawIdx, setIdx] = useNavState('fc_idx_' + posKey, 0);
      const idx = Math.min(Math.max(0, rawIdx), Math.max(0, pool.length - 1));
      const [flipped, setFlipped] = useState(false);
      const card = pool[idx];
      useEffect(() => { if (card) Stats.seen(card.n); }, [card && card.n]);

      if (!card) return <div className="p-8 text-center text-slate-400">Không có từ vựng nào.</div>;

      const renderHighlightedExample = (str) => {
        const parts = str.split(/(\[[^\]]+\])/g);
        return parts.map((part, index) => {
          if (part.startsWith('[') && part.endsWith(']')) {
            return <strong key={index} className="text-indigo-600 dark:text-indigo-400 underline font-extrabold">{part.slice(1, -1)}</strong>;
          }
          return part;
        });
      };

      return (
        <div className="max-w-2xl mx-auto space-y-3">
          <div className="flex justify-between items-center text-xs font-bold text-slate-400 px-1">
            <span>Thẻ {idx + 1} / {pool.length} (Từ #{card.num ?? card.n} - List {card.l})</span>
            <span>Nhấn vào khung thẻ để lật mặt trước / sau</span>
          </div>

          <div
            onClick={() => setFlipped(!flipped)}
            className="w-full rounded-2xl p-5 md:p-6 border-2 border-slate-200 dark:border-slate-800 shadow-md bg-white dark:bg-slate-900 cursor-pointer transition-all hover:border-indigo-300 dark:hover:border-indigo-800 flex flex-col justify-between"
          >
            {!flipped ? (
              <div className="flex flex-col justify-between min-h-[250px]">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-mono font-bold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                    [#{card.num ?? card.n}] {card.p ? `(${card.p})` : ''}
                  </span>
                  <div className="flex space-x-2" onClick={e => e.stopPropagation()}>
                    <button
                      onClick={() => speak(card.w, "en-GB")}
                      className="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-xs font-bold flex items-center space-x-1 hover:bg-indigo-100"
                    >
                      <Icon name="volume" className="w-3.5 h-3.5" />
                      <span>UK</span>
                    </button>
                    <button
                      onClick={() => speak(card.w, "en-US")}
                      className="px-3 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950 text-rose-600 dark:text-rose-400 text-xs font-bold flex items-center space-x-1 hover:bg-rose-100"
                    >
                      <Icon name="volume" className="w-3.5 h-3.5" />
                      <span>US</span>
                    </button>
                  </div>
                </div>

                <div className="text-center my-auto py-6">
                  <h2 className="text-4xl md:text-5xl font-black text-slate-900 dark:text-white tracking-tight">
                    {card.w} {card.p && <span className="text-xl font-normal text-slate-400">({card.p})</span>}
                  </h2>
                  {card.i && <p className="text-lg font-mono text-indigo-500 font-bold mt-2">{card.i}</p>}
                </div>

                <div className="text-center text-xs font-semibold text-slate-400 flex items-center justify-center space-x-1">
                  <Icon name="rotate" className="w-3.5 h-3.5" />
                  <span>Nhấn vào thẻ để xem Định nghĩa & Ví dụ</span>
                </div>
              </div>
            ) : (
              <div className="space-y-3 text-left">
                <div className="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 dark:border-slate-800 pb-2.5">
                  <div className="flex items-baseline space-x-2">
                    <span className="text-xs font-mono font-bold text-slate-400">[#{card.num ?? card.n}]</span>
                    <h3 className="text-2xl font-black text-slate-900 dark:text-white">{card.w}</h3>
                    {card.p && <span className="text-sm font-mono text-slate-500">({card.p})</span>}
                    {card.i && <span className="text-sm font-mono text-indigo-500 font-bold">{card.i}</span>}
                  </div>
                  <div className="flex space-x-1.5" onClick={e => e.stopPropagation()}>
                    <button onClick={() => speak(card.w, "en-GB")} className="px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 text-xs font-bold hover:bg-indigo-100">🔊 UK</button>
                    <button onClick={() => speak(card.w, "en-US")} className="px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-950 text-rose-600 text-xs font-bold hover:bg-rose-100">🔊 US</button>
                  </div>
                </div>

                <div className="space-y-0.5">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Định nghĩa:</span>
                  <p className="text-lg md:text-xl font-black text-indigo-600 dark:text-indigo-400 leading-snug">{card.v || card.s}</p>
                  {card.e && <p className="text-xs md:text-sm text-slate-500 dark:text-slate-400 italic">={card.e}</p>}
                </div>

                {card.x && card.x.length > 0 && (
                  <div className="space-y-1.5 pt-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Ví dụ (Bấm 🔊 để nghe câu):</span>
                    {card.x.map((ex, i) => {
                      const [enPart, viPart] = ex.split(/\(\=?\s*Dịch:/i);
                      return (
                        <div key={i} className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/70 dark:border-slate-800 text-xs md:text-sm leading-snug flex items-start justify-between gap-2">
                          <div className="flex-1">
                            <p className="text-slate-900 dark:text-slate-100 font-medium">
                              • {renderHighlightedExample(enPart)}
                            </p>
                            {viPart && (
                              <p className="text-slate-500 dark:text-slate-400 mt-0.5 text-xs">
                                (=Dịch: {viPart}
                              </p>
                            )}
                          </div>
                          <div className="flex items-center space-x-1 shrink-0" onClick={e => e.stopPropagation()}>
                            <button
                              onClick={() => speak(enPart, "en-US")}
                              title="Nghe câu ví dụ này"
                              className="px-2 py-1 rounded-lg bg-indigo-100/80 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-200 text-[11px] font-bold flex items-center space-x-1 transition"
                            >
                              <Icon name="volume" className="w-3.5 h-3.5" />
                              <span>Nghe</span>
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="grid grid-cols-4 gap-2.5">
            <button
              disabled={idx === 0}
              onClick={() => { setFlipped(false); setIdx(idx - 1); }}
              className="py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 font-bold text-xs flex items-center justify-center space-x-1 disabled:opacity-30 shadow-sm"
            >
              <Icon name="arrowLeft" className="w-4 h-4" />
              <span>Trước</span>
            </button>

            <button
              onClick={() => {
                onMarkWrong(card.n, true);
                setFlipped(false);
                if (idx < pool.length - 1) setIdx(idx + 1);
              }}
              className="py-2.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 font-bold text-xs hover:bg-rose-100"
            >
              Chưa thuộc (Lưu sai)
            </button>

            <button
              onClick={() => {
                onMarkWrong(card.n, false);
                setFlipped(false);
                if (idx < pool.length - 1) setIdx(idx + 1);
              }}
              className="py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow hover:bg-emerald-700"
            >
              Đã thuộc ✓
            </button>

            <button
              disabled={idx >= pool.length - 1}
              onClick={() => { setFlipped(false); setIdx(idx + 1); }}
              className="py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 font-bold text-xs flex items-center justify-center space-x-1 disabled:opacity-30 shadow-sm"
            >
              <span>Sau</span>
              <Icon name="arrowRight" className="w-4 h-4" />
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. TRẮC NGHIỆM TỪ VỰNG
    // ==========================================
    function QuizUnifiedMode({ pool, allCards, onMarkWrong, posKey = 'default' }) {
      const [isAllMode, setIsAllMode] = useNavState('qz_all_' + posKey, false);

      const [rawIdx, setIdx] = useNavState('qz_idx_' + posKey, 0);
      const idx = Math.min(Math.max(0, rawIdx), Math.max(0, pool.length - 1));
      const [picked, setPicked] = useState(null);
      const card = pool[idx];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const singleOptions = useMemo(() => {
        if (!card) return [];
        const rightMeaning = card.s || card.v;
        const distractors = allCards
          .filter(c => c.n !== card.n && (c.s || c.v) !== rightMeaning)
          .sort(() => 0.5 - Math.random())
          .slice(0, 3);
        return [
          { isRight: true, text: rightMeaning },
          ...distractors.map(d => ({ isRight: false, text: d.s || d.v }))
        ].sort(() => 0.5 - Math.random());
      }, [card, allCards]);

      const allQuestions = useMemo(() => {
        return pool.map(c => {
          const rightMeaning = c.s || c.v;
          const distractors = allCards
            .filter(other => other.n !== c.n && (other.s || other.v) !== rightMeaning)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3);
          const opts = [
            { isRight: true, text: rightMeaning },
            ...distractors.map(d => ({ isRight: false, text: d.s || d.v }))
          ].sort(() => 0.5 - Math.random());
          return { card: c, opts };
        });
      }, [pool, allCards]);

      const handlePickAll = (cardNum, optIdx, isRight) => {
        if (submitted) return;
        setAnswers(prev => ({ ...prev, [cardNum]: optIdx }));
        if (isRight) {
          SoundFx.correct();
          onMarkWrong(cardNum, false);
        } else {
          SoundFx.wrong();
          onMarkWrong(cardNum, true);
        }
      };

      const totalDone = Object.keys(answers).length;
      const totalRight = allQuestions.filter(q => {
        const oIdx = answers[q.card.n];
        return oIdx !== undefined && q.opts[oIdx]?.isRight;
      }).length;

      if (!card) return <div className="p-8 text-center text-slate-400">Không có câu hỏi.</div>;

      return (
        <div className="max-w-4xl mx-auto space-y-4">
          <div className="flex flex-wrap justify-between items-center gap-3 bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <span className="text-sm font-bold text-slate-600 dark:text-slate-300 pl-2">
              Chế độ làm bài trắc nghiệm:
            </span>
            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
              <button
                onClick={() => setIsAllMode(false)}
                className={`px-4 py-2 rounded-lg transition ${
                  !isAllMode ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'
                }`}
              >
                Đơn từ (Từng câu)
              </button>
              <button
                onClick={() => setIsAllMode(true)}
                className={`px-4 py-2 rounded-lg transition ${
                  isAllMode ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'
                }`}
              >
                Toàn bộ các từ ({pool.length} câu)
              </button>
            </div>
          </div>

          {!isAllMode ? (
            <div className="p-8 md:p-10 rounded-3xl bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 space-y-6 shadow-md">
              <div className="flex justify-between items-center text-sm font-bold text-slate-400">
                <span>CÂU {idx + 1} / {pool.length} (Từ #{card.num ?? card.n} - List {card.l})</span>
                <div className="flex space-x-3">
                  <button onClick={() => speak(card.w, "en-GB")} className="px-3.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 font-bold">🔊 UK</button>
                  <button onClick={() => speak(card.w, "en-US")} className="px-3.5 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950 text-rose-600 font-bold">🔊 US</button>
                </div>
              </div>

              <div className="text-center py-2">
                <h3 className="text-5xl md:text-6xl font-black text-slate-900 dark:text-white tracking-tight">
                  {card.w}
                </h3>
                {card.i && <p className="text-xl font-mono text-indigo-500 font-bold mt-2">{card.i}</p>}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {singleOptions.map((opt, i) => {
                  let cls = "border-slate-200 dark:border-slate-800 hover:border-indigo-400 bg-slate-50/50 dark:bg-slate-800/40";
                  if (picked !== null) {
                    if (opt.isRight) cls = "bg-emerald-500 text-white border-emerald-500 font-bold shadow-md";
                    else if (picked === i) cls = "bg-rose-500 text-white border-rose-500 font-bold shadow-md";
                  }
                  return (
                    <button
                      key={i}
                      disabled={picked !== null}
                      onClick={() => {
                        setPicked(i);
                        if (opt.isRight) {
                          SoundFx.correct();
                          onMarkWrong(card.n, false);
                        } else {
                          SoundFx.wrong();
                          onMarkWrong(card.n, true);
                        }
                      }}
                      className={`p-5 md:p-6 rounded-2xl border-2 text-left text-lg md:text-xl font-bold transition leading-snug flex items-start ${cls}`}
                    >
                      <span className="font-mono text-base opacity-75 mr-3 mt-0.5">{String.fromCharCode(65 + i)}.</span>
                      <span className="flex-1">{opt.text}</span>
                    </button>
                  );
                })}
              </div>

              <div className="flex justify-between items-center pt-4 border-t border-slate-100 dark:border-slate-800">
                <button
                  disabled={idx === 0}
                  onClick={() => { setPicked(null); setIdx(idx - 1); }}
                  className="px-6 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-bold flex items-center space-x-1.5 disabled:opacity-30 hover:bg-slate-50"
                >
                  <Icon name="arrowLeft" className="w-4 h-4" />
                  <span>Câu trước</span>
                </button>

                <button
                  disabled={idx >= pool.length - 1}
                  onClick={() => { setPicked(null); setIdx(idx + 1); }}
                  className="px-7 py-3 rounded-xl bg-indigo-600 text-white text-sm font-bold flex items-center space-x-1.5 disabled:opacity-30 shadow hover:bg-indigo-700"
                >
                  <span>Câu tiếp theo</span>
                  <Icon name="arrowRight" className="w-4 h-4" />
                </button>
              </div>
            </div>
          ) : (
            <div className="space-y-5">
              <div className="sticky top-2 z-20 p-4 rounded-2xl bg-white/95 dark:bg-slate-900/95 backdrop-blur border border-slate-200 dark:border-slate-800 shadow-md flex flex-wrap justify-between items-center gap-3">
                <div>
                  <span className="text-xs font-bold text-slate-400">TIẾN ĐỘ LÀM BÀI ({pool.length} CÂU)</span>
                  <p className="text-base font-black text-slate-900 dark:text-white">
                    Đã làm: {totalDone}/{pool.length} | Đúng: <span className="text-emerald-600">{totalRight}</span> | Sai: <span className="text-rose-600">{totalDone - totalRight}</span>
                  </p>
                </div>
                <div className="flex space-x-2">
                  <button
                    onClick={() => { setAnswers({}); setSubmitted(false); }}
                    className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold"
                  >
                    Làm lại từ đầu
                  </button>
                  <button
                    onClick={() => setSubmitted(true)}
                    className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow"
                  >
                    Hiện toàn bộ đáp án
                  </button>
                </div>
              </div>

              <div className="space-y-4">
                {allQuestions.map((q, qIdx) => {
                  const pickedIdx = answers[q.card.n];
                  return (
                    <div key={q.card.n} className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm">
                      <div className="flex justify-between items-center text-xs text-slate-400 font-bold">
                        <span>CÂU {qIdx + 1} [#{numOf(q.card)} - List {q.card.l}]</span>
                        <div className="flex space-x-2">
                          <button onClick={() => speak(q.card.w, "en-GB")} className="text-indigo-600 hover:underline">🔊 UK</button>
                          <button onClick={() => speak(q.card.w, "en-US")} className="text-rose-600 hover:underline">🔊 US</button>
                        </div>
                      </div>

                      <div className="flex items-baseline space-x-3">
                        <h4 className="text-3xl font-black text-slate-900 dark:text-white">{q.card.w}</h4>
                        {q.card.i && <span className="text-base font-mono text-indigo-500 font-bold">{q.card.i}</span>}
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                        {q.opts.map((opt, oIdx) => {
                          const isPicked = pickedIdx === oIdx;
                          let cls = "border-slate-200 dark:border-slate-800 hover:border-indigo-400 bg-slate-50/50 dark:bg-slate-800/40";
                          if (pickedIdx !== undefined || submitted) {
                            if (opt.isRight) cls = "bg-emerald-500 text-white border-emerald-500 font-bold";
                            else if (isPicked) cls = "bg-rose-500 text-white border-rose-500 font-bold";
                          }
                          return (
                            <button
                              key={oIdx}
                              onClick={() => handlePickAll(q.card.n, oIdx, opt.isRight)}
                              className={`p-5 rounded-2xl border-2 text-left text-lg font-bold transition flex items-start ${cls}`}
                            >
                              <span className="font-mono text-sm mr-2.5 mt-1 opacity-75">{String.fromCharCode(65 + oIdx)}.</span>
                              <span className="flex-1">{opt.text}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. TÌM CẶP (6/6 KÈM CHỨC NĂNG ĐẢO TỪ TRONG TOÀN BỘ LIST & TOÀN BỘ TỪ)
    // ==========================================
    function MatchMode({ pool, onMarkWrong, posKey = 'default' }) {
      const [shuffledDeck, setShuffledDeck] = useState(() => [...pool]);
      const [rawBatchIdx, setBatchIdx] = useNavState('mt_batch_' + posKey, 0);
      const [leftId, setLeftId] = useState(null);
      const [matched, setMatched] = useState([]);
      const didMountRef = useRef(false);

      useEffect(() => {
        if (!didMountRef.current) { didMountRef.current = true; return; }
        setShuffledDeck([...pool].sort(() => 0.5 - Math.random()));
        setBatchIdx(0);
        setMatched([]);
        setLeftId(null);
      }, [pool]);

      const totalBatches = Math.max(1, Math.ceil(shuffledDeck.length / 6));
      const batchIdx = Math.min(Math.max(0, rawBatchIdx), totalBatches - 1);
      const currentBatch = useMemo(() => {
        const start = batchIdx * 6;
        return shuffledDeck.slice(start, start + 6);
      }, [shuffledDeck, batchIdx]);

      const rightItems = useMemo(() => {
        return [...currentBatch].sort(() => 0.5 - Math.random());
      }, [currentBatch]);

      const handleShuffleAll = () => {
        const newlyShuffled = [...pool].sort(() => 0.5 - Math.random());
        setShuffledDeck(newlyShuffled);
        setBatchIdx(0);
        setMatched([]);
        setLeftId(null);
      };

      const handleNextBatch = () => {
        const next = (batchIdx + 1) % totalBatches;
        setBatchIdx(next);
        setMatched([]);
        setLeftId(null);
      };

      const handlePrevBatch = () => {
        const prev = (batchIdx - 1 + totalBatches) % totalBatches;
        setBatchIdx(prev);
        setMatched([]);
        setLeftId(null);
      };

      const isBatchComplete = currentBatch.length > 0 && matched.length === currentBatch.length;

      return (
        <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 max-w-3xl mx-auto space-y-5 shadow-sm">
          <div className="flex flex-wrap justify-between items-center gap-3 border-b border-slate-100 dark:border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold text-slate-400 block">
                ĐỢT {batchIdx + 1} / {totalBatches} (Tổng {pool.length} từ trong phạm vi)
              </span>
              <h4 className="text-base font-black text-slate-900 dark:text-white mt-0.5">
                Ghép cặp từ và nghĩa ({matched.length}/{currentBatch.length})
              </h4>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={handleShuffleAll}
                className="px-4 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 text-xs font-bold flex items-center space-x-1.5 transition shadow-sm"
              >
                <Icon name="shuffle" className="w-4 h-4" />
                <span>Đảo từ ngẫu nhiên</span>
              </button>

              <button
                onClick={handlePrevBatch}
                disabled={totalBatches <= 1}
                className="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold disabled:opacity-30 hover:bg-slate-50"
                title="6 cặp trước"
              >
                ←
              </button>
              <button
                onClick={handleNextBatch}
                disabled={totalBatches <= 1}
                className="px-3.5 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs font-bold disabled:opacity-30 hover:opacity-90"
              >
                6 cặp tiếp →
              </button>
            </div>
          </div>

          {isBatchComplete && (
            <div className="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-2 text-emerald-700 dark:text-emerald-300 font-bold text-sm">
                <Icon name="check" className="w-5 h-5" />
                <span>Tuyệt vời! Bạn đã hoàn thành {currentBatch.length}/{currentBatch.length} cặp từ ở đợt này!</span>
              </div>
              <div className="flex space-x-2">
                <button
                  onClick={handleShuffleAll}
                  className="px-4 py-2 rounded-xl bg-white dark:bg-slate-800 text-emerald-700 dark:text-emerald-300 border border-emerald-300 text-xs font-bold"
                >
                  🔀 Đảo 6 cặp ngẫu nhiên
                </button>
                <button
                  onClick={handleNextBatch}
                  className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow"
                >
                  Qua 6 cặp tiếp theo →
                </button>
              </div>
            </div>
          )}

          <div className="grid grid-cols-2 gap-4">
            <div className="space-y-3">
              {currentBatch.map(c => (
                <button
                  key={c.n}
                  disabled={matched.includes(c.n)}
                  onClick={() => {
                    setLeftId(c.n);
                    speak(c.w, "en-US");
                  }}
                  className={`w-full p-4 rounded-2xl border-2 text-base md:text-lg font-bold transition ${
                    matched.includes(c.n)
                      ? 'opacity-25 line-through border-slate-200'
                      : leftId === c.n
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-md'
                      : 'border-slate-200 dark:border-slate-700 hover:border-indigo-400'
                  }`}
                >
                  {c.w}
                </button>
              ))}
            </div>
            <div className="space-y-3">
              {rightItems.map(c => (
                <button
                  key={c.n}
                  disabled={matched.includes(c.n)}
                  onClick={() => {
                    if (!leftId) return;
                    if (leftId === c.n) {
                      SoundFx.correct();
                      if (onMarkWrong) onMarkWrong(c.n, false);
                      setMatched(prev => [...prev, c.n]);
                    } else {
                      SoundFx.wrong();
                      if (onMarkWrong) onMarkWrong(leftId, true);
                    }
                    setLeftId(null);
                  }}
                  className={`w-full p-4 rounded-2xl border-2 text-base md:text-lg font-bold transition ${
                    matched.includes(c.n)
                      ? 'opacity-25 line-through border-slate-200'
                      : 'border-slate-200 dark:border-slate-700 hover:border-indigo-400'
                  }`}
                >
                  {c.s || c.v}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. DỊCH NGHĨA / ĐIỀN TỪ (2 chiều: Nghĩa → Từ  |  Từ → Nghĩa)
    // ==========================================
    const normVi = (s) => String(s || '').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd')
      .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

    // Chấp nhận khi gõ đúng toàn bộ nghĩa, hoặc đúng một trong các nghĩa phân tách bằng , ; / hay phần trong ngoặc
    function meaningOk(card, val) {
      const v = normVi(val);
      if (!v) return false;
      const cands = new Set();
      [card.s, card.v].forEach(src => {
        if (!src) return;
        cands.add(normVi(src));
        cands.add(normVi(String(src).replace(/\([^)]*\)/g, ' ')));
        String(src).replace(/\([^)]*\)/g, ' ').split(/[,;\/]/).forEach(p => cands.add(normVi(p)));
      });
      cands.delete('');
      return cands.has(v);
    }

    function FillMode({ pool, onMarkWrong, posKey = 'default' }) {
      const [isMulti, setIsMulti] = useNavState('fl_multi_' + posKey, true);
      const [rev, setRev] = useNavState('fl_rev_' + posKey, false); // false: cho nghĩa → gõ từ Anh | true: cho từ Anh → gõ nghĩa
      const [rows, setRows] = useState({});
      const [rawSIdx, setSIdx] = useNavState('fl_idx_' + posKey, 0);
      const sIdx = Math.min(Math.max(0, rawSIdx), Math.max(0, pool.length - 1));
      const [sVal, setSVal] = useState('');
      const [sRes, setSRes] = useState(null);

      const curCard = pool[sIdx];
      const meaningOf = (c) => c.s || c.v || '';

      const isRight = (c, val) => rev
        ? meaningOk(c, val)
        : val.trim().toLowerCase() === c.w.trim().toLowerCase();
      const answerOf = (c) => rev ? meaningOf(c) : c.w;

      const changeDir = (v) => {
        if (v === rev) return;
        setRev(v); setRows({}); setSVal(''); setSRes(null);
      };

      const checkRow = (c, val) => {
        if (!val || !val.trim()) return;
        const ok = isRight(c, val);
        if (ok) SoundFx.correct();
        else SoundFx.wrong();
        onMarkWrong(c.n, !ok);
        setRows(prev => ({ ...prev, [c.n]: { val, ok, checked: true } }));
      };

      const checkSingle = () => {
        if (!curCard || !sVal.trim()) return;
        const ok = isRight(curCard, sVal);
        if (ok) SoundFx.correct();
        else SoundFx.wrong();
        onMarkWrong(curCard.n, !ok);
        setSRes({ ok, word: answerOf(curCard) });
      };

      const swapBtn = (extra) => (
        <button type="button" onClick={() => changeDir(!rev)} title="Đảo chiều: từ ⇄ nghĩa"
          className={`shrink-0 w-9 h-9 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:text-indigo-600 hover:border-indigo-400 shadow-sm flex items-center justify-center text-lg font-black leading-none ${extra || ''}`}>⇄</button>
      );
      const segBtn = (active) => `px-4 py-2 rounded-lg transition ${active ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`;

      return (
        <div className="space-y-4 max-w-4xl mx-auto">
          <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
            <div className="flex flex-wrap justify-between items-center gap-2">
              <span className="text-sm font-bold text-slate-600 dark:text-slate-300 pl-2">Chế độ điền từ:</span>
              <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
                <button onClick={() => setIsMulti(false)} className={segBtn(!isMulti)}>Đơn từ (Từng câu)</button>
                <button onClick={() => setIsMulti(true)} className={segBtn(isMulti)}>Nhiều từ cùng lúc (Bảng Excel)</button>
              </div>
            </div>
            {rev && <p className="text-[11px] text-slate-400 pl-2 leading-snug">Gõ nghĩa tiếng Việt của từ. Không phân biệt hoa/thường và có thể gõ không dấu; với từ nhiều nghĩa chỉ cần đúng một nghĩa.</p>}
          </div>

          {isMulti ? (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
              <div className="md:hidden flex items-center justify-between gap-2 px-4 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                <span className="text-xs font-bold text-slate-500">{rev ? 'Từ tiếng Anh → Nghĩa' : 'Nghĩa → Từ tiếng Anh'}</span>
                {swapBtn()}
              </div>
              <div className="overflow-x-auto">
                <table className="block md:table w-full text-left text-base">
                  <thead className="hidden md:table-header-group bg-slate-100 dark:bg-slate-800 text-slate-500 text-xs font-bold border-b border-slate-200 dark:border-slate-800">
                    <tr>
                      <th className="p-4 w-14 text-center">#</th>
                      <th className="p-4 w-2/5 text-center">{rev ? 'Từ tiếng Anh' : 'Nghĩa tiếng Việt'}</th>
                      <th className="p-0 w-12 text-center"><span className="inline-flex">{swapBtn()}</span></th>
                      <th className="p-4 w-2/5 text-center">{rev ? 'Nhập nghĩa tiếng Việt (Nhấn Enter)' : 'Điền từ tiếng Anh (Nhấn Enter)'}</th>
                      <th className="p-4 text-center">Kết quả</th>
                    </tr>
                  </thead>
                  <tbody className="block md:table-row-group divide-y divide-slate-100 dark:divide-slate-800">
                    {pool.map((c, i) => {
                      const r = rows[c.n] || { val: '', checked: false, ok: false };
                      return (
                        <tr key={rev + '-' + c.n} className="vocab-row grid grid-cols-[2.5rem_1fr] items-center gap-x-1 gap-y-2 px-3 py-3 md:table-row md:p-0 hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                          <td className="md:p-4 text-center text-xs font-mono text-slate-400">#{numOf(c)}</td>
                          <td className="md:p-4 font-semibold text-base text-center text-slate-800 dark:text-slate-200">
                            {rev ? (
                              <span className="inline-flex flex-wrap items-baseline justify-center gap-x-2">
                                <button type="button" onClick={() => speak(c.w, 'en-US')} title="Nghe phát âm" className="font-black text-slate-900 dark:text-white text-left hover:underline">{c.w}</button>
                                {c.p && <span className="text-xs font-mono text-slate-400">({c.p})</span>}
                                {c.i && <span className="text-xs font-mono text-slate-400">{c.i}</span>}
                              </span>
                            ) : meaningOf(c)}
                          </td>
                          <td className="hidden md:table-cell md:p-0 text-center text-slate-300 dark:text-slate-600 select-none">⇄</td>
                          <td className="col-span-2 md:col-auto md:p-4">
                            <input
                              id={`row-in-${i}`}
                              type="text"
                              autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck={false} enterKeyHint="next"
                              disabled={r.checked}
                              placeholder={rev ? 'Gõ nghĩa...' : 'Gõ từ...'}
                              value={r.val}
                              onChange={e => setRows(prev => ({ ...prev, [c.n]: { ...r, val: e.target.value } }))}
                              onKeyDown={e => {
                                if (e.key === 'Enter' && !e.nativeEvent.isComposing) {
                                  checkRow(c, r.val);
                                  const nextEl = document.getElementById(`row-in-${i + 1}`);
                                  if (nextEl) nextEl.focus();
                                }
                              }}
                              className={`w-full min-w-0 px-4 py-3 md:py-2.5 rounded-xl border text-base text-center font-bold outline-none ${
                                r.checked
                                  ? r.ok ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-rose-500 bg-rose-50 text-rose-700'
                                  : 'border-slate-200 dark:border-slate-700 bg-transparent focus:border-indigo-500'
                              }`}
                            />
                          </td>
                          <td className="col-span-2 md:col-auto md:p-4 break-words text-center">
                            {r.checked ? (
                              r.ok ? <span className="text-emerald-600 text-base font-bold">✓ Đúng</span> : <span className="text-rose-600 text-base font-bold">✗ Sai ({answerOf(c)})</span>
                            ) : (
                              <button onClick={() => checkRow(c, r.val)} className="px-3.5 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">Check</button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          ) : (
            <div className="p-8 md:p-12 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center space-y-6 max-w-2xl mx-auto shadow-md">
              <span className="text-xs text-slate-400 font-bold">CÂU {sIdx + 1} / {pool.length}</span>
              {rev ? (
                <div className="space-y-2">
                  <h3 className="text-4xl md:text-5xl font-black text-slate-900 dark:text-white">
                    {curCard?.w} {curCard?.p && <span className="text-lg font-normal text-slate-400">({curCard.p})</span>}
                  </h3>
                  {curCard?.i && <p className="text-lg font-mono text-slate-400 font-bold">{curCard.i}</p>}
                  <div className="flex justify-center gap-2 pt-1">
                    <button onClick={() => speak(curCard.w, 'en-GB')} className="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 text-xs font-bold">🔊 UK</button>
                    <button onClick={() => speak(curCard.w, 'en-US')} className="px-3 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950 text-rose-600 text-xs font-bold">🔊 US</button>
                  </div>
                </div>
              ) : (
                <h3 className="text-3xl md:text-4xl font-black text-indigo-600 dark:text-indigo-400">{curCard ? meaningOf(curCard) : ''}</h3>
              )}
              <div className="flex justify-center">{swapBtn()}</div>
              <div className="max-w-md mx-auto space-y-3">
                <input
                  type="text"
                  autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck={false}
                  placeholder={rev ? 'Gõ nghĩa tiếng Việt...' : 'Gõ từ tiếng Anh...'}
                  value={sVal}
                  onChange={e => setSVal(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && !e.nativeEvent.isComposing && checkSingle()}
                  className="w-full px-5 py-4 rounded-2xl border-2 border-slate-300 dark:border-slate-700 bg-transparent text-center font-bold text-xl outline-none focus:border-indigo-500"
                />
                <button onClick={checkSingle} className="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-base shadow">Kiểm tra</button>
              </div>
              {sRes && (
                <div className={`p-4 rounded-2xl max-w-md mx-auto text-base font-bold ${sRes.ok ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                  {sRes.ok ? "Chính xác! 🎉" : `Sai! Đáp án đúng: ${sRes.word}`}
                </div>
              )}
              <div className="flex justify-between max-w-md mx-auto pt-4 border-t border-slate-100 dark:border-slate-800">
                <button disabled={sIdx === 0} onClick={() => { setSIdx(sIdx - 1); setSVal(''); setSRes(null); }} className="px-5 py-2.5 rounded-xl border text-xs font-bold disabled:opacity-30">← Câu trước</button>
                <button disabled={sIdx >= pool.length - 1} onClick={() => { setSIdx(sIdx + 1); setSVal(''); setSRes(null); }} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold disabled:opacity-30">Câu sau →</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. NGHE TỪ VỰNG & NGHE CHÍNH TẢ
    // ==========================================
    function ListenWordMode({ pool, allCards, onMarkWrong, posKey = 'default' }) {
      const [rawIdx, setIdx] = useNavState('lw_idx_' + posKey, 0);
      const idx = Math.min(Math.max(0, rawIdx), Math.max(0, pool.length - 1));
      const [picked, setPicked] = useState(null);
      const card = pool[idx];

      const opts = useMemo(() => {
        if (!card) return [];
        const wrongs = allCards.filter(c => c.n !== card.n).sort(() => 0.5 - Math.random()).slice(0, 3);
        return [card, ...wrongs].sort(() => 0.5 - Math.random());
      }, [card, allCards]);

      if (!card) return null;

      return (
        <div className="p-8 md:p-10 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 max-w-3xl mx-auto text-center space-y-6 shadow-md">
          <button onClick={() => speak(card.w, "en-US")} className="w-20 h-20 rounded-full bg-indigo-600 text-white mx-auto flex items-center justify-center shadow-lg hover:scale-105 transition">
            <Icon name="volume" className="w-10 h-10" />
          </button>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {opts.map((o, i) => {
              let cls = "border-slate-200 dark:border-slate-800";
              if (picked !== null) {
                if (o.n === card.n) cls = "bg-emerald-500 text-white border-emerald-500";
                else if (picked === i) cls = "bg-rose-500 text-white border-rose-500";
              }
              return (
                <button
                  key={i}
                  disabled={picked !== null}
                  onClick={() => {
                    setPicked(i);
                    const ok = o.n === card.n;
                    if (ok) SoundFx.correct(); else SoundFx.wrong();
                    onMarkWrong(card.n, !ok);
                  }}
                  className={`p-5 rounded-2xl border-2 text-lg font-bold ${cls}`}
                >
                  {o.w} — {o.s || o.v}
                </button>
              );
            })}
          </div>
          {picked !== null && (
            <button onClick={() => { setPicked(null); setIdx((idx + 1) % pool.length); }} className="px-6 py-3 rounded-xl bg-indigo-600 text-white text-sm font-bold shadow">Câu tiếp theo →</button>
          )}
        </div>
      );
    }

    function DictationMode({ pool, onMarkWrong, posKey = 'default' }) {
      const [rawIdx, setIdx] = useNavState('dc_idx_' + posKey, 0);
      const idx = Math.min(Math.max(0, rawIdx), Math.max(0, pool.length - 1));
      const [val, setVal] = useState('');
      const card = pool[idx];
      if (!card) return null;

      return (
        <div className="p-8 md:p-10 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 max-w-xl mx-auto text-center space-y-6 shadow-md">
          <button onClick={() => speak(card.w, "en-US")} className="w-20 h-20 rounded-full bg-indigo-600 text-white mx-auto flex items-center justify-center shadow-lg">
            <Icon name="volume" className="w-10 h-10" />
          </button>
          <p className="text-sm text-slate-400 font-semibold">Nghe phát âm và gõ lại từ vựng:</p>
          <input
            type="text"
            placeholder="Nhập từ nghe được..."
            value={val}
            onChange={e => setVal(e.target.value)}
            className="w-full px-5 py-4 rounded-2xl border-2 border-slate-300 dark:border-slate-700 bg-transparent text-center font-bold text-xl outline-none focus:border-indigo-500"
          />
          <button
            onClick={() => {
              const ok = val.trim().toLowerCase() === card.w.trim().toLowerCase();
              if (ok) { SoundFx.correct(); alert("Chính xác!"); setVal(''); setIdx((idx + 1) % pool.length); }
              else { SoundFx.wrong(); alert(`Sai! Đáp án: ${card.w} (${card.s})`); }
              onMarkWrong(card.n, !ok);
            }}
            className="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-base shadow"
          >
            Kiểm tra
          </button>
        </div>
      );
    }

    // ==========================================
    // THƯ VIỆN (TRA CỨU THEO DECK)
    // ==========================================
    function LibrarySection({ decks, cards, setDecks, setCards, deckId, setDeckId, goImport, tColor }) {
      const [lf, setLf] = useNavState('lib_lf', 'all');
      const [q, setQ] = useNavState('lib_q', '');
      const [rev, setRev] = useNavState('lib_rev', false); // false: Anh → Việt, true: Việt → Anh
      const deck = decks.find(d => d.id === deckId) || decks[0];

      if (!deck) {
        return (
          <Shell>
            <h2 className="text-2xl font-black">Thư viện</h2>
            <div className="p-10 text-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 space-y-3">
              <p className="text-slate-400">Chưa có thư mục nào.</p>
              <button onClick={goImport} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold`}>Nạp từ vựng</button>
            </div>
          </Shell>
        );
      }

      const deckCards = cards.filter(c => c.d === deck.id);
      const lists = listMeta(deckCards);
      const ql = q.toLowerCase();
      const filtered = deckCards
        .filter(c => (lf === 'all' || c.l === Number(lf)) && (!ql || c.w.toLowerCase().includes(ql) || (c.s || '').toLowerCase().includes(ql)))
        .sort((a, b) => numOf(a) - numOf(b));

      const rename = () => {
        const name = prompt('Tên mới cho thư mục:', deck.name);
        if (name && name.trim()) setDecks(ds => ds.map(d => d.id === deck.id ? { ...d, name: name.trim() } : d));
      };
      const removeDeck = () => {
        if (!confirm(`Xoá thư mục "${deck.name}" cùng ${deckCards.length} từ vựng bên trong?`)) return;
        setCards(cs => cs.filter(c => c.d !== deck.id));
        setDecks(ds => ds.filter(d => d.id !== deck.id));
        setDeckId((decks.find(d => d.id !== deck.id) || {}).id || null);
      };

      return (
        <div className="p-3 md:p-4 w-full max-w-[950px] space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-2xl font-black">Thư viện từ vựng</h2>
              <p className="text-sm text-slate-400 mt-1">Mỗi thư mục (Deck) chứa các List từ vựng riêng</p>
            </div>
            <button onClick={goImport} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold flex items-center gap-2 shadow`}>
              <Icon name="plus" className="w-4 h-4" /><span>Thêm thư mục mới</span>
            </button>
          </div>

          <div className="grid md:grid-cols-[172px_minmax(0,1fr)] gap-5 items-start">
            <div className="flex md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-1">
              {decks.map(d => {
                const n = cards.filter(c => c.d === d.id).length;
                const sel = d.id === deck.id;
                return (
                  <button key={d.id} onClick={() => { setDeckId(d.id); setLf('all'); setQ(''); }}
                    className={`shrink-0 md:w-full text-left px-2.5 py-2 rounded-xl border flex items-center gap-2 transition ${sel ? `${tColor.light} ${tColor.text} border-transparent` : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-indigo-400'}`}>
                    <Icon name="folder" className="w-4 h-4 shrink-0" />
