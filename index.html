    function pickWish(seed, ctx) {
      const sp = [];
      if (ctx.totalSec === 0 && ctx.answers === 0) sp.push(...WISHES_NEW);
      else {
        if (ctx.todaySec === 0) sp.push(...WISHES_IDLE);
        if (ctx.todaySec >= 1800) sp.push(...WISHES_LONG);
        if (ctx.streak >= 3) sp.push('🔥 Bạn đã duy trì chuỗi học ' + ctx.streak + ' ngày liên tiếp – phong độ xuất sắc, hãy tiếp tục giữ vững nhé!');
        if (ctx.answers >= 15) sp.push(...(ctx.acc >= 80 ? WISHES_HIGH : WISHES_LOW));
      }
      const list = sp.length && (seed % 3 !== 0) ? sp : WISHES_GENERAL;
      return list[Math.floor(seed / 3) % list.length];
    }

    function deckNote(t) {
      if (t.total === 0) return 'Deck này hiện chưa có từ vựng nào – bạn có thể nạp thêm từ ở mục Nạp từ vựng.';
      if (t.learned === 0) return 'Bạn chưa bắt đầu Deck này – chọn một chế độ để khởi động bài học đầu tiên nhé! 🌱';
      if (t.known === t.total) return 'Xuất sắc! Bạn đã thuộc toàn bộ từ vựng trong Deck này mà không còn từ nào bị sai! 🎉';
      if (t.wrong > 0 && t.wrong >= t.known) return 'Deck này còn khá nhiều từ làm sai – hãy dùng chế độ “Ôn từ sai” để củng cố nhé! 💪';
      if (t.learned / t.total < 0.5) return 'Đang tiến bộ đều đặn – cố gắng hoàn thành thêm các List tiếp theo nhé! 🚶';
      return 'Sắp về đích rồi – chỉ còn một vài từ nữa là bạn sẽ chinh phục trọn vẹn Deck này! 🏁';
    }

    function SumTile({ label, value, sub, cls, icon }) {
      return (
        <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div className="flex items-center justify-between">
            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">{label}</p>
            {icon && <span className="text-base opacity-80">{icon}</span>}
          </div>
          <div className="my-1.5">
            <p className={`text-2xl font-black leading-tight ${cls || 'text-slate-900 dark:text-white'}`}>{value}</p>
          </div>
          {sub && <p className="text-[11px] text-slate-400 leading-snug">{sub}</p>}
        </div>
      );
    }

    function SummarySection({ active, decks, cards, wrongIds, tColor, userName, onGoStudy, onMarkWrong }) {
      const [, force] = useState(0);
      const [wishSeed, setWishSeed] = useState(() => newSeed());
      const [expandedDeck, setExpandedDeck] = useState(null);
      const [filterWordType, setFilterWordType] = useState('all');

      useEffect(() => {
        const f = () => force(n => n + 1);
        Stats.listeners.add(f);
        return () => { Stats.listeners.delete(f); };
      }, []);

      useEffect(() => { if (active) setWishSeed(newSeed()); }, [active]);
      if (!active) return null;

      const D = Stats.data();
      const todayKey = Stats.dateStr();
      const wset = new Set(wrongIds);
      const totalSec = Object.values(D.days || {}).reduce((a, b) => a + b, 0);
      const todaySec = (D.days && D.days[todayKey]) || 0;

      const week = [];
      for (let i = 6; i >= 0; i--) {
        const dt = new Date();
        dt.setDate(dt.getDate() - i);
        const key = Stats.dateStr(dt);
        week.push({
          key,
          sec: (D.days && D.days[key]) || 0,
          label: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][dt.getDay()],
          isToday: i === 0
        });
      }
      const weekSec = week.reduce((a, w) => a + w.sec, 0);
      const maxSec = Math.max(60, ...week.map(w => w.sec));

      let streak = 0;
      {
        const dt = new Date();
        if (((D.days && D.days[Stats.dateStr(dt)]) || 0) < 60) dt.setDate(dt.getDate() - 1);
        while (((D.days && D.days[Stats.dateStr(dt)]) || 0) >= 60) {
          streak++;
          dt.setDate(dt.getDate() - 1);
        }
      }

      const rows = decks.map(deck => {
        const k = (D.decks && D.decks[deck.id]) || { sec: 0, ok: 0, bad: 0, days: {}, seen: {}, known: {} };
        const dc = cards.filter(c => c.d === deck.id);
        let known = 0, wrong = 0, viewed = 0;
        dc.forEach(c => {
          if (wset.has(c.n)) wrong++;
          else if (k.known && k.known[c.n]) known++;
          else if (k.seen && k.seen[c.n]) viewed++;
        });
        const total = dc.length;
        const learned = known + wrong + viewed;
        return {
          deck,
          k,
          cards: dc,
          total,
          known,
          wrong,
          viewed,
          learned,
          none: Math.max(0, total - learned)
        };
      });

      const sum = (f) => rows.reduce((a, r) => a + f(r), 0);
      const allTotal = sum(r => r.total);
      const allLearned = sum(r => r.learned);
      const allKnown = sum(r => r.known);
      const allWrong = sum(r => r.wrong);
      const allOk = sum(r => r.k.ok);
      const allBad = sum(r => r.k.bad);
      const answers = allOk + allBad;
      const acc = answers ? Math.round((allOk * 100) / answers) : 0;
      const wish = pickWish(wishSeed, { totalSec, todaySec, streak, answers, acc });

      const hr = new Date().getHours();
      let greeting = 'Chào bạn';
      if (hr >= 5 && hr < 11) greeting = '🌅 Chào buổi sáng';
      else if (hr >= 11 && hr < 14) greeting = '☀️ Chào buổi trưa';
      else if (hr >= 14 && hr < 18) greeting = '🌇 Chào buổi chiều';
      else if (hr >= 18 && hr < 22) greeting = '🌙 Chào buổi tối';
      else greeting = '🌌 Cú đêm chăm chỉ';
      const hello = greeting + (userName ? ', ' + userName : '') + '!';
      const otherSec = D.other || 0;

      const doReset = () => {
        if (!confirm('Bạn có chắc chắn muốn xoá toàn bộ số liệu thống kê?\n(Thời gian học và lượt đúng/sai sẽ đặt về 0. Từ vựng và danh sách từ sai của bạn KHÔNG bị ảnh hưởng).')) return;
        Stats.reset();
      };

      return (
        <Shell>
          {/* BANNER LỜI CHÚC & ĐỘNG LỰC HỌC TẬP */}
          <div className={`rounded-3xl ${tColor.bg} text-white p-6 md:p-8 shadow-lg space-y-3 transition-all`}>
            <div className="flex items-center justify-between">
              <span className="text-xs md:text-sm font-bold tracking-wide uppercase opacity-90">{hello}</span>
              <span className="text-xs px-2.5 py-1 rounded-full bg-white/20 font-bold backdrop-blur">
                {streak > 0 ? `🔥 Streak ${streak} ngày` : '🌱 Khởi động hôm nay'}
              </span>
            </div>
            <p className="text-xl md:text-2xl font-black leading-snug tracking-tight">{wish}</p>
            <div className="pt-1 flex flex-wrap items-center gap-2">
              <button
                onClick={() => setWishSeed(newSeed())}
                className="px-4 py-2 rounded-xl bg-white/20 hover:bg-white/30 text-xs font-bold transition flex items-center space-x-1.5 shadow-sm"
              >
                <span>🎲</span>
                <span>Đổi câu chúc khác</span>
              </button>
              <span className="text-[11px] opacity-75">Bấm để nhận thêm danh ngôn và lời chúc tạo động lực</span>
            </div>
          </div>

          {/* CÁC THẺ CHỈ SỐ TỔNG QUAN */}
          <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <SumTile
              icon="⏱️"
              label="Tổng thời gian học"
              value={fmtDur(totalSec)}
              sub={'Tích lũy từ ' + new Date(D.since || Date.now()).toLocaleDateString('vi-VN')}
            />
            <SumTile
              icon="📅"
              label="Thời gian hôm nay"
              value={fmtDur(todaySec)}
              sub={'7 ngày qua: ' + fmtDur(weekSec)}
              cls={tColor.text}
            />
            <SumTile
              icon="🔥"
              label="Chuỗi ngày học"
              value={streak + ' ngày'}
              sub="Mỗi ngày học ≥ 1 phút"
              cls="text-amber-500"
            />
            <SumTile
              icon="📚"
              label="Số từ đã học"
              value={allLearned + ' / ' + allTotal}
              sub={allTotal ? `Đạt ${Math.round((allLearned * 100) / allTotal)}% tổng số từ` : 'Chưa có từ'}
            />
            <SumTile
              icon="✅"
              label="Số từ đã thuộc"
              value={allKnown}
              sub="Làm đúng và không bị sai"
              cls="text-emerald-600"
            />
            <SumTile
              icon="⚠️"
              label="Số từ đang sai"
              value={allWrong}
              sub="Cần ôn lại trong bài tập"
              cls="text-rose-500"
            />
            <SumTile
              icon="🎯"
              label="Tỷ lệ chính xác"
              value={answers ? acc + '%' : '—'}
              sub={`${allOk} đúng · ${allBad} sai (lượt)`}
              cls={acc >= 80 ? 'text-emerald-600' : acc >= 50 ? 'text-amber-500' : 'text-slate-800 dark:text-slate-200'}
            />
            <SumTile
              icon="📝"
              label="Lượt làm bài tập"
              value={answers}
              sub="Quiz, Điền từ, Nghe, Ghép cặp"
            />
          </div>

          {/* BIỂU ĐỒ THỜI GIAN 7 NGÀY GẦN NHẤT */}
          <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <h3 className="font-black text-base flex items-center gap-2">
                <span>📊</span>
                <span>Thời gian học 7 ngày gần nhất</span>
              </h3>
              <span className="text-xs font-bold text-slate-400">Tổng tuần này: {fmtDur(weekSec)}</span>
            </div>
            <div className="flex items-end gap-2 sm:gap-3 h-32 pt-3">
              {week.map(w => (
                <div key={w.key} className="flex-1 flex flex-col items-center justify-end gap-1.5 h-full">
                  <span className="text-[10px] font-bold text-slate-400">
                    {w.sec >= 60 ? Math.round(w.sec / 60) + 'p' : w.sec > 0 ? w.sec + 's' : ''}
                  </span>
                  <div
                    className={`w-full rounded-t-xl transition-all duration-300 ${
                      w.isToday ? tColor.bg : 'bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600'
                    }`}
                    style={{ height: Math.max(w.sec ? 8 : 4, Math.round((w.sec / maxSec) * 75)) + 'px' }}
                    title={`${w.label} (${w.key}): ${fmtDur(w.sec)}`}
                  />
                  <span className={`text-[11px] font-bold ${w.isToday ? tColor.text + ' font-black' : 'text-slate-500'}`}>
                    {w.label}{w.isToday ? ' (Nay)' : ''}
                  </span>
                </div>
              ))}
            </div>
            {otherSec > 0 && (
              <p className="text-xs text-slate-400 pt-1">
                Thời gian học ở phần Ngữ pháp / Luyện nghe (hoặc ngoài Deck): <b>{fmtDur(otherSec)}</b>
              </p>
            )}
          </div>

          {/* TỔNG KẾT TỪNG DECK */}
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2 px-1">
              <div>
                <h3 className="font-black text-lg text-slate-900 dark:text-white flex items-center gap-2">
                  <span>📁</span>
                  <span>Tổng kết theo từng Deck ({decks.length} Deck)</span>
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">Theo dõi chi tiết số từ thuộc, sai và thời gian học của riêng từng thư mục</p>
              </div>
            </div>

            {rows.length === 0 && (
              <div className="p-8 text-center rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-400 text-sm">
                Chưa có Deck nào. Hãy tạo Deck ở mục Học & Luyện tập hoặc Nạp từ vựng.
              </div>
            )}

            {rows.map(r => {
              const pc = (n) => (r.total ? (n * 100) / r.total : 0) + '%';
              const dAns = r.k.ok + r.k.bad;
              const isExpanded = expandedDeck === r.deck.id;

              let filteredWords = r.cards;
              if (filterWordType === 'wrong') filteredWords = r.cards.filter(c => wset.has(c.n));
              else if (filterWordType === 'known') filteredWords = r.cards.filter(c => !wset.has(c.n) && r.k.known && r.k.known[c.n]);
              else if (filterWordType === 'viewed') filteredWords = r.cards.filter(c => !wset.has(c.n) && (!r.k.known || !r.k.known[c.n]) && r.k.seen && r.k.seen[c.n]);
              else if (filterWordType === 'none') filteredWords = r.cards.filter(c => !wset.has(c.n) && (!r.k.known || !r.k.known[c.n]) && (!r.k.seen || !r.k.seen[c.n]));

              return (
                <div
                  key={r.deck.id}
                  className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4"
                >
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5">
                      <div className={`w-10 h-10 rounded-xl ${tColor.light} ${tColor.text} flex items-center justify-center font-black`}>
                        <Icon name="folder" className="w-5 h-5" />
                      </div>
                      <div>
                        <h4 className="font-black text-base text-slate-900 dark:text-white leading-tight">{r.deck.name}</h4>
                        <span className="text-xs text-slate-400 font-bold">{r.total} từ vựng</span>
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      {onGoStudy && (
                        <button
                          onClick={() => onGoStudy(r.deck.id)}
                          className={`px-3.5 py-1.5 rounded-xl ${tColor.bg} text-white text-xs font-bold shadow-sm hover:opacity-95`}
                        >
                          ▶️ Học Deck này
                        </button>
                      )}
                      {onGoStudy && r.wrong > 0 && (
                        <button
                          onClick={() => onGoStudy(r.deck.id, true)}
                          className="px-3.5 py-1.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold hover:bg-rose-100"
                        >
                          ⚠️ Ôn từ sai ({r.wrong})
                        </button>
                      )}
                    </div>
                  </div>

                  {/* THANH TIẾN ĐỘ 4 MÀU */}
                  <div className="space-y-1.5">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-slate-500">Tiến độ đã học: {r.learned} / {r.total} từ ({r.total ? Math.round((r.learned * 100) / r.total) : 0}%)</span>
                      <span className="text-emerald-600">Thuộc: {r.known} từ</span>
                    </div>
                    <div className="flex h-3.5 w-full rounded-full overflow-hidden bg-slate-200 dark:bg-slate-800 shadow-inner">
                      <div className="bg-emerald-500 transition-all duration-500" style={{ width: pc(r.known) }} title={`Đã thuộc: ${r.known} từ`} />
                      <div className="bg-rose-500 transition-all duration-500" style={{ width: pc(r.wrong) }} title={`Đang sai: ${r.wrong} từ`} />
                      <div className="bg-amber-400 transition-all duration-500" style={{ width: pc(r.viewed) }} title={`Đã xem: ${r.viewed} từ`} />
                    </div>
                  </div>

                  {/* 5 Ô THỐNG KÊ CHI TIẾT */}
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center text-xs font-bold">
                    <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 border border-emerald-100 dark:border-emerald-900/40">
                      <div className="text-xl font-black">{r.known}</div>
                      <div>Đã thuộc</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.known * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-500 border border-rose-100 dark:border-rose-900/40">
                      <div className="text-xl font-black">{r.wrong}</div>
                      <div>Đang sai</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.wrong * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 text-amber-600 border border-amber-100 dark:border-amber-900/40">
                      <div className="text-xl font-black">{r.viewed}</div>
                      <div>Đã xem</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.viewed * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200/60 dark:border-slate-700/60">
                      <div className="text-xl font-black">{r.none}</div>
                      <div>Chưa học</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{r.total ? Math.round((r.none * 100) / r.total) : 0}%</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 border border-indigo-100 dark:border-indigo-900/40 col-span-2 sm:col-span-1">
                      <div className="text-xl font-black">{r.learned}</div>
                      <div>Đã học ({r.total ? Math.round((r.learned * 100) / r.total) : 0}%)</div>
                      <div className="text-[10px] opacity-75 mt-0.5">trên {r.total} từ</div>
                    </div>
                  </div>

                  {/* THỜI GIAN & LƯỢT LÀM BÀI */}
                  <div className="flex flex-wrap gap-x-5 gap-y-1.5 text-xs text-slate-500 dark:text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-800">
                    <span>⏱ Tổng thời gian: <b className="text-slate-800 dark:text-slate-200">{fmtDur(r.k.sec)}</b></span>
                    <span>Hôm nay: <b className="text-slate-800 dark:text-slate-200">{fmtDur((r.k.days && r.k.days[todayKey]) || 0)}</b></span>
                    <span>
                      Lượt đúng: <b className="text-emerald-600">{r.k.ok}</b> · Lượt sai: <b className="text-rose-500">{r.k.bad}</b>
                      {dAns > 0 && <> · Độ chính xác: <b className="text-slate-800 dark:text-slate-200">{Math.round((r.k.ok * 100) / dAns)}%</b></>}
                    </span>
                  </div>

                  {/* NHẬN XÉT CỦA DECK & NÚT XỔ DANH SÁCH TỪ */}
                  <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                    <p className="text-xs font-semibold text-slate-600 dark:text-slate-300">
                      {deckNote(r)}
                    </p>
                    <button
                      onClick={() => {
                        if (isExpanded) setExpandedDeck(null);
                        else {
                          setExpandedDeck(r.deck.id);
                          setFilterWordType(r.wrong > 0 ? 'wrong' : 'all');
                        }
                      }}
                      className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:border-indigo-400 transition"
                    >
                      {isExpanded ? '▴ Thu gọn danh sách từ' : `▾ Xem danh sách từ (${r.total})`}
                    </button>
                  </div>

                  {/* BẢNG MỞ RỘNG DANH SÁCH TỪ CỦA DECK */}
                  {isExpanded && (
                    <div className="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-3">
                      <div className="flex flex-wrap items-center gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
                        {[
                          ['all', `Tất cả (${r.total})`],
                          ['wrong', `Đang sai (${r.wrong})`],
                          ['known', `Đã thuộc (${r.known})`],
                          ['viewed', `Đã xem (${r.viewed})`],
                          ['none', `Chưa học (${r.none})`]
                        ].map(([k, label]) => (
                          <button
                            key={k}
                            onClick={() => setFilterWordType(k)}
                            className={`px-3 py-1.5 rounded-lg transition ${
                              filterWordType === k
                                ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow-sm'
                                : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'
                            }`}
                          >
                            {label}
                          </button>
                        ))}
                      </div>

                      <div className="max-h-80 overflow-y-auto space-y-2 pr-1">
                        {filteredWords.length === 0 ? (
                          <p className="p-4 text-center text-xs text-slate-400">Không có từ nào trong mục này.</p>
                        ) : (
                          filteredWords.map(c => {
                            const isWr = wset.has(c.n);
                            const isKn = !isWr && r.k.known && r.k.known[c.n];
                            return (
                              <div
                                key={c.n}
                                className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-800 flex items-center justify-between gap-2 text-xs"
                              >
                                <div className="min-w-0 flex-1">
                                  <div className="flex items-baseline space-x-2">
                                    <span className="text-[11px] font-mono text-slate-400">#{numOf(c)}</span>
                                    <span className="font-bold text-slate-900 dark:text-white text-sm">{c.w}</span>
                                    {c.p && <span className="text-[11px] text-slate-400">({c.p})</span>}
                                    {c.i && <span className="text-[11px] font-mono text-indigo-500">{c.i}</span>}
                                  </div>
                                  <p className="text-slate-600 dark:text-slate-300 truncate mt-0.5">{c.s || c.v}</p>
                                </div>

                                <div className="flex items-center space-x-1.5 shrink-0">
                                  <button
                                    onClick={() => speak(c.w, 'en-GB')}
                                    className="px-2 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 text-[10px] font-bold"
                                    title="Nghe phát âm UK"
                                  >
                                    UK
                                  </button>
                                  <button
                                    onClick={() => speak(c.w, 'en-US')}
                                    className="px-2 py-1 rounded-lg bg-rose-50 dark:bg-rose-950 text-rose-600 text-[10px] font-bold"
                                    title="Nghe phát âm US"
                                  >
                                    US
                                  </button>

                                  {isWr && (
                                    <span className="px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 text-[10px] font-bold">
                                      Sai
                                    </span>
                                  )}
                                  {isKn && (
                                    <span className="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 text-[10px] font-bold">
                                      Thuộc
                                    </span>
                                  )}

                                  {onMarkWrong && (
                                    <button
                                      onClick={() => onMarkWrong(c.n, !isWr)}
                                      className={`px-2 py-1 rounded-lg text-[10px] font-bold border transition ${
                                        isWr
                                          ? 'border-emerald-300 text-emerald-600 hover:bg-emerald-50'
                                          : 'border-rose-300 text-rose-500 hover:bg-rose-50'
                                      }`}
                                      title={isWr ? 'Đánh dấu đã thuộc từ này' : 'Lưu từ này vào danh sách sai'}
                                    >
                                      {isWr ? '✓ Đã thuộc' : '✕ Lưu sai'}
                                    </button>
                                  )}
                                </div>
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* CHÚ THÍCH & NÚT RESET */}
          <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-200 dark:border-slate-800">
            <p className="text-[11px] text-slate-400 leading-relaxed max-w-xl">
              ⏱ Thời gian học chỉ tính khi bạn đang thao tác thực tế trong tab Học, Ngữ pháp hoặc Luyện nghe (tự động ngắt khi bạn chuyển tab hoặc không thao tác quá 90 giây). Dữ liệu được lưu an toàn trên trình duyệt của bạn.
            </p>
            <button
              onClick={doReset}
              className="px-4 py-2 rounded-xl border border-rose-200 text-rose-500 text-xs font-bold hover:bg-rose-50 dark:hover:bg-rose-950 transition"
            >
              Xoá số liệu thống kê
            </button>
          </div>
        </Shell>
      );
    }

    const MODES = [
      ['flashcard', 'cardCircle', 'Từ vựng:', 'Flashcards', 'Phiên âm UK/US, định nghĩa và nghe từng câu ví dụ'],
      ['quiz', 'pencilCircle', 'Luyện tập:', 'Trắc nghiệm từ vựng', 'Đơn từ (từng câu) hoặc toàn bộ các từ'],
      ['match', 'pencilCircle', 'Luyện tập:', 'Tìm cặp', 'Ghép 6/6 cặp từ, có chức năng đảo từ'],
      ['listen_word', 'pencilCircle', 'Luyện tập:', 'Nghe từ vựng', 'Nghe phát âm và chọn từ chính xác'],
      ['fill', 'pencilCircle', 'Luyện tập:', 'Dịch nghĩa / Điền từ', 'Đơn từ hoặc nhiều từ cùng lúc dạng bảng'],
      ['dictation', 'pencilCircle', 'Luyện tập:', 'Nghe chính tả', 'Nghe phát âm và gõ lại từng ký tự']
    ];

    // ==========================================
    // HỌC & LUYỆN TẬP: CHỌN DECK -> LIST -> CHẾ ĐỘ + MỤC TIÊU HÔM NAY
    // ==========================================
    // ==========================================
    // HỌC & LUYỆN TẬP: CHỌN DECK -> LIST -> CHẾ ĐỘ + MỤC TIÊU HÔM NAY (DROPDOWN KHOA HỌC)
    // ==========================================
    // ==========================================
    // HỌC & LUYỆN TẬP: MỤC TIÊU HỌC TẬP & LỊCH NGÀY THÁNG NĂM
    // ==========================================
    function StudyWorkspace({ decks, cards, wrongIds, onMarkWrong, tColor, goImport, setDecks, setCards, showToast, studyDeckId, setStudyDeckId }) {
      const [deckId, setDeckId] = (studyDeckId !== undefined && setStudyDeckId) ? [studyDeckId, setStudyDeckId] : useNavState('study_deckId', null);
      const [scope, setScope] = useNavState('study_scope', 'lists'); // 'lists' | 'all' | 'custom_goal'
      const [listId, setListId] = useNavState('study_listId', null);
      const [mode, setMode] = useNavState('study_mode', null);
      const [shuf, setShuf] = useNavState('study_shuffle', false);
      const [shufSeed, setShufSeed] = useNavState('study_shuffle_seed', 1);
      const [wrongSnap, setWrongSnap] = useNavState('study_wrongSnap', null);
      const [showWrong, setShowWrong] = useState(false);
      const [adding, setAdding] = useState(false);
      const [newName, setNewName] = useState('');
      // NỘP BÀI: lưu tiến độ từng lượt làm để tải lại trang không bị mất
      const [attempt, setAttempt] = useNavState('study_attempt', 0);

      // --- DỮ LIỆU LỊCH VÀ MỤC TIÊU THEO TỪNG NGÀY ---
      const todayKey = Stats.dateStr(); // YYYY-MM-DD
      const [selectedDateKey, setSelectedDateKey] = useNavState('goal_selected_date', todayKey);
      const [calYear, setCalYear] = useState(() => new Date().getFullYear());
      const [calMonth, setCalMonth] = useState(() => new Date().getMonth()); // 0-indexed

      // Lưu trữ mục tiêu riêng cho từng ngày: { [dateKey]: { deckMode, deckMultiIds, listMode, selectedLists, wordLimit } }
      const [dailyGoals, setDailyGoals] = useNavState('study_daily_goals', {});
      const [customGoalPool, setCustomGoalPool] = useNavState('goal_active_pool', null);

      // Lấy mục tiêu của ngày đang chọn trên lịch
      const currentGoal = dailyGoals[selectedDateKey] || {
        deckMode: 'all',
        deckMultiIds: decks.map(d => d.id),
        listMode: 'all',
        selectedLists: [1],
        wordLimit: 20
      };

      // Cập nhật mục tiêu cho ngày đang chọn
      const updateCurrentGoal = (patch) => {
        setDailyGoals(prev => {
          const existing = prev[selectedDateKey] || {
            deckMode: 'all',
            deckMultiIds: decks.map(d => d.id),
            listMode: 'all',
            selectedLists: [1],
            wordLimit: 20
          };
          return {
            ...prev,
            [selectedDateKey]: { ...existing, ...patch }
          };
        });
      };

      // --- STATE GIỚI HẠN SỐ TỪ KHI HỌC TRỰC TIẾP TRONG DECK ---
      const [listWordLimit, setListWordLimit] = useNavState('study_list_limit', '');
      const [allDeckWordLimit, setAllDeckWordLimit] = useNavState('study_all_deck_limit', '');
      const [showListGridInDeck, setShowListGridInDeck] = useNavState('study_show_list_grid', false);

      const deck = decks.find(d => d.id === deckId);
      const deckCards = useMemo(() => cards.filter(c => c.d === deckId), [cards, deckId]);
      const lists = useMemo(() => listMeta(deckCards), [deckCards]);
      const curList = scope === 'lists' ? (lists.find(l => l.id === listId) || lists[0]) : null;

      // Định dạng hiển thị ngày: DD/MM/YYYY
      const formatDateDisplay = (key) => {
        if (!key) return '';
        const parts = key.split('-');
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : key;
      };

      const getDayOfWeekName = (key) => {
        if (!key) return '';
        const [y, m, d] = key.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        const dayNames = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
        return dayNames[dt.getDay()];
      };

      // Danh sách từ theo phạm vi đã chọn
      const scopePool = useMemo(() => {
        if (scope === 'custom_goal' && customGoalPool && customGoalPool.length) {
          const idSet = new Set(customGoalPool);
          return cards.filter(c => idSet.has(c.n)).sort((a, b) => numOf(a) - numOf(b));
        }
        if (scope === 'all') {
          const sorted = [...deckCards].sort((a, b) => numOf(a) - numOf(b));
          const limit = parseInt(allDeckWordLimit, 10);
          if (limit > 0 && limit < sorted.length) {
            return shuf ? seededShuffle(sorted, shufSeed).slice(0, limit) : sorted.slice(0, limit);
          }
          return sorted;
        }
        const listCards = deckCards.filter(c => curList && c.l === curList.id).sort((a, b) => numOf(a) - numOf(b));
        const limit = parseInt(listWordLimit, 10);
        if (limit > 0 && limit < listCards.length) {
          return shuf ? seededShuffle(listCards, shufSeed).slice(0, limit) : listCards.slice(0, limit);
        }
        return listCards;
      }, [deckCards, cards, scope, curList, customGoalPool, allDeckWordLimit, listWordLimit, shuf, shufSeed]);

      const wrongInScope = scopePool.filter(c => wrongIds.includes(c.n));
      const onlyWrong = wrongSnap !== null;
      const pool = onlyWrong ? scopePool.filter(c => (mode ? wrongSnap : wrongIds).includes(c.n)) : scopePool;
      const playPool = useMemo(() => shuf ? seededShuffle(pool, shufSeed) : pool, [pool, shuf, shufSeed]);
      const wrongInDeck = deckCards.filter(c => wrongIds.includes(c.n)).length;
      const optionsPool = deckCards.length >= 4 ? deckCards : cards;

      const scopeLabel = scope === 'custom_goal'
        ? `Mục tiêu ${selectedDateKey === todayKey ? 'hôm nay' : 'ngày ' + formatDateDisplay(selectedDateKey)} (${pool.length} từ)`
        : (scope === 'all'
            ? `Toàn bộ deck ${allDeckWordLimit ? `(Mục tiêu: ${pool.length}/${deckCards.length} từ)` : `(${pool.length} từ)`}`
            : (curList ? `List ${curList.id} ${listWordLimit ? `(Mục tiêu: ${pool.length}/${curList.count} từ)` : `(${pool.length} từ)`}` : ''));

      const posKey = `${deckId}_${scope}_${curList ? curList.id : 'all'}_${onlyWrong ? 'w' : 'a'}_${shuf ? 's' + shufSeed : 'o'}`;
      const modeKey = `${posKey}_a${attempt}`;
      const sessKey = `${mode}-${posKey}-${attempt}`;
      const [sess, setSess] = useNavState('study_sess_' + sessKey, {});
      const [submitted, setSubmitted] = useNavState('study_sub_' + sessKey, false);

      const trackMark = (n, isWrong) => {
        setSess(s => (mode === 'match' && s[n] === false) ? s : { ...s, [n]: !isWrong });
        onMarkWrong(n, isWrong);
      };
      const doneN = pool.filter(c => sess[c.n] !== undefined).length;
      const okN = pool.filter(c => sess[c.n] === true).length;
      const badN = pool.filter(c => sess[c.n] === false).length;
      const skipN = pool.length - doneN;

      const submitNow = () => {
        if (skipN > 0 && !confirm(`Còn ${skipN} từ chưa làm (sẽ tính là bỏ qua). Bạn vẫn muốn nộp bài?`)) return;
        setSubmitted(true);
        window.scrollTo && window.scrollTo(0, 0);
        const m = document.querySelector('main'); if (m) m.scrollTop = 0;
      };
      const retryAll = () => { setSubmitted(false); setAttempt(a => a + 1); };
      const reviewMissed = () => {
        const nums = pool.filter(c => sess[c.n] !== true).map(c => c.n);
        setWrongSnap(nums);
        setSubmitted(false);
        setAttempt(a => a + 1);
      };

      const toggleShuf = () => { if (!shuf) setShufSeed(newSeed()); setShuf(!shuf); };
      const reshuffle = () => setShufSeed(newSeed());
      const shufBtns = (
        <>
          <button onClick={toggleShuf} title="Đảo thứ tự câu hỏi ngẫu nhiên" className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition ${shuf ? 'bg-indigo-600 text-white border-indigo-600 shadow' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:border-indigo-400'}`}>
            <Icon name="shuffle" className="w-4 h-4" /><span>Đảo câu: {shuf ? 'Bật' : 'Tắt'}</span>
          </button>
          {shuf && (
            <button onClick={reshuffle} title="Xáo lại thứ tự mới" className="px-3 py-2 rounded-xl text-xs font-bold border border-indigo-200 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 bg-white dark:bg-slate-900 hover:bg-indigo-50 dark:hover:bg-indigo-950">↻ Xáo lại</button>
          )}
        </>
      );
      const toggleWrong = () => { setShowWrong(false); setWrongSnap(onlyWrong ? null : wrongInScope.map(c => c.n)); };
      const startMode = (m) => { if (onlyWrong) setWrongSnap(wrongInScope.map(c => c.n)); setShowWrong(false); setMode(m); };
      const openDeck = (id) => { setDeckId(id); setScope('lists'); setListId(null); setMode(null); setWrongSnap(null); setCustomGoalPool(null); };

      const addDeck = () => {
        const id = uid();
        const name = newName.trim() || ('Deck ' + (decks.length + 1));
        setDecks(ds => [...ds, { id, name }]);
        setAdding(false); setNewName('');
        showToast('Đã tạo Deck "' + name + '". Hãy nạp từ vựng vào Deck này.');
      };
      const removeDeck = (d) => {
        const n = cards.filter(c => c.d === d.id).length;
        if (!confirm(`Xoá Deck "${d.name}" cùng ${n} từ vựng bên trong?`)) return;
        setCards(cs => cs.filter(c => c.d !== d.id));
        setDecks(ds => ds.filter(x => x.id !== d.id));
        if (deckId === d.id) setDeckId(null);
        showToast('Đã xoá Deck "' + d.name + '"');
      };

      // Xử lý bắt đầu học theo mục tiêu của ngày đang chọn
      const handleStartTodayGoal = () => {
        let baseCards = [];
        if (currentGoal.deckMode === 'all') {
          baseCards = [...cards];
        } else if (currentGoal.deckMode === 'multi') {
          const setD = new Set(currentGoal.deckMultiIds);
          baseCards = cards.filter(c => setD.has(c.d));
        } else {
          baseCards = cards.filter(c => c.d === currentGoal.deckMode);
        }

        if (!baseCards.length) {
          alert('Không tìm thấy từ vựng nào trong Deck đã chọn!');
          return;
        }

        let filteredPool = [];
        if (currentGoal.listMode === 'all') {
          filteredPool = [...baseCards];
        } else if (currentGoal.listMode === 'multi') {
          if (!currentGoal.selectedLists.length) {
            alert('Vui lòng chọn ít nhất 1 List để học!');
            return;
          }
          const listSet = new Set(currentGoal.selectedLists);
          filteredPool = baseCards.filter(c => listSet.has(c.l));
        } else {
          const lNum = Number(currentGoal.listMode);
          filteredPool = baseCards.filter(c => c.l === lNum);
        }

        if (!filteredPool.length) {
          alert('Không có từ vựng nào trong danh mục đã chọn!');
          return;
        }

        filteredPool.sort((a, b) => numOf(a) - numOf(b));
        const rg = parseWordRange(currentGoal.wordLimit, filteredPool.length);
        if (rg.invalid) {
          alert(`Khoảng số từ "${currentGoal.wordLimit}" vượt quá ${filteredPool.length} từ khả dụng!`);
          return;
        }
        let finalCards;
        if (rg.isRange) {
          const part = filteredPool.slice(rg.from - 1, rg.to);
          finalCards = shuf ? seededShuffle(part, shufSeed) : part;
        } else {
          finalCards = shuf ? seededShuffle(filteredPool, shufSeed).slice(0, rg.count) : filteredPool.slice(0, rg.count);
        }

        // Lưu mục tiêu cho ngày đang chọn (giữ nguyên dạng khoảng nếu có)
        updateCurrentGoal({ wordLimit: rg.isRange ? `${rg.from}-${rg.to}` : rg.count });

        const primaryDeckId = (currentGoal.deckMode !== 'all' && currentGoal.deckMode !== 'multi') ? currentGoal.deckMode : (decks[0]?.id || 'd1');
        setDeckId(primaryDeckId);
        setCustomGoalPool(finalCards.map(c => c.n));
        setScope('custom_goal');
        setMode(null);
        setWrongSnap(null);
        showToast(`Bắt đầu học mục tiêu ${selectedDateKey === todayKey ? 'hôm nay' : 'ngày ' + formatDateDisplay(selectedDateKey)}: ${finalCards.length} từ vựng.`);
      };

      // Sinh ma trận ngày cho lịch (T2 -> CN)
      const calendarDays = useMemo(() => {
        const firstDay = new Date(calYear, calMonth, 1);
        const lastDay = new Date(calYear, calMonth + 1, 0);

        let startDow = firstDay.getDay() - 1;
        if (startDow === -1) startDow = 6; // Chủ nhật thành 6

        const days = [];
        const prevMonthLastDate = new Date(calYear, calMonth, 0).getDate();

        // Ngày tháng trước
        for (let i = startDow - 1; i >= 0; i--) {
          const d = new Date(calYear, calMonth - 1, prevMonthLastDate - i);
          days.push({ key: Stats.dateStr(d), dayNum: d.getDate(), isCurrentMonth: false });
        }
        // Ngày tháng hiện tại
        for (let day = 1; day <= lastDay.getDate(); day++) {
          const d = new Date(calYear, calMonth, day);
          days.push({ key: Stats.dateStr(d), dayNum: day, isCurrentMonth: true });
        }
        // Ngày tháng sau bù đủ lưới
        const remaining = (7 - (days.length % 7)) % 7;
        for (let day = 1; day <= remaining; day++) {
          const d = new Date(calYear, calMonth + 1, day);
          days.push({ key: Stats.dateStr(d), dayNum: day, isCurrentMonth: false });
        }
        return days;
      }, [calYear, calMonth]);

      // BƯỚC 1: CHỌN / THÊM / XOÁ DECK & BẢNG MỤC TIÊU + LỊCH NGÀY THÁNG
      if (!deck) {
        // Dữ liệu từ vựng theo Deck đang chọn ở mục tiêu
        let currentTargetCards = cards;
        if (currentGoal.deckMode !== 'all' && currentGoal.deckMode !== 'multi') {
          currentTargetCards = cards.filter(c => c.d === currentGoal.deckMode);
        } else if (currentGoal.deckMode === 'multi') {
          const setD = new Set(currentGoal.deckMultiIds);
          currentTargetCards = cards.filter(c => setD.has(c.d));
        }
        const currentTargetLists = listMeta(currentTargetCards);

        let availableCount = currentTargetCards.length;
        if (currentGoal.listMode === 'multi') {
          const listSet = new Set(currentGoal.selectedLists);
          availableCount = currentTargetCards.filter(c => listSet.has(c.l)).length;
        } else if (currentGoal.listMode !== 'all') {
          const lNum = Number(currentGoal.listMode);
          availableCount = currentTargetCards.filter(c => c.l === lNum).length;
        }

        const isToday = selectedDateKey === todayKey;
        const statsData = Stats.data();
        const selectedDateStudySec = (statsData.days && statsData.days[selectedDateKey]) || 0;

                return (
          <Shell className="max-w-[1380px]">
            {/* HÀNG TRÊN CÙNG: 2 Ô ĐỘC LẬP SÓNG ĐÔI (BÊN TRÁI MỤC TIÊU - BÊN PHẢI LỊCH) */}
            <div className="flex flex-col lg:flex-row gap-4 items-start">

              {/* Ô 1 (BÊN TRÁI - 7 CỘT): MỤC TIÊU HỌC TẬP RIÊNG BIỆT */}
              <div className="w-full lg:flex-1 lg:min-w-0 lg:[zoom:0.8] p-5 md:p-6 rounded-3xl bg-white dark:bg-slate-900 border-2 border-indigo-500/30 dark:border-indigo-500/40 shadow-xl flex flex-col gap-2">
                <div className="space-y-4">
                  {/* Tiêu đề & Nút bắt đầu học */}
                  <div className="flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-800 pb-3.5">
                    <div className="flex items-center space-x-3 min-w-0">
                      <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-rose-500 to-indigo-600 text-white flex items-center justify-center text-2xl shadow-lg shrink-0">🎯</div>
                      <div className="min-w-0">
                        <div className="flex items-center space-x-2">
                          <h3 className="text-2xl md:text-3xl font-black text-slate-900 dark:text-white leading-tight truncate">
                            {isToday ? 'Mục tiêu hôm nay' : `Mục tiêu ngày ${formatDateDisplay(selectedDateKey)}`}
                          </h3>
                          {isToday ? (
                            <span className="px-2.5 py-0.5 rounded-full text-[13px] font-black bg-rose-100 dark:bg-rose-950 text-rose-600 shrink-0">Hôm nay</span>
                          ) : (
                            <span className="px-2.5 py-0.5 rounded-full text-[13px] font-black bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 shrink-0">
                              {getDayOfWeekName(selectedDateKey)}
                            </span>
                          )}
                        </div>
                        <p className="text-base text-slate-500 dark:text-slate-400 mt-0.5 truncate">
                          {isToday ? 'Đặt mục tiêu học tập thông minh: chọn Deck, List và giới hạn số từ cần học' : `Kế hoạch học tập ngày ${formatDateDisplay(selectedDateKey)}`}
                        </p>
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={handleStartTodayGoal}
                      className="px-6 py-3 rounded-xl bg-gradient-to-r from-rose-500 via-pink-600 to-indigo-600 hover:opacity-95 text-white text-base font-black shadow-lg shadow-rose-500/25 transition flex items-center space-x-1.5 shrink-0"
                    >
                      <span>{isToday ? 'Bắt đầu học mục tiêu' : 'Học mục tiêu ngày này'}</span>
                      <Icon name="arrowRight" className="w-4 h-4" />
                    </button>
                  </div>

                  {/* 3 Ô ĐIỀU KHIỂN: THẲNG HÀNG TUYỆT ĐỐI KHÔNG BỊ GÃY DÒNG */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5 pt-1">
                    {/* 1. Chọn Deck */}
                    <div className="space-y-1.5">
                      <div className="flex justify-between items-center h-6">
                        <label className="text-[14px] font-black uppercase text-slate-400 tracking-wider whitespace-nowrap truncate">
                          1. Deck muốn học
                        </label>
                        <span className="text-[14px] font-bold text-indigo-600 dark:text-indigo-400 whitespace-nowrap truncate max-w-[160px]">
                          {currentGoal.deckMode === 'all' ? `Tất cả (${cards.length} từ)` : (currentGoal.deckMode === 'multi' ? `${currentGoal.deckMultiIds.length} Deck` : `${currentTargetCards.length} từ`)}
                        </span>
                      </div>
                      <select
                        value={currentGoal.deckMode}
                        onChange={e => {
                          updateCurrentGoal({ deckMode: e.target.value, listMode: 'all' });
                        }}
                        className="w-full h-[52px] px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-lg font-bold outline-none focus:border-indigo-500 shadow-sm cursor-pointer truncate"
                      >
                        <option value="all">Tất cả Deck ({cards.length} từ)</option>
                        {decks.map(d => {
                          const cnt = cards.filter(c => c.d === d.id).length;
                          return <option key={d.id} value={d.id}>{d.name} ({cnt} từ)</option>;
                        })}
                        {decks.length > 1 && (
                          <option value="multi">⚡ Chọn nhiều Deck...</option>
                        )}
                      </select>
                    </div>

                    {/* 2. Chọn List */}
                    <div className="space-y-1.5">
                      <div className="flex justify-between items-center h-6">
                        <label className="text-[14px] font-black uppercase text-slate-400 tracking-wider whitespace-nowrap truncate">
                          2. List muốn học
                        </label>
                        <span className="text-[14px] font-bold text-indigo-600 dark:text-indigo-400 whitespace-nowrap truncate max-w-[160px]">
                          {availableCount} từ khả dụng
                        </span>
                      </div>
                      <select
                        value={currentGoal.listMode}
                        onChange={e => updateCurrentGoal({ listMode: e.target.value })}
                        className="w-full h-[52px] px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-lg font-bold outline-none focus:border-indigo-500 shadow-sm cursor-pointer truncate"
                      >
                        <option value="all">Tất cả List ({currentTargetCards.length} từ)</option>
                        {currentTargetLists.map(l => (
                          <option key={l.id} value={l.id}>
                            List {l.id} ({l.count} từ: {l.first} → {l.last})
                          </option>
                        ))}
                        {currentTargetLists.length > 1 && (
                          <option value="multi">⚡ Chọn nhiều List...</option>
                        )}
                      </select>
                    </div>

                    {/* 3. Số lượng từ */}
                    <div className="space-y-1.5">
                      <div className="flex justify-between items-center h-6">
                        <label className="text-[14px] font-black uppercase text-slate-400 tracking-wider whitespace-nowrap truncate">
                          3. Số lượng từ
                        </label>
                        <span className="text-[14px] font-black text-rose-500 whitespace-nowrap">
                          {(() => { const r = parseWordRange(currentGoal.wordLimit, availableCount); return r.invalid ? `Quá ${availableCount} từ` : `${r.count}/${availableCount} từ`; })()}
                        </span>
                      </div>
                      <input
                        type="text"
                        inputMode="text"
                        autoComplete="off"
                        placeholder="VD: 50 hoặc 10-50"
                        title="Nhập 50 = 50 từ đầu; 10-50 = từ thứ 10 đến từ thứ 50"
                        value={currentGoal.wordLimit}
                        onChange={e => updateCurrentGoal({ wordLimit: e.target.value.replace(/[^0-9\s\-–—~:]/g, '') })}
                        className="w-full h-[52px] px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-lg font-bold outline-none focus:border-indigo-500 text-slate-900 dark:text-white shadow-sm"
                      />
                    </div>
                  </div>

                  {/* Khi chọn nhiều Deck */}
                  {currentGoal.deckMode === 'multi' && (
                    <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">
                      <div className="flex justify-between items-center text-xs font-bold text-slate-500">
                        <span>Chọn các Deck muốn học gộp:</span>
                        <button type="button" onClick={() => updateCurrentGoal({ deckMultiIds: decks.map(d => d.id) })} className="text-indigo-600 hover:underline">Chọn tất cả</button>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {decks.map(d => {
                          const isSel = currentGoal.deckMultiIds.includes(d.id);
                          const cnt = cards.filter(c => c.d === d.id).length;
                          return (
                            <button
                              key={d.id}
                              type="button"
                              onClick={() => {
                                const prev = currentGoal.deckMultiIds;
                                const next = isSel ? (prev.length > 1 ? prev.filter(x => x !== d.id) : prev) : [...prev, d.id];
                                updateCurrentGoal({ deckMultiIds: next });
                              }}
                              className={`px-2.5 py-1 rounded-xl text-xs font-bold border transition flex items-center space-x-1 ${
                                isSel ? 'bg-indigo-600 text-white border-transparent shadow' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                              }`}
                            >
                              <span>{isSel ? '✓' : '+'}</span>
                              <span className="truncate max-w-[120px]">{d.name}</span>
                              <span className={`text-[13px] px-1 py-0.5 rounded ${isSel ? 'bg-white/20' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}`}>{cnt}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Khi chọn nhiều List */}
                  {currentGoal.listMode === 'multi' && (
                    <div className="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <span className="text-xs font-bold text-slate-600 dark:text-slate-300">
                          Chọn các List ({currentGoal.selectedLists.length}/{currentTargetLists.length} đã chọn):
                        </span>
                        <div className="flex space-x-2">
                          <button
                            type="button"
                            onClick={() => updateCurrentGoal({ selectedLists: currentTargetLists.map(l => l.id) })}
                            className="px-2 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 text-[11px] font-bold hover:bg-indigo-100"
                          >
                            Chọn tất cả
                          </button>
                          <button
                            type="button"
                            onClick={() => updateCurrentGoal({ selectedLists: [1] })}
                            className="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 text-[11px] font-bold hover:bg-slate-200"
                          >
                            Chỉ List 1
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 sm:grid-cols-6 gap-1.5 max-h-44 overflow-y-auto p-1">
                        {currentTargetLists.map(l => {
                          const isSel = currentGoal.selectedLists.includes(l.id);
                          return (
                            <button
                              key={l.id}
                              type="button"
                              onClick={() => {
                                const prev = currentGoal.selectedLists;
                                const next = isSel ? (prev.length > 1 ? prev.filter(x => x !== l.id) : prev) : [...prev, l.id].sort((a, b) => a - b);
                                updateCurrentGoal({ selectedLists: next });
                              }}
                              className={`p-1.5 rounded-lg border text-center transition-all ${
                                isSel
                                  ? 'bg-gradient-to-r from-rose-500 to-pink-600 text-white border-transparent shadow-sm'
                                  : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-800 hover:border-indigo-400'
                              }`}
                            >
                              <div className="text-[14px] font-bold">List {l.id}</div>
                              <div className={`text-[13px] ${isSel ? 'text-white/80' : 'text-slate-400'}`}>{l.count} từ</div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                {/* Dòng tóm tắt dưới cùng của ô Mục tiêu */}
                <div className="flex flex-wrap items-center justify-between gap-2 pt-1.5 text-base text-slate-500 border-t border-slate-100 dark:border-slate-800">
                  <span className="truncate">
                    💡 Đang chọn <b>{availableCount} từ khả dụng</b>. {(() => { const r = parseWordRange(currentGoal.wordLimit, availableCount); return r.invalid ? <>Khoảng <b>{currentGoal.wordLimit}</b> vượt quá số từ khả dụng.</> : r.isRange ? <>Sẽ học từ thứ <b>{r.from}</b> đến thứ <b>{r.to}</b> (<b>{r.count} từ</b>).</> : <>Sẽ bắt đầu học tối đa <b>{r.count} từ</b>.</>; })()}
                  </span>
                  <span className="font-semibold text-indigo-600 dark:text-indigo-400 whitespace-nowrap">
                    {currentGoal.listMode === 'all' ? 'Học tất cả các List' : (currentGoal.listMode === 'multi' ? `${currentGoal.selectedLists.length} List đã chọn` : `List ${currentGoal.listMode}`)}
                  </span>
                </div>
              </div>

              {/* Ô 2 (BÊN PHẢI - 5 CỘT): LỊCH NGÀY THÁNG RIÊNG BIỆT */}
              <div className="w-full lg:w-[640px] lg:shrink-0 lg:[zoom:0.75] p-5 md:p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl flex flex-col gap-4">
                <div className="space-y-3.5">
                  {/* Thanh điều hướng tháng/năm */}
                  <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                    <div>
                      <h4 className="text-[32px] font-black text-slate-900 dark:text-white leading-tight">
                        Tháng {calMonth + 1}, {calYear}
                      </h4>
                      <p className="text-[22px] text-slate-400 font-semibold mt-0.5">Bấm ngày để chọn mục tiêu học</p>
                    </div>

                    <div className="flex items-center space-x-1.5">
                      <button
                        type="button"
                        onClick={() => {
                          const today = new Date();
                          setCalYear(today.getFullYear());
                          setCalMonth(today.getMonth());
                          setSelectedDateKey(todayKey);
                        }}
                        className="px-4 py-2 rounded-lg text-[24px] font-bold bg-indigo-50 dark:bg-indigo-950 border border-indigo-200 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 shadow-sm transition"
                        title="Về ngày hôm nay"
                      >
                        Hôm nay
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          if (calMonth === 0) { setCalMonth(11); setCalYear(y => y - 1); }
                          else { setCalMonth(m => m - 1); }
                        }}
                        className="w-12 h-12 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-indigo-600 flex items-center justify-center font-bold text-[28px] transition"
                        title="Tháng trước"
                      >
                        ‹
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          if (calMonth === 11) { setCalMonth(0); setCalYear(y => y + 1); }
                          else { setCalMonth(m => m + 1); }
                        }}
                        className="w-12 h-12 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-indigo-600 flex items-center justify-center font-bold text-[28px] transition"
                        title="Tháng sau"
                      >
                        ›
                      </button>
                    </div>
                  </div>

                  {/* Lưới thứ trong tuần */}
                  <div className="grid grid-cols-7 gap-1 text-center text-[22px] font-black text-slate-400 uppercase tracking-wider py-1 border-b border-slate-100 dark:border-slate-800">
                    {['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(d => (
                      <div key={d}>{d}</div>
                    ))}
                  </div>

                  {/* Lưới các ngày trong tháng */}
                  <div className="grid grid-cols-7 gap-1 text-center">
                    {calendarDays.map((d, idx) => {
                      const isSelected = d.key === selectedDateKey;
                      const isDayToday = d.key === todayKey;
                      const hasGoal = !!dailyGoals[d.key];
                      const hasStudied = ((statsData.days && statsData.days[d.key]) || 0) > 0;

                      let cellCls = "relative py-2.5 rounded-xl text-[24px] font-bold transition flex flex-col items-center justify-center ";
                      if (isSelected) {
                        cellCls += "bg-gradient-to-r from-rose-500 to-indigo-600 text-white shadow-md ring-2 ring-indigo-400/40 ";
                      } else if (isDayToday) {
                        cellCls += "border-2 border-indigo-500 text-indigo-600 dark:text-indigo-400 bg-indigo-50/50 dark:bg-slate-800 font-black hover:bg-indigo-100 ";
                      } else if (d.isCurrentMonth) {
                        cellCls += "text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 bg-slate-50/40 dark:bg-slate-800/30 ";
                      } else {
                        cellCls += "text-slate-300 dark:text-slate-600 opacity-40 hover:opacity-80 ";
                      }

                      return (
                        <button
                          key={d.key + '_' + idx}
                          type="button"
                          onClick={() => {
                            setSelectedDateKey(d.key);
                            if (!d.isCurrentMonth) {
                              const [y, m] = d.key.split('-').map(Number);
                              setCalYear(y);
                              setCalMonth(m - 1);
                            }
                          }}
                          className={cellCls}
                        >
                          <span className="text-[24px]">{d.dayNum}</span>
                          <div className="flex space-x-1 mt-0.5 h-2">
                            {hasGoal && (
                              <span className={`w-2 h-2 rounded-full ${isSelected ? 'bg-white' : 'bg-rose-500'}`} title="Có mục tiêu đã đặt" />
                            )}
                            {hasStudied && (
                              <span className={`w-2 h-2 rounded-full ${isSelected ? 'bg-yellow-300' : 'bg-emerald-500'}`} title="Có thời gian học tập" />
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Khung tóm tắt thông tin ngày đang chọn */}
                <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 space-y-2 text-[24px]">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-slate-800 dark:text-slate-100">
                      📅 {getDayOfWeekName(selectedDateKey)}, {formatDateDisplay(selectedDateKey)}
                    </span>
                    {isToday && <span className="px-1.5 py-0.5 rounded text-[20px] font-black bg-rose-100 text-rose-600">Hôm nay</span>}
                  </div>
                  <div className="flex justify-between text-slate-500 dark:text-slate-400 text-[22px]">
                    <span>⏱ Đã học: <b>{fmtDur(selectedDateStudySec)}</b></span>
                    <span>🎯 Mục tiêu: <b>{goalLabel(currentGoal.wordLimit, availableCount)}</b></span>
                  </div>
                  <div className="flex items-center space-x-3 pt-1 text-[20px] text-slate-400 border-t border-slate-200 dark:border-slate-700/60">
                    <span className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-rose-500 mr-1"></span> Đã đặt mục tiêu</span>
                    <span className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1"></span> Đã học</span>
                  </div>
                </div>
              </div>

            </div>

            {/* DANH SÁCH TẤT CẢ CÁC DECK */}
            <div className="flex flex-wrap items-center justify-between gap-3 pt-4">
              <div>
                <h2 className="text-2xl font-black">Danh sách các Deck</h2>
                <p className="text-sm text-slate-400 mt-0.5">Hoặc duyệt bài theo từng Deck riêng lẻ bên dưới</p>
              </div>
              <button onClick={() => setAdding(!adding)} className={`px-4 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold flex items-center gap-2 shadow`}>
                <Icon name="plus" className="w-4 h-4" /><span>Thêm Deck</span>
              </button>
            </div>
            {adding && (
              <div className="flex flex-wrap gap-2 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                <input autoFocus value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addDeck()} placeholder={'Tên Deck mới (vd: Deck ' + (decks.length + 1) + ' - TOEIC)'}
                  className="flex-1 min-w-[200px] px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500" />
                <button onClick={addDeck} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold`}>Tạo Deck</button>
                <button onClick={() => setAdding(false)} className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-bold text-slate-500">Huỷ</button>
              </div>
            )}
            {decks.length === 0 && !adding && (
              <div className="p-10 text-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 space-y-3">
                <p className="text-slate-400">Chưa có Deck nào.</p>
                <button onClick={goImport} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-sm font-bold`}>Nạp từ vựng đầu tiên</button>
              </div>
            )}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {decks.map(d => {
                const cs = cards.filter(c => c.d === d.id);
                const wr = cs.filter(c => wrongIds.includes(c.n)).length;
                return (
                  <div key={d.id} onClick={() => openDeck(d.id)} role="button" tabIndex={0} onKeyDown={e => e.key === 'Enter' && openDeck(d.id)}
                    className="relative cursor-pointer text-left p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-400 hover:shadow-md transition space-y-3">
                    <button title="Xoá Deck này" onClick={e => { e.stopPropagation(); removeDeck(d); }} className="absolute top-3 right-3 p-1.5 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950">
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                    <div className="flex items-center gap-3 pr-8">
                      <div className={`w-11 h-11 shrink-0 rounded-xl ${tColor.light} ${tColor.text} flex items-center justify-center`}><Icon name="folder" className="w-6 h-6" /></div>
                      <h3 className="font-black text-base leading-snug">{d.name}</h3>
                    </div>
                    <div className="flex flex-wrap gap-2 text-[11px] font-bold">
                      <span className="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500">{cs.length} từ</span>
                      <span className="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500">{listMeta(cs).length} List</span>
                      {wr > 0 && <span className="px-2 py-1 rounded-lg bg-rose-50 dark:bg-rose-950 text-rose-500">{wr} từ sai</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </Shell>
        );
      }

      // MÀN HÌNH KẾT QUẢ SAU KHI NỘP BÀI
      if (mode && submitted) {
        const details = pool.filter(c => sess[c.n] !== true).map(c => ({
          key: c.n, label: c.w, sub: c.s || c.v, speak: c.w, kind: sess[c.n] === false ? 'wrong' : 'skip'
        }));
        return (
          <Shell>
            <ResultView title={`${deck.name} › ${scopeLabel}${onlyWrong ? ' › Từ sai' : ''}`} correct={okN} wrong={badN} skipped={skipN} details={details}>
              <button onClick={retryAll} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold shadow">↻ Làm lại bài này</button>
              {details.length > 0 && (
                <button onClick={reviewMissed} className="px-5 py-2.5 rounded-xl bg-rose-500 text-white text-sm font-bold shadow">Ôn lại từ sai &amp; bỏ qua ({details.length})</button>
              )}
              <button onClick={() => { setMode(null); setShowWrong(false); }} className="px-5 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm font-bold">Quay lại menu</button>
            </ResultView>
          </Shell>
        );
      }

      // BƯỚC 3: ĐANG LUYỆN TẬP
      if (mode) {
        return (
          <Shell>
            <SubmitBar done={doneN} total={pool.length} onSubmit={submitNow} />
            <div className="flex flex-wrap justify-between items-center gap-2">
              <button onClick={() => { setMode(null); setShowWrong(false); }} className="px-3.5 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold flex items-center space-x-1.5 shadow-sm">
                <Icon name="arrowLeft" className="w-4 h-4" /><span>Quay lại menu</span>
              </button>
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-bold text-slate-400 hidden sm:inline">{deck.name} › {scopeLabel}</span>
                {shufBtns}
                <button onClick={toggleWrong} className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition ${onlyWrong ? 'bg-rose-500 text-white border-rose-500 shadow' : 'bg-white dark:bg-slate-900 border-rose-200 text-rose-500 hover:bg-rose-50'}`}>
                  <Icon name="warning" className="w-4 h-4" />
                  <span>{onlyWrong ? `Đang ôn từ sai (${pool.length}) · Bấm để quay lại` : `Ôn từ sai (${wrongInScope.length})`}</span>
                </button>
              </div>
            </div>
            {onlyWrong && (
              <div className="rounded-2xl border border-rose-200 dark:border-rose-900 bg-rose-50/60 dark:bg-rose-950/30 p-3">
                <button onClick={() => setShowWrong(!showWrong)} className="text-xs font-bold text-rose-600">{showWrong ? '▾ Ẩn' : '▸ Xem'} danh sách {pool.length} từ sai (bấm vào từ để nghe)</button>
                {showWrong && (
                  <div className="flex flex-wrap gap-2 mt-2.5">
                    {pool.slice(0, 80).map(c => (
                      <button key={c.n} onClick={() => speak(c.w, 'en-US')} className="px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-rose-100 dark:border-rose-900 text-xs text-left">
                        <Icon name="volume" className="w-3.5 h-3.5 inline -mt-0.5 mr-1 text-rose-400" /><b>{c.w}</b> <span className="text-slate-400">· {c.s || c.v}</span>
                      </button>
                    ))}
                    {pool.length > 80 && <span className="text-xs text-slate-400 self-center">... và {pool.length - 80} từ nữa</span>}
                  </div>
                )}
              </div>
            )}
            {(() => {
              return (
                <div key={`${mode}-${posKey}-${attempt}`}>
                  {mode === 'flashcard' && <FlashcardMode pool={playPool} onMarkWrong={trackMark} posKey={modeKey} />}
                  {mode === 'quiz' && <QuizUnifiedMode pool={playPool} allCards={optionsPool} onMarkWrong={trackMark} posKey={modeKey} />}
                  {mode === 'match' && <MatchMode pool={playPool} onMarkWrong={trackMark} posKey={modeKey} />}
                  {mode === 'listen_word' && <ListenWordMode pool={playPool} allCards={optionsPool} onMarkWrong={trackMark} posKey={modeKey} />}
                  {mode === 'fill' && <FillMode pool={playPool} onMarkWrong={trackMark} posKey={modeKey} />}
                  {mode === 'dictation' && <DictationMode pool={playPool} onMarkWrong={trackMark} posKey={modeKey} />}
                </div>
              );
            })()}
          </Shell>
        );
      }

      // BƯỚC 2: CHỌN PHẠM VI (LIST / TOÀN BỘ) + CHẾ ĐỘ
      return (
        <Shell>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2 min-w-0">
              <button onClick={() => { setDeckId(null); setCustomGoalPool(null); }} className="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0">

                    onClick={() => { setScope('lists'); setCustomGoalPool(null); }}
                    className={`px-4 py-2 rounded-lg transition ${scope === 'lists' ? 'bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'text-slate-500'}`}
                  >

                  <span>Số từ muốn học:</span>
                  <input
                    type="number"
                    min="1"
                    max={scope === 'all' ? deckCards.length : (curList?.count || 55)}
                    placeholder="Tất cả"
                    value={scope === 'all' ? allDeckWordLimit : listWordLimit}
                    onChange={e => {
                      const val = e.target.value;
                      if (scope === 'all') setAllDeckWordLimit(val);

                    className="w-24 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-center font-black outline-none focus:border-indigo-500 text-slate-900 dark:text-white"

                  >

            {scope === 'lists' && showListGridInDeck && (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2.5 animate-fadeIn">

                  return (
                    <button

                      onClick={() => setListId(l.id)}
                      className={`p-3.5 rounded-2xl border text-left transition-all relative overflow-hidden ${
                        sel
                          ? 'bg-gradient-to-r from-rose-500 to-pink-600 text-white border-transparent shadow-lg shadow-rose-500/25 ring-2 ring-rose-400/50'

                      <div className="flex justify-between items-center mb-1">
                        <span className="font-black text-xs">List {l.id}</span>
                        <span className={`text-[10px] px-2 py-0.5 rounded-md font-black ${
                          sel ? 'bg-white/25 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'

              <div className="p-4 bg-slate-50 dark:bg-slate-800/50 flex flex-wrap items-center justify-between gap-2">
                <div>

                    {deck.name} › {scopeLabel}{onlyWrong ? ' › Từ sai' : ''}

                  <p className="text-xs text-slate-400 mt-0.5">Bước 3: Chọn phương thức học tập (trong mỗi bài đều có nút "Ôn từ sai" để học nhanh các từ làm sai)</p>
                </div>
                {scope === 'custom_goal' && (

              ))}

          </>)}
        </Shell>

    function SubmitBar({ done, total, onSubmit }) {
      const pct = total ? Math.min(100, Math.round(done / total * 100)) : 0;
      return (
        <>
          {/* Màn hình rộng: thanh nhỏ dọc, cố định ở lề phải (nằm ngoài vùng làm bài, không che ô nhập) */}
          <div className="hidden 2xl:flex fixed top-3 right-5 z-30 w-28 flex-col gap-1.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white/95 dark:bg-slate-900/95 backdrop-blur shadow-md p-2.5">
            <div className="flex justify-between text-[11px] font-bold text-slate-500 dark:text-slate-400">
              <span>{done}/{total}</span><span>{pct}%</span>
            </div>
            <div className="h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
              <div className="h-full rounded-full bg-emerald-500 transition-all" style={{ width: pct + '%' }} />
            </div>
            <button onClick={onSubmit} className="w-full py-1.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black whitespace-nowrap">✓ Nộp bài</button>
          </div>
          {/* Màn hình hẹp: nằm trong luồng ở đầu trang, bên phải, không đè lên nội dung */}
          <div className="2xl:hidden flex justify-end">
            <div className="inline-flex items-center gap-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm pl-3 pr-1 py-1">
              <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 whitespace-nowrap">{done}/{total}</span>
              <div className="w-14 sm:w-20 h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                <div className="h-full rounded-full bg-emerald-500 transition-all" style={{ width: pct + '%' }} />
              </div>
              <button onClick={onSubmit} className="px-3 py-1.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black whitespace-nowrap">✓ Nộp bài</button>
            </div>
          </div>
        </>
      );
    }

    function ResultPie({ correct, wrong, skipped, size = 220 }) {
      const total = correct + wrong + skipped;
      const R = 10.5, C = 2 * Math.PI * R;
      const segs = [[correct, '#10b981'], [wrong, '#f43f5e'], [skipped, '#94a3b8']];
      let off = 0;
      return (
        <svg viewBox="0 0 42 42" width={size} height={size} style={{ transform: 'rotate(-90deg)' }} role="img" aria-label="Biểu đồ tròn kết quả">
          <circle cx="21" cy="21" r="21" fill="#e2e8f0" opacity="0.4" />
          {total > 0 && segs.map(([v, col], i) => {
            if (!v) return null;
            const len = v / total * C;
            const el = <circle key={i} cx="21" cy="21" r={R} fill="none" stroke={col} strokeWidth="21" strokeDasharray={len + ' ' + (C - len)} strokeDashoffset={-off} />;
            off += len;
            return el;
          })}
        </svg>
      );
    }

    function ResultView({ title, correct, wrong, skipped, details, children }) {
      const total = correct + wrong + skipped;
      const pct = total ? Math.round(correct / total * 100) : 0;
      const msg = pct >= 90 ? 'Xuất sắc! 🎉' : pct >= 70 ? 'Làm tốt lắm 👏' : pct >= 50 ? 'Khá ổn, cố gắng thêm nhé 💪' : 'Hãy ôn lại và thử lại nhé 📚';
      const pctOf = (v) => total ? Math.round(v / total * 100) : 0;
      const legend = [
        ['Đúng', correct, 'bg-emerald-500', 'text-emerald-600 dark:text-emerald-400'],
        ['Sai', wrong, 'bg-rose-500', 'text-rose-600 dark:text-rose-400'],
        ['Bỏ qua', skipped, 'bg-slate-400', 'text-slate-500 dark:text-slate-400']
      ];
      return (
        <div className="space-y-5">
          <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm text-center space-y-5">
            <div>
              <p className="text-xs font-bold tracking-wider text-slate-400 uppercase">Kết quả bài làm</p>
              {title && <p className="text-sm font-bold text-slate-500 mt-1">{title}</p>}
            </div>
            <div className="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-10">
