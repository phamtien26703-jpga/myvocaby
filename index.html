    function diffWords(target, user) {
      const n = target.length, m = user.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
        dp[i][j] = target[i] === user[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      const tm = new Array(n).fill(false), um = new Array(m).fill(false);
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (target[i] === user[j]) { tm[i] = um[j] = true; i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
      }
      return { tm, um, ok: n > 0 && dp[0][0] === n && m === n };
    }

    const AudioDB = {

      },
      async get(k) {
        const db = await this.open();

      },
      async del(k) {
        const db = await this.open();

    // Chia audio thành từng câu: tìm các quãng lặng dài nhất; nếu không đủ thì chia theo độ dài câu
    function proportionalTimes(sents, dur) {
      const w = sents.map(s => Math.max(1, s.length)), tot = w.reduce((a, b) => a + b, 0);
      let acc = 0;
      return w.map(x => { const s = acc / tot * dur; acc += x; return [Number(s.toFixed(2)), Number((acc / tot * dur).toFixed(2))]; });
    }
    async function analyzeAudio(file, sents) {
      const AC = window.AudioContext || window.webkitAudioContext;
      let ab = null;
      try { const ctx = new AC(); ab = await ctx.decodeAudioData(await file.arrayBuffer()); if (ctx.close) ctx.close(); } catch (e) { ab = null; }
      if (!ab) {
        const dur = await new Promise(res => { const a = new Audio(URL.createObjectURL(file)); a.onloadedmetadata = () => res(a.duration || 0); a.onerror = () => res(0); });
        return { dur, times: proportionalTimes(sents, dur || sents.length * 4), auto: false };
      }
      const dur = ab.duration, n = sents.length;
      const data = ab.getChannelData(0), frame = Math.max(1, Math.floor(ab.sampleRate * 0.02)), fs = frame / ab.sampleRate;
      const rms = [];
      for (let i = 0; i + frame <= data.length; i += frame) { let s = 0; for (let j = 0; j < frame; j++) { const v = data[i + j]; s += v * v; } rms.push(Math.sqrt(s / frame)); }
      const sorted = [...rms].sort((a, b) => a - b);
      const thr = (sorted[Math.floor(sorted.length * 0.9)] || 0) * 0.12;
      const runs = []; let st = -1;
      for (let i = 0; i <= rms.length; i++) {
        const quiet = i < rms.length && rms[i] < thr;
        if (quiet && st < 0) st = i;
        if (!quiet && st >= 0) { const len = (i - st) * fs; if (len >= 0.15) runs.push({ st: st * fs, en: i * fs, len }); st = -1; }
      }
      const lead = runs.find(r => r.st < 0.05);
      const startAt = lead ? Math.min(lead.en, 1.5) : 0;
      const inner = runs.filter(r => r.st > 0.1 && r.en < dur - 0.1);
      if (n <= 1) return { dur, times: [[Number(startAt.toFixed(2)), Number(dur.toFixed(2))]], auto: true };
      if (inner.length < n - 1) return { dur, times: proportionalTimes(sents, dur), auto: false };
      const pick = [...inner].sort((a, b) => b.len - a.len).slice(0, n - 1).sort((a, b) => a.st - b.st);
      const times = [];
      for (let i = 0; i < n; i++) {
        const s = i === 0 ? startAt : Math.max(pick[i - 1].st, pick[i - 1].en - 0.12);
        const e = i === n - 1 ? dur : Math.min(pick[i].en, pick[i].st + 0.2);
        times.push([Number(s.toFixed(2)), Number(e.toFixed(2))]);
      }
      return { dur, times, auto: true };
    }
// Bộ nhớ đệm (lưu cả vào localStorage) cho bản dịch câu và thông tin từ

    // Dịch cả câu Anh -> Việt (Google Translate công khai, miễn phí)
    async function fetchTranslation(text) {
      const clean = text.trim();
      if (!clean) return '';
      if (TRANS_CACHE[clean]) return TRANS_CACHE[clean];
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(clean)}`;
        const data = await (await fetch(url)).json();
        const translated = data && data[0] ? data[0].map(i => i[0]).join('') : '';
        if (translated) { TRANS_CACHE[clean] = translated; lsSave('mv_trans_cache', TRANS_CACHE); }
        return translated || 'Chưa có bản dịch';
      } catch (err) {
        return 'Không thể tải bản dịch tự động (kiểm tra kết nối mạng).';
      }
    }

    // Từ loại: tiếng Anh -> viết tắt + tiếng Việt
    const POS_VI = {
      noun: ['n', 'danh từ'], verb: ['v', 'động từ'], adjective: ['adj', 'tính từ'], adverb: ['adv', 'trạng từ'],

    // Google trả từ loại bằng tiếng Việt (vì dịch sang vi) -> thêm cả khóa tiếng Việt
    Object.assign(POS_VI, {
      'danh từ': ['n', 'danh từ'], 'động từ': ['v', 'động từ'], 'tính từ': ['adj', 'tính từ'], 'trạng từ': ['adv', 'trạng từ'],

    const posAbbr = (x) => {
      const k = (x.vi || x.ab || '').normalize('NFC').toLowerCase().trim();
      const r = POS_RULES.find(([re]) => re.test(k));
      return r ? r[1] : (x.ab || x.vi || '').normalize('NFC').toUpperCase();

    // Từ loại -> viết tắt chuẩn (nhận cả tiếng Anh lẫn tiếng Việt)
    const posKeyOf = (str) => { const k = String(str || '').normalize('NFC').toLowerCase().trim(); const r = POS_RULES.find(([re]) => re.test(k)); return r ? r[1] : k.toUpperCase().slice(0, 4); };
    const stripTags = (t) => String(t || '').replace(/<b>(.*?)<\/b>/gi, '[$1]').replace(/<[^>]+>/g, '').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').trim();

    // Lấy nghĩa + từ loại + phiên âm + định nghĩa Anh + ví dụ của 1 từ
    async function fetchWordInfo(word) {
      const key = word.toLowerCase();
      if (WORD_CACHE[key]) return WORD_CACHE[key];
      const g = fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&dt=bd&dt=md&dt=ex&q=${encodeURIComponent(key)}`).then(r => r.json()).catch(() => null);
      const d = fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`).then(r => (r.ok ? r.json() : null)).catch(() => null);
      const [data, dict] = await Promise.all([g, d]);
      if (!data && !dict) return { p: [], m: '', ipa: '', defs: {}, exs: [], err: true };
      const info = { p: [], m: '', ipa: '', defs: {}, exs: [] };
      try {
        if (data) {
          info.m = data[0] && data[0][0] ? data[0][0][0] || '' : '';
          (Array.isArray(data[1]) ? data[1] : []).slice(0, 3).forEach(e => {
            const pv = POS_VI[String(e[0] || '').normalize('NFC').toLowerCase()] || [posKeyOf(e[0]), e[0] || ''];
            info.p.push({ ab: pv[0], vi: pv[1], m: (e[1] || []).slice(0, 3).join(', ') });
          });
          (Array.isArray(data[12]) ? data[12] : []).forEach(e => {
            const ab = posKeyOf(e[0]), first = e[1] && e[1][0];
            if (first && first[0] && !info.defs[ab]) info.defs[ab] = first[0];
          });
          const ex = data[13] && data[13][0];
          if (Array.isArray(ex)) ex.forEach(x => { const t = stripTags(x && x[0]); if (t) info.exs.push(t); });
        }
        if (Array.isArray(dict) && dict[0]) {
          const ent = dict[0];
          info.ipa = ent.phonetic || ((ent.phonetics || []).find(x => x.text) || {}).text || '';
          (ent.meanings || []).forEach(mn => {
            const ab = posKeyOf(mn.partOfSpeech);
            (mn.definitions || []).forEach(df => {
              if (df.definition && !info.defs[ab]) info.defs[ab] = df.definition;
              if (df.example) info.exs.push(df.example);
            });
          });
        }
      } catch (e) {}
      if (info.ipa && !/^\//.test(info.ipa)) info.ipa = '/' + info.ipa.replace(/^\[|\]$/g, '') + '/';
      info.exs = [...new Set(info.exs)].slice(0, 6);
      if (!info.p.length && info.m) info.p.push({ ab: '', vi: '', m: info.m });
      if (info.p.length || info.ipa) { WORD_CACHE[key] = info; lsSave('mv_word_cache2', WORD_CACHE); }
      return info;
    }

    // Rút gọn nghĩa cho chế độ điền từ: chỉ giữ 1-2 nghĩa chính, ngắn gọn
    function shortMeaning(m) {
      const parts = String(m || '').split(/\s*,\s*/).filter(Boolean);
      const good = parts.filter(x => x.length <= 22 && x.split(' ').length <= 4);
      return (good.length ? good : parts).slice(0, 2).join(', ');
    }
    // Sắp xếp từ loại theo ngữ cảnh câu (đoán từ loại hợp lý nhất đứng đầu)
    function ctxOrder(sent, w, entries) {
      if (!entries || entries.length < 2) return entries || [];
      const lw = w.toLowerCase();
      const toks = (sent.match(/[A-Za-z]+(?:'[A-Za-z]+)*/g) || []).map(t => t.toLowerCase());
      const i = toks.findIndex(t => t.replace(/'s$/, '') === lw);
      if (i < 0) return entries;
      const prev = toks[i - 1] || '', prev2 = toks[i - 2] || '';
      const DET = ['the', 'a', 'an', 'my', 'your', 'his', 'her', 'its', 'our', 'their', 'this', 'that', 'these', 'those', 'some', 'any', 'many', 'much', 'every', 'each', 'no'];
      const BE = ['is', 'are', 'was', 'were', 'be', 'am', 'been', 'very', 'so', 'too', 'more', 'most', 'really', 'quite'];
      const VERBPRE = ['will', 'would', 'can', 'could', 'should', 'must', 'may', 'might', 'shall', "don't", "doesn't", "didn't", 'not', 'i', 'we', 'you', 'they', 'people', 'children', 'men', 'women', "let's"];
      let want = null;
      if (/ly$/.test(lw)) want = 'ADV';
      else if (prev === 'to') want = ['go', 'goes', 'went', 'going', 'come', 'came', 'back', 'walk', 'walks', 'walked'].includes(prev2) ? 'N' : 'V';
      else if (VERBPRE.includes(prev)) want = 'V';
      else if (DET.includes(prev)) want = 'N';
      else if (BE.includes(prev)) want = 'ADJ';
      if (!want) return entries;
      const hit = entries.filter(e => posKeyOf(e.vi || e.ab) === want);
      return hit.length ? [...hit, ...entries.filter(e => !hit.includes(e))] : entries;
    }
    // Tách các từ khác nhau trong câu
    function sentenceWords(sent, all) {
      const seen = new Set(), out = [];
      (sent.match(/[A-Za-z]+(?:'[A-Za-z]+)*/g) || []).forEach(raw => {
        const w = raw.replace(/'s$/i, '');
        const k = w.toLowerCase();
        if (!k || seen.has(k) || (!all && VOCAB_SKIP.has(k))) return;
        seen.add(k); out.push(w);
      });
      return out;
    }
    // Hook: danh sách từ vựng của câu (tải dần từng từ)
    function useSentenceVocab(sent, enabled, all) {
      const [list, setList] = useState([]);
      useEffect(() => {
        if (!enabled || !sent) { setList([]); return; }
        let dead = false;
        const words = sentenceWords(sent, all);
        setList(words.map(w => ({ w, loading: !WORD_CACHE[w.toLowerCase()], ...(WORD_CACHE[w.toLowerCase()] || { p: [], m: '' }) })));
        words.forEach(w => fetchWordInfo(w).then(info => {
          if (dead) return;
          setList(l => l.map(x => x.w === w ? { w, loading: false, ...info } : x));
        }));
        return () => { dead = true; };
      }, [sent, enabled, all]);
      return list;
    }
    // Thẻ từ vựng lật được (mặt trước: từ + phiên âm; mặt sau: nghĩa, định nghĩa, ví dụ)
    function VocabFlipCard({ item, sent, trans, acc, num, checked, onCheck, onPick }) {

      const main = order[0];

      const defs = item.defs || {};
      const def = defs[ab] || Object.values(defs)[0] || '';
      const others = order.slice(1);
      const examples = useMemo(() => {

        (item.exs || []).filter(e => e.replace(/[\[\]]/g, '').trim().toLowerCase() !== sent.trim().toLowerCase()).slice(0, 2).forEach(e => list.push({ en: e, vi: null }));
        return list;
      }, [sent, item.exs]);
      useEffect(() => {

        examples.forEach(ex => {

      const hi = (str) => {

        const re = new RegExp('\\b(' + item.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)', 'gi');
        return str.split(re).map((part, i) => (i % 2 ? <strong key={i} className={cls}>{part}</strong> : part));

            {item.ipa ? <p className="text-sm font-mono text-indigo-500 font-bold mt-1">{item.ipa}</p> : (item.loading && <p className="text-xs text-slate-400 animate-pulse mt-1">Đang tra...</p>)}

      return (

            <div className="flex items-baseline gap-2 flex-wrap">
              {chk}<span className="text-xs font-mono font-bold text-slate-400">[#{num}]</span>
              <h4 className="text-2xl font-black text-slate-900 dark:text-white">{item.w}</h4>
              {ab && <span className="text-sm font-mono text-slate-500">({ab.toLowerCase()})</span>}
              {item.ipa && <span className="text-sm font-mono text-indigo-500 font-bold">{item.ipa}</span>}
            </div>
            <div className="flex gap-1.5">
              <button onClick={spk('en-GB')} className={uk}>🔊 UK</button>
              <button onClick={spk('en-US')} className={us}>🔊 US</button>
            </div>
          </div>
          <div className="space-y-0.5">
            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Định nghĩa:</span>
            <p className="text-lg md:text-xl font-black text-indigo-600 dark:text-indigo-400 leading-snug">{meaning}</p>
            {def && <p className="text-xs md:text-sm text-slate-500 dark:text-slate-400 italic">={def}</p>}
            {others.length > 0 && (
              <p className="text-xs text-slate-500 dark:text-slate-400 pt-1">
                {others.map((x, j) => <span key={j} className="mr-3"><span className="font-bold text-slate-400">{posAbbr(x)}:</span> {x.m}</span>)}
              </p>

          </div>
          <div className="space-y-1.5">

            {examples.map((ex, i) => {

                </div>
              );
            })}

          <p className="text-center text-[11px] font-semibold text-slate-400">↻ Nhấn vào thẻ để lật lại</p>

    function DictationPlayer({ lesson, sentences, done, onDone, onAttempt, onTimes, onSaveWords, decks = [], onBack, tColor }) {

      const playFull = () => {

      const buildItem = (it) => {

          {showList && (

              <span>CÂU {idx + 1} / {total} · {target.length} từ{useAudio ? ' · 🎵 audio của bạn' : ' · giọng đọc máy'}</span>
              <div className="flex items-center gap-2">
                {!useAudio && (
                  <div className="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg">
                    {[['en-GB', 'UK'], ['en-US', 'US']].map(a => <button key={a[0]} onClick={() => setAcc(a[0])} className={`px-2.5 py-1 rounded-md ${acc === a[0] ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow' : 'text-slate-500'}`}>{a[1]}</button>)}
                  </div>
                )}
                <select value={rate} onChange={e => setRate(Number(e.target.value))} className="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-xs font-bold">
                  <option value={0.6}>Chậm 0.6x</option><option value={0.8}>0.8x</option><option value={0.9}>0.9x</option><option value={1}>Bình thường</option><option value={1.2}>Nhanh 1.2x</option>
                </select>
              </div>
            </div>

            <div className="flex justify-center gap-3">
              <button onClick={() => play()} className={`w-20 h-20 rounded-full ${tColor.bg} text-white flex items-center justify-center shadow-lg hover:scale-105 transition`} title="Nghe câu này"><Icon name="volume" className="w-10 h-10" /></button>
              <button onClick={() => play(0.55)} className="self-end px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-500" title="Nghe thật chậm">🐢 Chậm</button>
            </div>

            {lesson.hasAudio && audioReady && (
              <div className="space-y-2">
                <button onClick={() => setEdit(e => !e)} className="text-xs font-bold text-slate-400 hover:text-indigo-500">{edit ? '▾' : '▸'} ⏱ Chỉnh thời gian cắt câu này (nếu audio bị cắt lệch)</button>
                {edit && seg && (
                  <div className="flex flex-wrap items-center gap-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 text-xs font-bold text-slate-500">
                    <span>Bắt đầu</span>
                    <button onClick={() => setSeg(0, seg[0] - 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">−0.1</button>
                    <input type="number" step="0.05" className={inp} value={seg[0]} onChange={e => setSeg(0, e.target.value)} />
                    <button onClick={() => setSeg(0, seg[0] + 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">+0.1</button>
                    <span className="ml-2">Kết thúc</span>
                    <button onClick={() => setSeg(1, seg[1] - 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">−0.1</button>
                    <input type="number" step="0.05" className={inp} value={seg[1]} onChange={e => setSeg(1, e.target.value)} />
                    <button onClick={() => setSeg(1, seg[1] + 0.1)} className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700">+0.1</button>
                    <button onClick={() => play()} className={`${pill} ${tColor.bg} text-white`}>Nghe thử</button>
                  </div>
                )}
              </div>
            )}

            <textarea ref={inputRef} rows={3} value={val} disabled={res && res.ok} onChange={e => setVal(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); if (res && res.ok) go(1); else check(); } }}
              autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck={false}
              placeholder="Nghe và gõ lại câu bạn nghe được... (Enter để kiểm tra)"
              className="w-full px-4 py-3 rounded-2xl border-2 border-slate-300 dark:border-slate-700 bg-transparent text-lg font-semibold outline-none focus:border-indigo-500" />

            <div className="flex flex-wrap gap-2">
              <button onClick={check} className={`${pill} ${tColor.bg} text-white shadow`}>Kiểm tra</button>
              <button onClick={() => setHint(h => !h)} className={`${pill} border border-slate-200 dark:border-slate-700 text-slate-500`}>💡 Gợi ý</button>
              <button onClick={() => setRes({ ...diffWords(target, []), score: 0, userWords: [], shown: true })} className={`${pill} border border-slate-200 dark:border-slate-700 text-slate-500`}>Hiện đáp án</button>
            </div>
            {hint && !res && <p className="font-mono text-sm text-slate-500 tracking-wider">{hintText}</p>}

            {res && (
              <div className={`p-4 rounded-2xl space-y-3 ${res.ok ? 'bg-emerald-50 dark:bg-emerald-950/50' : 'bg-slate-50 dark:bg-slate-800/60'}`}>
                {!res.shown && <p className={`text-sm font-bold ${res.ok ? 'text-emerald-600' : 'text-rose-600'}`}>{res.ok ? '✓ Chính xác! 🎉' : `Chưa đúng hoàn toàn · ${res.score}% số từ`}</p>}
                {!res.shown && !res.ok && (
                  <p className="text-base font-semibold leading-relaxed"><span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mr-2">Bạn gõ</span>
                    {res.userWords.map((w, i) => <span key={i} className={`mr-1.5 ${res.um[i] ? 'text-emerald-600' : 'text-rose-600 line-through'}`}>{w}</span>)}</p>
                )}
                <p className="text-base font-semibold leading-relaxed"><span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mr-2">Đáp án</span>
                  {sent.split(/\s+/).map((w, i) => (
                    <button key={i} type="button" onClick={() => setPw(w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, ''))} title="Bấm để chọn từ này lưu vào từ vựng" className="mr-1.5 text-slate-900 dark:text-white hover:text-indigo-600 hover:underline">{w}</button>
                  ))}</p>
{/* 1. NGHĨA TIẾNG VIỆT CỦA CÂU */}
                <div className="p-3.5 rounded-xl bg-white/90 dark:bg-slate-900/90 border border-slate-200/80 dark:border-slate-800 space-y-1">
                  <div className="flex items-center gap-1.5 text-xs font-bold text-indigo-600 dark:text-indigo-400"><span>🇻🇳</span><span>Nghĩa tiếng Việt của câu:</span></div>
                  <p className="text-base font-bold text-slate-800 dark:text-slate-100">
                    {loadingTrans ? <span className="text-xs text-slate-400 animate-pulse font-normal">Đang dịch...</span> : (trans || 'Chưa có bản dịch')}
                  </p>
                </div>

                {/* 2. TỪ VỰNG TRONG CÂU: PHÂN LOẠI TỪ & NGHĨA */}
                <div className="space-y-2 pt-2 border-t border-slate-200/70 dark:border-slate-700">
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-[11px] font-black uppercase tracking-wider text-slate-400">📖 Từ vựng trong câu ({vocab.length}) · bấm thẻ để lật</span>
                    <label className="text-[11px] font-bold text-slate-400 flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={showAllVocab} onChange={e => setShowAllVocab(e.target.checked)} />Hiện cả từ cơ bản</label>
                  </div>
                  <div className="flex flex-wrap items-center gap-2 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                    <span className="text-[11px] font-bold text-slate-400">💾 Lưu vào deck:</span>
                    <select value={deckSel} onChange={e => setDeckSel(e.target.value)} className="px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-bold max-w-[190px]">
                      {deckOpts.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                      <option value="__new">➕ Tạo deck mới...</option>
                    </select>
                    {deckSel === '__new' && <input value={newDeck} onChange={e => setNewDeck(e.target.value)} placeholder="Tên deck mới" className="w-36 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-bold outline-none focus:border-indigo-500" />}
                    <button onClick={() => { const o = {}; if (!allSel) vocab.forEach(v => { o[v.w.toLowerCase()] = true; }); setSel(o); }} className={`${pill} border border-slate-200 dark:border-slate-700 text-slate-500`}>{allSel ? '☐ Bỏ chọn' : '☑ Chọn tất cả'}</button>
                    <button onClick={() => saveBatch(vocab.filter(v => sel[v.w.toLowerCase()]))} disabled={!selCount || saving} className={`${pill} ${tColor.bg} text-white disabled:opacity-40`}>Lưu {selCount} từ đã chọn</button>
                    <button onClick={() => saveBatch(vocab)} disabled={!vocab.length || saving || vocab.some(v => v.loading)} className={`${pill} border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 disabled:opacity-40`}>{vocab.some(v => v.loading) ? 'Đang tra từ...' : `Lưu toàn bộ (${vocab.length})`}</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {vocab.map((item, i) => <VocabFlipCard key={item.w} item={item} sent={sent} trans={trans} acc={acc} num={i + 1} checked={!!sel[item.w.toLowerCase()]} onCheck={() => setSel(o => ({ ...o, [item.w.toLowerCase()]: !o[item.w.toLowerCase()] }))} onPick={(w, m) => { setPw(w); setPm(m); }} />)}
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-200/70 dark:border-slate-700">
                  <span className="text-[11px] font-bold text-slate-400">📌 Lưu từ mới (bấm từ trong đáp án để chọn):</span>
                  <input value={pw} onChange={e => setPw(e.target.value)} placeholder="Từ tiếng Anh" className="w-32 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-sm font-bold outline-none focus:border-indigo-500" />
                  <input value={pm} onChange={e => setPm(e.target.value)} placeholder="Nghĩa tiếng Việt" className="flex-1 min-w-[120px] px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:border-indigo-500" />
                  <button onClick={async () => { if (pw.trim()) { const did = await onSaveWords(saveTarget(), [{ w: pw, s: pm, p: '', i: '', e: '', extra: '' }], sent, trans); if (did) { if (deckSel === '__new') { setDeckSel(did); setNewDeck(''); } setPw(''); setPm(''); } } }} disabled={!pw.trim()} className={`${pill} ${tColor.bg} text-white disabled:opacity-40`}>Lưu vào deck đã chọn</button>
                </div>
              </div>
            )}

            <div className="flex justify-between pt-3 border-t border-slate-100 dark:border-slate-800">
              <button disabled={idx === 0} onClick={() => go(-1)} className="px-5 py-2.5 rounded-xl border text-xs font-bold disabled:opacity-30">← Câu trước</button>
              <button disabled={idx >= total - 1} onClick={() => go(1)} className={`px-5 py-2.5 rounded-xl ${tColor.bg} text-white text-xs font-bold disabled:opacity-30`}>Câu sau →</button>
            </div>
          </div>

          {/* TOÀN BỘ ĐOẠN NGHE (Full transcript) */}
          <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <button onClick={() => setShowFull(v => !v)} className="w-full flex items-center justify-between gap-2 px-5 py-3.5 text-left bg-indigo-50 dark:bg-slate-800/60">
              <span className="text-sm font-black">📄 Toàn bộ đoạn nghe (Full Transcript) · {total} câu</span>
              <span className="text-slate-400 text-xs font-bold">{showFull ? '▴ Thu gọn' : '▾ Mở ra'}</span>
            </button>
            {showFull && (
              <div className="p-5 space-y-4">
                <div className="flex flex-wrap items-center gap-2">
                  <button onClick={playFull} className={`${pill} ${tColor.bg} text-white shadow`}>{fullPlaying ? '⏹ Dừng' : '▶ Nghe cả bài'}</button>
                  <button onClick={() => { const t = sentences.join('\n'); if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {}); }} className={`${pill} border border-slate-200 dark:border-slate-700 text-slate-500`}>📋 Copy</button>
                  <span className="text-[11px] text-slate-400">Cả bài đọc bằng giọng máy ({acc === 'en-GB' ? 'UK' : 'US'}, tốc độ {rate}x). Bấm một câu để nhảy tới câu đó.</span>
                </div>
                <div className="space-y-1.5 text-base leading-relaxed">
                  {sentences.map((st, i) => (
                    <p key={i}>
                      <button type="button" onClick={() => { stopFull(); jump(i); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`text-left hover:text-indigo-600 hover:underline ${i === idx ? 'font-black text-indigo-600' : done[i] ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-800 dark:text-slate-100'}`}>{st}</button>
                    </p>
                  ))}
                </div>
              </div>
            )}
          </div>
        </Shell>
      );
    }

    function TopicThumb({ topic, tColor, size = 'w-20 h-20' }) {
      const [err, setErr] = useState(false);
      if (topic.img && !err) {
        return (
          <div className="p-1 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shrink-0 shadow-sm">
            <img src={topic.img} alt={topic.name} onError={() => setErr(true)} className={`${size} rounded-lg object-cover block`} />
          </div>
        );
      }
      return (
        <div className={`${size} shrink-0 rounded-xl ${tColor.light} flex items-center justify-center text-3xl border border-slate-200 dark:border-slate-700`}>
          {topic.icon || '🎧'}
        </div>
      );
    }

    function ListeningSection({ tColor, decks, cards, setDecks, setCards, showToast }) {
      const load = () => { try { return JSON.parse(Store.get('myvocab_v4_dict')) || {}; } catch (e) { return {}; } };
      const [st, setSt] = useState(load);
      const [openId, setOpenId] = useNavState('listen_openId', null);
      const [activeTopicId, setActiveTopicId] = useNavState('listen_topicId', null);
      const [viewMode, setViewMode] = useNavState('listen_viewMode', 'topics'); // 'topics' (All topics DailyDictation) | 'lessons' (Tất cả bài nghe)
      const [openDescs, setOpenDescs] = useState({});
      const [form, setForm] = useNavState('listen_form', false);
      const [title, setTitle] = useNavState('listen_title', '');
      const [text, setText] = useNavState('listen_text', '');
      const [file, setFile] = useState(null);
      const [topicSel, setTopicSel] = useNavState('listen_topicSel', 'conv');
      const [newTopic, setNewTopic] = useNavState('listen_newTopic', '');
      const [filter, setFilter] = useNavState('listen_filter', 'all');
      const [busy, setBusy] = useState('');
      const [dk, setDk] = useState('');
      const [lk, setLk] = useState('');
      useEffect(() => { try { Store.set('myvocab_v4_dict', JSON.stringify(st)); } catch (e) { showToast('Bộ nhớ trình duyệt đã đầy.'); } }, [st]);

      const custom = st.lessons || [];
      const prog = st.prog || {};
      const daily = st.daily || {};
      const topics = [...DICT_TOPICS, ...(st.topics || [])];
      const all = [...(window.LISTENING_DATA || DICT_SAMPLES).map(l => ({ ...l, builtin: true })), ...custom];
      const lesson = all.find(l => l.id === openId);
      const sentsOf = (l) => splitSentences(l.text);
      const topicOf = (l) => topics.find(t => t.id === (l.topic || 'other')) || topics[topics.length - 1];
      const activeTopic = topics.find(t => t.id === activeTopicId);

      // ----- thống kê -----
      const dkey = (d) => d.toLocaleDateString('en-CA');
      const todayStat = daily[dkey(new Date())] || { t: 0, c: 0 };
      let streak = 0;
      { const d = new Date(); if (!(daily[dkey(d)] || {}).t) d.setDate(d.getDate() - 1); while ((daily[dkey(d)] || {}).t) { streak++; d.setDate(d.getDate() - 1); } }
      const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return { l: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][d.getDay()], c: (daily[dkey(d)] || {}).c || 0 }; });
      const wmax = Math.max(1, ...week.map(w => w.c));
      const totalCorrect = Object.values(daily).reduce((a, x) => a + (x.c || 0), 0);

      const onAttempt = (ok) => setSt(s => {
        const k = dkey(new Date()); const d = (s.daily || {})[k] || { t: 0, c: 0 };
        return { ...s, daily: { ...(s.daily || {}), [k]: { t: d.t + 1, c: d.c + (ok ? 1 : 0) } } };
      });
      const markDone = (id, i) => setSt(s => ({ ...s, prog: { ...(s.prog || {}), [id]: { ...((s.prog || {})[id] || {}), [i]: true } } }));
      const resetProg = (id) => {
        ['dict_idx_', 'dict_val_', 'dict_res_', 'dict_hint_'].forEach(k => {
          try { localStorage.removeItem(Store.p + 'myvocab_nav_' + k + id); } catch (e) {}
        });
        setSt(s => { const p = { ...(s.prog || {}) }; delete p[id]; return { ...s, prog: p }; });
      };
      const setTimes = (id, i, seg) => setSt(s => ({ ...s, lessons: (s.lessons || []).map(l => { if (l.id !== id) return l; const t = [...(l.times || [])]; t[i] = seg; return { ...l, times: t }; }) }));

      const addLesson = async (t, body, topicId, f) => {
        const sents = splitSentences(body);
        if (!sents.length) return;
        const id = uid();
        let extra = {};
        if (f) {
          setBusy('Đang phân tích audio và chia câu...');
          try {
            const r = await analyzeAudio(f, sents);
            await AudioDB.put('a_' + id, f);
            extra = { hasAudio: true, times: r.times, dur: r.dur };
            showToast(r.auto ? 'Đã chia audio thành ' + sents.length + ' câu theo quãng lặng. Nếu lệch, hãy chỉnh trong bài.' : 'Đã chia audio theo độ dài câu (ước lượng). Hãy chỉnh thời gian từng câu cho khớp.');
          } catch (e) { showToast('Không lưu được audio, bài sẽ dùng giọng đọc máy.'); }
          setBusy('');
        }
        setSt(s => {
          let topic = topicId, topicsList = s.topics || [];
          if (topicId === '__new') {
            const nm = newTopic.trim() || 'Chủ đề mới'; topic = uid();
            topicsList = [...topicsList, { id: topic, name: nm, icon: '📂' }];
          }
          const l = { id, topic, title: (t || '').trim() || 'Bài nghe ' + ((s.lessons || []).length + 1), level: '', text: body.trim(), ...extra };
          return { ...s, topics: topicsList, lessons: [...(s.lessons || []), l] };
        });
        setTitle(''); setText(''); setFile(null); setNewTopic(''); setForm(false);
      };
      const delLesson = (l) => {
        if (!confirm(`Xoá bài nghe "${l.title}"?`)) return;
        if (l.hasAudio) AudioDB.del('a_' + l.id);
        setSt(s => { const p = { ...(s.prog || {}) }; delete p[l.id]; return { ...s, lessons: (s.lessons || []).filter(x => x.id !== l.id), prog: p }; });
      };

      // Lưu 1 hoặc nhiều từ vào deck có sẵn hoặc deck mới (target: {id} | {newName})
      const saveWords = async (target, items, sentence, trans) => {
        if (!items || !items.length) return null;
        let did, dname;
        if (target && target.newName !== undefined) {
          const name = (target.newName || '').trim();
          if (!name) { showToast('Hãy đặt tên cho deck mới.'); return null; }
          const same = decks.find(d => (d.name || '').toLowerCase() === name.toLowerCase());
          did = same ? same.id : 'dl_' + uid(); dname = same ? same.name : name;
          if (!same) setDecks(ds => [...ds, { id: did, name }]);
        } else {
          did = (target && target.id) || 'dlisten';
          const dk0 = decks.find(d => d.id === did);
          dname = dk0 ? dk0.name : 'Từ mới khi nghe';
          if (!dk0) setDecks(ds => [...ds, { id: did, name: dname }]);
        }
        const exist = cards.filter(c => c.d === did);
        const have = new Set(exist.map(c => c.w.toLowerCase()));
        let n = Math.max(0, ...cards.map(c => c.n)) + 1;
        let num = exist.length ? Math.max(...exist.map(numOf)) + 1 : 1;
        const fresh = [];
        let skipped = 0;
        for (const it of items) {
          const word = (it.w || '').trim();
          if (!word) continue;
          if (have.has(word.toLowerCase())) { skipped++; continue; }
          have.add(word.toLowerCase());
          const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
          const x = [];
          if (sentence) x.push(sentence.replace(re, m => '[' + m + ']') + (trans ? ` (=Dịch: ${trans})` : ''));
          if (it.extra) {
            const clean = it.extra.replace(/[\[\]]/g, '');
            const vi = await fetchTranslation(clean);
            const marked = /\[[^\]]+\]/.test(it.extra) ? it.extra : it.extra.replace(re, m => '[' + m + ']');
            x.push(marked + (vi && !/^Không thể/.test(vi) ? ` (=Dịch: ${vi})` : ''));
          }
          const mean = (it.s || '').trim(), short = (it.short || '').trim() || mean;
          // s = nghĩa rút gọn (chế độ điền từ); v = nghĩa đầy đủ (flashcard)
          fresh.push({ n: n++, num, l: Math.floor((num - 1) / 55) + 1, d: did, w: word, p: it.p || '', i: it.i || '', s: short, v: mean, e: it.e || '', x });
          num++;
        }
        if (fresh.length) setCards(cs => [...cs, ...fresh]);
        showToast(fresh.length
          ? `Đã lưu ${fresh.length} từ vào Deck "${dname}"${skipped ? ` (bỏ qua ${skipped} từ đã có)` : ''}.`
          : `Các từ này đã có trong Deck "${dname}".`);
        return did;
      };

      const deckListInfo = listMeta(cards.filter(c => c.d === (dk || (decks[0] || {}).id)));
      const fromDeck = () => {

                  <div className="flex flex-wrap justify-center gap-2">
                    <button onClick={() => { setTopicSel(activeTopic.id); setForm(true); }} className={`px-4 py-2 rounded-xl ${tColor.bg} text-white text-xs font-bold`}>+ Thêm bài nghe mới</button>
                    {activeTopic.url && <a href={activeTopic.url} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold">Mở {activeTopic.ddLessons} bài trên DailyDictation ↗</a>}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="inline-flex bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
                  <button onClick={() => setViewMode('topics')} className={`px-4 py-2 rounded-lg transition ${viewMode === 'topics' ? 'bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'text-slate-500'}`}>

                  </button>
                  <button onClick={() => setViewMode('lessons')} className={`px-4 py-2 rounded-lg transition ${viewMode === 'lessons' ? 'bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'text-slate-500'}`}>

    function Root() {
      const [auth, setAuth] = useState(() => { const u = Auth.current(); Store.setUser(u); return { user: u, guest: !u && Auth.isGuest() }; });
      useEffect(() => {
        if (!auth.user && !auth.guest) {
          const r = document.documentElement;
          Array.from(r.classList).filter(c => c.startsWith('sk-') || c === 'char-theme' || c === 'dark').forEach(c => r.classList.remove(c));
          document.body.classList.remove('char-theme');
        }
      }, [auth]);
      const enter = (user) => { Store.setUser(user); Auth.setCurrent(user); setAuth({ user, guest: !user }); };
      if (!auth.user && !auth.guest) {
        return <AuthScreen onAuth={enter} onGuest={() => { Auth.setGuest(true); enter(null); }} />;
      }
      const userName = auth.user ? ((Auth.users()[auth.user] || {}).name || auth.user) : null;
      return <App key={auth.user || '__guest'} user={auth.user} userName={userName}
        onLogout={() => { Auth.setCurrent(null); Auth.setGuest(false); Store.setUser(null); setAuth({ user: null, guest: false }); }}
        onLogin={() => { Auth.setGuest(false); Store.setUser(null); setAuth({ user: null, guest: false }); }} />;
    }
// ==========================================
    // MODULE LUYỆN ĐỌC IELTS READING
    // ==========================================
    function ReadingSection({ tColor }) {
      const data = window.READING_DATA || [];
      const [activeId, setActiveId] = useState(null);
      const [userAnswers, setUserAnswers] = useState({});
      const [showResult, setShowResult] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');

      const currentTest = data.find(item => item.id === activeId);

      // Lọc bài thi theo từ khóa tìm kiếm
      const filteredTests = data.filter(t => 
        (t.title || '').toLowerCase().includes(searchTerm.toLowerCase())
      );

      // Màn hình 1: Danh sách bài thi Reading
      if (!currentTest) {
        return (
          <Shell>
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 className="text-2xl font-black">Kho đề IELTS Reading</h2>
                <p className="text-sm text-slate-400 mt-1">
                  Đầy đủ Passage, bộ câu hỏi trắc nghiệm A/B/C/D và giải thích chi tiết
                </p>
              </div>
              <div className="w-full sm:w-72">
                <input
                  type="text"
                  placeholder="Tìm kiếm bài đọc..."
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm outline-none focus:border-indigo-500 shadow-sm"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
              {filteredTests.length === 0 ? (
                <div className="p-10 text-center col-span-3 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 text-slate-400">
                  {data.length === 0 
                    ? 'Chưa tìm thấy dữ liệu. Hãy đảm bảo file reading-data.js đã được tải về cùng thư mục với file HTML.' 
                    : 'Không tìm thấy bài thi phù hợp với từ khóa.'}
                </div>
              ) : (
                filteredTests.map((item, idx) => (
                  <div
                    key={item.id || idx}
                    onClick={() => {
                      setActiveId(item.id);
                      setUserAnswers({});
                      setShowResult(false);
                    }}
                    className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 hover:shadow-md cursor-pointer transition flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex items-center justify-between text-xs font-bold text-slate-400 mb-2">
                        <span>ĐỀ #{idx + 1}</span>
                        <span className="text-indigo-600 dark:text-indigo-400">IELTS Reading</span>
                      </div>
                      <h3 className="font-bold text-base text-slate-900 dark:text-white leading-snug">
                        {item.title}
                      </h3>
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 font-semibold">
                      <span>{(item.questions && item.questions.length) || item.total_questions || 0} câu hỏi</span>
                      <span className="text-indigo-600 dark:text-indigo-400 font-bold">Làm bài →</span>
                    </div>
                  </div>
                ))
              )}
            </div>
          </Shell>
        );
      }

      // Xử lý chọn đáp án
      const handleSelectOption = (qIdx, optChar) => {
        if (showResult) return;
        setUserAnswers(prev => ({ ...prev, [qIdx]: optChar }));
      };

      const qList = currentTest.questions || [];
      const correctCount = qList.filter((q, idx) => {
        const uAns = (userAnswers[idx] || '').trim().toUpperCase();
        const cAns = (q.answer || '').trim().toUpperCase();
        return uAns && (uAns === cAns || cAns.startsWith(uAns));
      }).length;

      // Màn hình 2: Giao diện thi (Cột trái: Passage, Cột phải: Questions)
      return (
        <Shell className="max-w-[1380px]">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-2">
            <button
              onClick={() => setActiveId(null)}
              className="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs font-bold shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-1.5"
            >
              <Icon name="arrowLeft" className="w-4 h-4" />
              <span>Danh sách bài thi</span>
            </button>
            <div className="flex items-center gap-2">
              {!showResult ? (
                <button
                  onClick={() => setShowResult(true)}
                  disabled={qList.length === 0}
                  className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow transition disabled:opacity-40"
                >
                  ✓ Nộp bài & Chấm điểm
                </button>
              ) : (
                <button
                  onClick={() => {
                    setUserAnswers({});
                    setShowResult(false);
                  }}
                  className="px-5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs hover:bg-slate-200 transition"
                >
                  ↻ Làm lại bài này
                </button>
              )}
            </div>
          </div>

          <div className="flex flex-wrap items-baseline justify-between gap-2 border-b border-slate-100 dark:border-slate-800 pb-3 mb-3">
            <h2 className="text-2xl font-black text-slate-900 dark:text-white truncate">
              {currentTest.title}
            </h2>
            {showResult && (
              <span className="text-sm font-black px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 border border-emerald-200 dark:border-emerald-800">
                Kết quả: {correctCount} / {qList.length} câu đúng ({qList.length ? Math.round(correctCount * 100 / qList.length) : 0}%)
              </span>
            )}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
            {/* Cột trái: ĐOẠN VĂN (PASSAGE) */}
            <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 h-[74vh] overflow-y-auto shadow-sm">
              <div className="sticky top-0 bg-white dark:bg-slate-900 pb-2 mb-3 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs font-black uppercase tracking-wider text-slate-400">
                <span>Reading Passage</span>
                <span>{currentTest.passage ? currentTest.passage.length : 0} ký tự</span>
              </div>
              <div className="leading-relaxed whitespace-pre-line text-sm md:text-base text-slate-800 dark:text-slate-200 select-text font-serif">
                {currentTest.passage || 'Nội dung bài đọc chưa được tải.'}
              </div>
            </div>

            {/* Cột phải: CÂU HỎI & LỰA CHỌN */}
            <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 h-[74vh] overflow-y-auto space-y-4 shadow-sm">
              <div className="sticky top-0 bg-white dark:bg-slate-900 pb-2 mb-2 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs font-black uppercase tracking-wider text-slate-400">
                <span>Questions ({qList.length})</span>
                <span>{Object.keys(userAnswers).length} / {qList.length} đã trả lời</span>
              </div>

              {qList.length === 0 ? (
                <div className="p-6 text-center text-xs text-slate-400">
                  Chưa có danh sách câu hỏi cho bài này.
                </div>
              ) : (
                qList.map((q, idx) => {
                  const selectedOpt = (userAnswers[idx] || '').trim().toUpperCase();
                  const targetAns = (q.answer || '').trim().toUpperCase();
                  const isCorrect = selectedOpt && (selectedOpt === targetAns || targetAns.startsWith(selectedOpt));

                  return (
                    <div
                      key={idx}
                      className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80 text-xs space-y-3"
                    >
                      <p className="font-bold text-slate-900 dark:text-slate-100 text-sm leading-snug">
                        {q.question.startsWith('Câu') ? q.question : `Câu ${idx + 1}: ${q.question}`}
                      </p>

                      {/* Hiển thị các lựa chọn A, B, C, D */}
                      {q.options && q.options.length > 0 && (
                        <div className="space-y-1.5 pt-1">
                          {q.options.map((opt, oIdx) => {
                            const optMatch = opt.match(/^([A-D])[\.\:\s]/i);
                            const optChar = optMatch ? optMatch[1].toUpperCase() : String.fromCharCode(65 + oIdx);
                            const isPicked = selectedOpt === optChar;

                            let optStyle = "border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300";

                            if (isPicked) {
                              optStyle = "border-indigo-600 bg-indigo-50 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 font-bold ring-1 ring-indigo-500";
                            }

                            if (showResult) {
                              if (optChar === targetAns || targetAns.startsWith(optChar)) {
                                optStyle = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-bold";
                              } else if (isPicked && !isCorrect) {
                                optStyle = "border-rose-500 bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 line-through";
                              }
                            }

                            return (
                              <button
                                key={oIdx}
                                type="button"
                                disabled={showResult}
                                onClick={() => handleSelectOption(idx, optChar)}
                                className={`w-full text-left p-3 rounded-xl border text-xs transition flex items-start gap-2.5 ${optStyle}`}
                              >
                                <span className="font-mono font-bold shrink-0">{optChar}.</span>
                                <span className="flex-1 leading-relaxed">
                                  {opt.replace(/^[A-D][\.\:\s]+/i, '')}
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      )}

                      {/* Hiển thị đáp án và lời giải thích khi nộp bài */}
                      {showResult && (
                        <div className="mt-3 pt-2.5 border-t border-slate-200 dark:border-slate-700 space-y-1">
                          <p className={`font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-500'}`}>
                            {isCorrect ? '✓ Đúng' : `✗ Chưa chính xác (Đáp án đúng: ${q.answer})`}
                          </p>
                          {q.explanation && (
                            <p className="text-slate-500 dark:text-slate-400 italic leading-relaxed text-[11px] pt-1">
                              💡 Giải thích: {q.explanation}
                            </p>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </Shell>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
   root.render(<Root />);
    // Bật lại hiệu ứng chuyển màu sau khi khung hình đầu tiên đã vẽ xong
    requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.add('app-ready')));
  </script>

</body>
</html>
